"oppenheimer":{syn:"داستان رابرت اوپنهایمر و ساخت بمب اتم؛ مردی که جهان را نجات داد و شاید نابودش کرد.",en:"Oppenheimer",y:2023,g:"زندگی‌نامه، درام",imdb:"8.3",b:"دوبله",why:"ساخته‌شده برای پرده‌ی بزرگ"},
"poor-things":{syn:"بلا، زنی که دانشمندی عجیب او را دوباره زنده کرده، از خانه فرار می‌کند تا دنیا و خودش را کشف کند.",en:"Poor Things",y:2023,g:"کمدی، فانتزی",imdb:"7.8",b:"زیرنویس",why:"دنیایی که جای دیگری ندیده‌اید"},
"the-last-of-us":{syn:"بیست سال بعد از فروپاشی تمدن، جوئل مأمور می‌شود الی نوجوان را از میان آمریکای ویران‌شده عبور دهد.",en:"The Last of Us",y:2023,g:"درام، ماجراجویی",imdb:"8.6",b:"دوبله",why:"درام پرتعلیق"},

  S.wl=S.wl||"sub";S.wq=S.wq||"1080p";
  const sh=document.getElementById("sheet");
  const draw=()=>{sh.innerHTML=`<div class="hd"><h3>دانلود کل فصل ${fa(S.season)} · ${fa(ne)} قسمت</h3><button class="rb gl" data-close>${I("x")}</button></div>

  draw();
  sh.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.wl){S.wl=b.dataset.wl;draw()}if(b.dataset.wq){S.wq=b.dataset.wq;draw()}if(b.dataset.close!==undefined)closePop();if(b.dataset.act==="copy"){closePop();toast("لینک‌های "+fa(ne)+" قسمت کپی شد")}};
  document.getElementById("pop").classList.add("on");
}
function closePop(){document.getElementById("pop").classList.remove("on")}
document.getElementById("pop").addEventListener("click",e=>{if(e.target.id==="pop")closePop()});

function render(keep){
  const y=scrollY;
  document.getElementById("app").innerHTML=hero()+tabs()+`<main class="wrap">`+(KIND==="series"?seriesDl():filmDl())+trailers()+about()+music()+comments()+similar()+ulists()+`</main>`+dstate()+footer()+mnav();
  if(keep)scrollTo(0,y);
  bind();
}
function bind(){
  const app=document.getElementById("app");
  const v=document.getElementById("tv");
  document.getElementById("tpause").onclick=()=>{v.paused?v.play():v.pause()};
  document.getElementById("tmute").onclick=()=>{v.muted=!v.muted;toast(v.muted?"صدای تریلر بسته شد":"صدای تریلر باز شد")};
  spy();
}
app.onclick=e=>{
  const b=e.target.closest("[data-v],[data-r],[data-q] .qh,[data-season],[data-dl],[data-open],[data-tr],[data-topic],[data-f],[data-s],[data-spoil],[data-cl],[data-act],#more,#recapb,#lst,#bmk,#facts,#wholes,.lock button");
  if(!b)return;
  if(b.matches("a[href='#']"))e.preventDefault();
  const d=b.dataset;
  if(d.v){if(ACCESS==="guest")return toast("برای رأی دادن وارد شوید");S.vote=S.vote===+d.v?0:+d.v;return render(1)}
  if(d.r){S.mine=+d.r;toast("امتیاز شما ثبت شد");return render(1)}
  if(b.classList.contains("qh")){const q=b.parentNode.dataset.q;S.openQ=S.openQ===q?null:q;return render(1)}
  if(d.season){S.season=+d.season;S.openEp=null;S.dlEp=null;return render(1)}
  if(d.dl){const n=+d.dl;if(ACCESS!=="sub")return toast("دانلود برای مشترک‌هاست");S.dlEp=S.dlEp===n?null:n;return render(1)}
  if(d.open){const n=+d.open;S.openEp=S.openEp===n?null:n;return render(1)}
  if(d.tr!==undefined){S.tr=+d.tr;return render(1)}
  if(d.topic!==undefined){S.topic=+d.topic;return render(1)}
  if(d.f){S.filt=d.f;return render(1)}
  if(d.s){S.sort=d.s;return render(1)}
  if(d.spoil){S.spoil[d.spoil]=1;return render(1)}
  if(d.cl){if(ACCESS==="guest")return toast("برای رأی دادن وارد شوید");S.cv[d.cl]=S.cv[d.cl]===+d.d?0:+d.d;return render(1)}
  if(d.act==="dl"){e.preventDefault();if(ACCESS!=="sub")return toast("دانلود برای مشترک‌هاست");return toast("دانلود شروع شد")}
  if(d.act==="report")return toast("گزارش شما ثبت شد");
  if(d.act==="teaser"){return toast("پخش تیزر")}
  if(d.act==="play")return toast("پخش قسمت");
  if(b.id==="more"){S.story=!S.story;return render(1)}
  if(b.id==="recapb"){S.recap=!S.recap;return render(1)}
  if(b.id==="lst"){S.list=!S.list;toast(S.list?"به لیست من اضافه شد":"از لیست من برداشته شد");return render(1)}
  if(b.id==="bmk"){S.mark=!S.mark;toast(S.mark?"نشان شد":"نشان برداشته شد");return render(1)}
  if(b.id==="facts"){S.factsAll=!S.factsAll;return render(1)}
  if(b.id==="wholes"){if(ACCESS!=="sub")return toast("دانلود برای مشترک‌هاست");return wholeSheet()}
  if(b.matches(".lock button"))return toast(ACCESS==="guest"?"صفحه‌ی ورود":"صفحه‌ی خرید اشتراک");
};
function spy(){
  const ids=CH().map(c=>c[0]);
  const f=()=>{let cur=ids[0];for(const id of ids){const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<180)cur=id}
    document.querySelectorAll("#tabs a").forEach(a=>{const on=a.dataset.t===cur;if(on!==a.classList.contains("on")){a.classList.toggle("on",on);if(on)a.scrollIntoView({block:"nearest",inline:"center"})}})};
  removeEventListener("scroll",window.__spy||(()=>{}));window.__spy=f;addEventListener("scroll",f,{passive:true});f();
}
if(T.next){let left=T.next.in;setInterval(()=>{left--;const el=document.getElementById("cd");if(!el)return;const d=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60);el.innerHTML=`<span>${fa(m)}<small>دقیقه</small></span><span>${fa(h)}<small>ساعت</small></span><span>${fa(d)}<small>روز</small></span>`},30000)}
hdr();render();
</script>
</body>
