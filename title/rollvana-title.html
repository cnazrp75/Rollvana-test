main{padding-bottom:80px}
.row{margin-top:44px}
.row:first-child{margin-top:20px}
.rh h2{font-size:22px}
.more{font-size:14px}
.sc{gap:20px}
.card{width:184px}
.peek{display:flex;justify-content:space-between;align-items:flex-end;position:absolute;inset:auto 0 0 0;padding:64px 12px 10px;font-size:12px;color:var(--ink);background:linear-gradient(to top,rgba(5,5,6,.95) 30%,transparent)}
.ct{font-size:14px}
.arr{display:grid;place-items:center;position:absolute;top:calc(50% - 30px);z-index:3;width:48px;height:48px;border-radius:50%;background:color-mix(in oklab,var(--bg) 70%,rgba(243,239,232,.1));backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--line2),0 10px 30px -10px rgba(0,0,0,.7);color:var(--ink)}
.arr.l{left:20px}.arr.r{right:20px}
.gen{width:240px;height:128px;padding:18px 20px}
.gen b{font-size:20px}
.tabs{display:none}
}
/* ---- title page ---- */
.top{position:relative;min-height:min(86svh,760px);display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;overflow:hidden}
.top .bgl{inset:0}
.top .bgl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top .grade{background:linear-gradient(to bottom,rgba(5,5,6,.55) 0,rgba(5,5,6,0) 120px),linear-gradient(to bottom,transparent 28%,color-mix(in oklab,var(--bg) 72%,transparent) 58%,var(--bg) 96%)}
.tc{position:relative;padding:0 var(--pad) 8px;display:flex;flex-direction:column;gap:0}
.tc .kick{margin-bottom:12px}
.tlogo{height:84px;display:flex;align-items:flex-end}
.tlogo img{max-height:84px;max-width:min(300px,80vw);object-fit:contain;object-position:right bottom}
.tc h1{font-size:18px;font-weight:700;margin-top:12px}
.tc h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3);direction:ltr;text-align:right;margin-top:2px;letter-spacing:.01em}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.tmeta .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.age{height:20px;padding:0 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:11px;display:inline-flex;align-items:center}
.scores{display:flex;gap:18px;margin-top:14px}
.score{display:flex;align-items:baseline;gap:6px;direction:ltr}
.score b{font-size:17px;font-weight:700;color:var(--ink-1)}
.score small{font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--ink-3)}
.score i{font-style:normal;font-size:12px;color:var(--ink-3)}

.play{margin-top:20px;width:100%;height:52px;border-radius:var(--r-pill);background:var(--light);color:var(--on-light);font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;transition:background var(--d-2) var(--e-out)}
.play:hover{background:var(--light-hi)}
.play svg{width:17px;height:17px;fill:currentColor;stroke:none}
.play .pg{position:absolute;inset:auto 22px 9px 22px;height:3px;border-radius:3px;background:rgba(18,10,36,.22);overflow:hidden}
.play .pg i{position:absolute;inset:0;background:var(--on-light);transform-origin:right center;border-radius:3px}
.why{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:10px}
.why a{color:var(--ink-1);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.acts{display:flex;justify-content:space-around;margin-top:18px}
.act2{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-width:76px;padding:4px 0}
.act2 .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(242,239,248,.08);color:var(--ink-1);transition:background .25s}
.act2:hover .c{background:rgba(242,239,248,.14)}
.act2 .lab{height:18px;position:relative;display:grid}
.act2 .lab>*{grid-area:1/1;white-space:nowrap}

.body{position:relative;z-index:2;padding-bottom:110px}
.sec{padding:0 var(--pad);margin-top:36px}
.sec>h2{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec>h2 small{font-size:12.5px;font-weight:500;color:var(--ink-3)}
.synp{font-size:14.5px;line-height:1.95;color:var(--ink-2);overflow:hidden;position:relative}
.more2{font-size:13px;color:var(--ink-1);margin-top:6px;height:32px;display:inline-flex;align-items:center;gap:4px}
.more2 svg{width:16px;height:16px;transition:transform .3s var(--e-out)}
.facts{display:flex;flex-direction:column;gap:10px;margin-top:16px;font-size:13.5px}
.facts div{display:flex;gap:12px}
.facts dt{color:var(--ink-3);width:64px;flex:none}
.facts dd{color:var(--ink-1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:26px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:var(--r-pill);background:rgba(242,239,248,.07);font-size:12px;color:var(--ink-1)}
.chip svg{width:13px;height:13px;stroke-width:2.4;color:var(--ink-2)}

.cast{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:2px var(--pad) 6px;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad)}
.cast::-webkit-scrollbar{display:none}
.person{flex:none;width:80px;text-align:center;scroll-snap-align:start}
.person .ph{width:72px;height:72px;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--night-2);box-shadow:inset 0 0 0 1px var(--line-1)}
.person .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--e-out)}
.person:hover .ph img{transform:scale(1.06)}
.person b{display:block;font-size:12.5px;font-weight:600;margin-top:8px;line-height:1.5}
.person small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5}

.seg2{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:rgba(242,239,248,.06);position:relative}
.seg2 button{position:relative;height:36px;padding:0 16px;border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--ink-2);transition:color .25s;z-index:1;white-space:nowrap}
.seg2 button[aria-pressed=true]{color:var(--ink-1)}
.seg2 .ind{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(242,239,248,.12);z-index:-1}
.dls{margin-top:14px;border-radius:var(--r-l);background:var(--night-1);box-shadow:inset 0 0 0 1px var(--line-1);overflow:hidden;position:relative}
.dl{display:flex;align-items:center;gap:14px;height:64px;padding:0 16px;border-top:1px solid var(--line-1)}
.dl:first-child{border-top:0}
.dl .q{direction:ltr;text-align:right;min-width:64px}
.dl .q b{display:block;font-size:15px;font-weight:700}
.dl .q small{display:block;font-size:11px;color:var(--ink-3);margin-top:-2px}
.dl .sz{flex:1;font-size:13px;color:var(--ink-2)}
.dlb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(242,239,248,.08);color:var(--ink-1);transition:background .25s}
.dlb:hover{background:rgba(242,239,248,.15)}
.dlb svg{width:19px;height:19px}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:color-mix(in oklab,var(--night-1) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lock p{font-size:13.5px;color:var(--ink-1);max-width:30ch}
.lock .cta{height:44px;font-size:14px;padding:0 20px}

.rev{border-radius:var(--r-l);background:var(--night-1);box-shadow:inset 0 0 0 1px var(--line-1);padding:18px}
.rev .tone{font-size:14.5px;line-height:1.9;color:var(--ink-1)}
.rev .cols{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px}
.rev h3{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rev ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.rev li{font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.rev li:before{content:"";width:5px;height:5px;border-radius:50%;flex:none;transform:translateY(-2px);background:var(--ink-2)}
.rev .neg li:before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.rev .src{font-size:11.5px;color:var(--ink-3);margin-top:16px;padding-top:12px;border-top:1px solid var(--line-1)}
.ai{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:rgba(242,239,248,.08);color:var(--ink-2);direction:ltr}

.trk{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 0;border-top:1px solid var(--line-1)}
.trk:first-child{border-top:0}
.trk .no{width:20px;font-size:12px;color:var(--ink-3);text-align:center}
.trk .tt{flex:1;min-width:0}
.trk .tt b{display:block;font-size:14px;font-weight:600;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tt small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{height:36px;padding:0 12px;border-radius:var(--r-pill);background:rgba(242,239,248,.08);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-1);white-space:nowrap;transition:background .25s}
.tg:hover{background:rgba(242,239,248,.15)}
.tg svg{width:15px;height:15px}

.rate{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:var(--r-l);background:var(--night-1);box-shadow:inset 0 0 0 1px var(--line-1);flex-wrap:wrap}
.avg{display:flex;align-items:baseline;gap:4px}
.avg b{font-size:34px;font-weight:700;line-height:1}
.avg span{font-size:13px;color:var(--ink-3)}
.avg+small{font-size:12px;color:var(--ink-3)}
.mine{width:100%;border-top:1px solid var(--line-1);padding-top:14px}
.mine>span{font-size:13px;color:var(--ink-2);display:block;margin-bottom:10px}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.stars button{flex:1;max-width:32px;height:40px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-3);border-radius:8px;position:relative}
.stars button i{position:absolute;inset:auto 3px 6px 3px;height:4px;border-radius:4px;background:rgba(242,239,248,.14)}
.stars button i b{position:absolute;inset:0;border-radius:4px;background:var(--light);transform-origin:left center}
.stars button.on{color:var(--ink-1)}
.write{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.write textarea{all:unset;box-sizing:border-box;width:100%;min-height:52px;padding:14px 16px;border-radius:14px;background:rgba(242,239,248,.06);box-shadow:inset 0 0 0 1px var(--line-1);font:14px/1.8 var(--f);color:var(--ink-1);white-space:pre-wrap;transition:box-shadow .25s,min-height .3s var(--e-out)}
.write textarea:focus{box-shadow:inset 0 0 0 1px var(--light);min-height:104px}
.write textarea::placeholder{color:var(--ink-3)}
.write .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-3)}
.write .bar label{display:flex;align-items:center;gap:8px;height:36px;cursor:pointer}
.write .send{height:38px;padding:0 18px;border-radius:var(--r-pill);background:var(--ink-1);color:var(--night-0);font-size:13.5px;font-weight:600}
.write .send[disabled]{background:rgba(242,239,248,.1);color:var(--ink-4);cursor:not-allowed}
.guest{margin-top:14px;padding:16px;border-radius:14px;background:rgba(242,239,248,.05);font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.guest a{height:38px;padding:0 16px;border-radius:var(--r-pill);background:rgba(242,239,248,.1);color:var(--ink-1);display:inline-flex;align-items:center;font-weight:600;white-space:nowrap}
.sorts{margin-top:20px}
.cmt{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line-1)}
.cmt .av2{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--night-3);font-size:14px;font-weight:600;color:var(--ink-1)}
.cmt .bd{flex:1;min-width:0}
.cmt .hd{display:flex;align-items:center;gap:8px;font-size:13px}
.cmt .hd b{font-weight:600}
.cmt .hd small{color:var(--ink-3);font-size:12px}
.cmt .hd .ur{margin-inline-start:auto;font-size:12px;color:var(--ink-2);direction:ltr}
.cmt p{font-size:14px;line-height:1.85;color:var(--ink-2);margin-top:4px}
.cmt .ft{display:flex;gap:4px;margin-top:4px;margin-inline-start:-10px}
.cmt .ft button{height:36px;padding:0 10px;border-radius:999px;font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;transition:color .2s,background .2s}
.cmt .ft button:hover{color:var(--ink-1);background:rgba(242,239,248,.06)}
.cmt .ft button.liked{color:var(--ink-1)}
.cmt .ft svg{width:16px;height:16px}
.cmt .reply{margin-top:6px;padding:4px 0 0 0;border-inline-start:2px solid var(--line-1);padding-inline-start:14px}
.cmt .reply .cmt{border-top:0;padding:10px 0 0}
.spo{position:relative;cursor:pointer;border-radius:10px}
.spo .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--ink-1)}
.spo .veil span{padding:6px 12px;border-radius:999px;background:rgba(13,11,21,.8);box-shadow:inset 0 0 0 1px var(--line-2)}

.posters{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:4px var(--pad) 8px;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad)}
.posters::-webkit-scrollbar{display:none}
.pst{flex:none;width:118px;scroll-snap-align:start}
.pst .po{position:relative}
.pst b{display:block;font-size:12.5px;font-weight:600;margin-top:8px}
.pst small{display:block;font-size:11.5px;color:var(--ink-3)}
.pst .here{position:absolute;inset:auto 8px 8px 8px;height:24px;border-radius:999px;background:rgba(13,11,21,.82);font-size:11px;display:grid;place-items:center;color:var(--ink-1)}
.pst[aria-current=page] .po{box-shadow:0 0 0 2px var(--light)}

/* series */
.nextep{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(242,239,248,.07);font-size:13px}
.nextep .lbl{color:var(--ink-2);flex:1}
.nextep .lbl{font-size:11.5px;color:var(--ink-3)}
.nextep .lbl b{display:block;color:var(--ink-1);font-weight:600;font-size:13.5px}
.cd{display:flex;gap:6px;direction:ltr}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:34px}
.cd b{font-size:16px;font-weight:700;color:var(--ink-1);line-height:1;display:flex;direction:ltr}
.dg{position:relative;display:inline-grid;width:.66em;height:1.1em;overflow:hidden;justify-items:center;align-items:center;-webkit-mask:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.dg>span{grid-area:1/1}
.cd small{font-size:10px;color:var(--ink-3)}
.eph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.spochip{font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;margin-top:10px}
.spochip svg{width:14px;height:14px}
.eps{display:flex;flex-direction:column;margin-top:8px}
.ep{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line-1);text-align:right;width:100%;align-items:flex-start}
.ep:first-child{border-top:0}
.ep .cv{position:relative;flex:none;width:136px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--night-2)}
.ep .cv img{width:100%;height:100%;object-fit:cover}
.ep .cv .pg{position:absolute;inset:auto 0 0 0;height:3px;background:rgba(242,239,248,.25)}
.ep .cv .pg i{position:absolute;inset:0;background:var(--light);transform-origin:right center}
.ep .cv .done{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(13,11,21,.75);display:grid;place-items:center}
.ep .cv .done svg{width:13px;height:13px;stroke-width:2.6}
.ep .cv .now{position:absolute;inset:0;display:grid;place-items:center}
.ep .cv .now span{width:36px;height:36px;border-radius:50%;background:rgba(13,11,21,.6);backdrop-filter:blur(6px);display:grid;place-items:center}
.ep .cv .now svg{width:14px;height:14px;fill:#fff;stroke:none}
.ep .tx{flex:1;min-width:0}
.ep .tx b{display:block;font-size:14px;font-weight:600;line-height:1.6}
.ep .tx b em{font-style:normal;color:var(--ink-3);font-weight:500;margin-inline-end:6px}
.ep .tx small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.ep .tx p{font-size:12.5px;line-height:1.8;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep.watched .cv img{opacity:.55}
.ep .tr{margin-top:8px;height:30px;padding:0 10px;border-radius:999px;background:rgba(242,239,248,.08);font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--ink-1)}
.ep .tr svg{width:12px;height:12px;fill:currentColor;stroke:none}
.hid{filter:blur(10px);transition:filter .5s var(--e-out)}
.ep.up{opacity:.9}
.ep.up .cv{display:grid;place-items:center;background:var(--night-2);box-shadow:inset 0 0 0 1px var(--line-1)}
.ep.up .cv span{font-size:11.5px;color:var(--ink-2)}
.seasondl{height:40px;padding:0 14px;border-radius:var(--r-pill);background:rgba(242,239,248,.08);font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-1);transition:background .25s}
.seasondl:hover{background:rgba(242,239,248,.14)}
.seasondl svg{width:16px;height:16px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,2,7,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:61;max-height:90svh;overflow:auto;border-radius:24px 24px 0 0;background:var(--night-1);box-shadow:inset 0 1px 0 var(--line-2),0 -30px 80px -20px rgba(0,0,0,.8);padding:0 0 calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet .grab{position:sticky;top:0;z-index:2;height:28px;display:grid;place-items:center;background:linear-gradient(var(--night-1) 60%,transparent)}
.sheet .grab i{width:40px;height:4px;border-radius:4px;background:var(--line-2)}
.sheet .x{position:absolute;top:10px;left:12px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(13,11,21,.6);color:var(--ink-1)}
.sheet .in{padding:0 20px}
.sheet .hero2{aspect-ratio:16/9;border-radius:16px;overflow:hidden;margin:0 20px}
.sheet .hero2 img{width:100%;height:100%;object-fit:cover}
.sheet h3{font-size:17px;font-weight:700;margin-top:16px}
.sheet h3 em{font-style:normal;color:var(--ink-3);font-weight:500;font-size:13px;display:block}
.sheet .meta2{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.sheet p.full{font-size:14px;line-height:1.95;color:var(--ink-2);margin-top:10px}
.sheet h4{font-size:14px;font-weight:700;margin:22px 0 10px}
.links{font:12px/2 ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr;text-align:left;white-space:pre;overflow:auto;padding:12px 14px;border-radius:12px;background:var(--night-0);box-shadow:inset 0 0 0 1px var(--line-1);color:var(--ink-2);max-height:180px}
.copyall{margin-top:10px;width:100%;height:48px;border-radius:var(--r-pill);background:var(--ink-1);color:var(--night-0);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.copyall svg{width:17px;height:17px}
.copyall .lab{display:grid}.copyall .lab>*{grid-area:1/1}
.qs{display:flex;gap:6px;flex-wrap:wrap}

  return html`<${Sheet} onClose=${onClose} label="دانلود کل فصل">
    <div class="in" style=${{paddingTop:8}}>
      <h3><em>${t.fa}</em>دانلود کل فصل ${fa(s)}</h3>
      <div class="meta2">${fa(eps.length)} قسمت · مجموع حدود <${Size} v=${size}/></div>
      <h4>نسخه</h4><${Seg} items=${[["dub","دوبله فارسی"],["sub","زیرنویس فارسی"]]} val=${ver} set=${setVer} id="sver"/>
      <h4>کیفیت</h4><div class="qs">${t.dl[ver].map(([k])=>html`<button key=${k} aria-pressed=${q===k} onClick=${()=>setQ(k)}>${k}</button>`)}</div>
      ${lock?html`<div class="guest" style=${{marginTop:22}}><span>${access==="guest"?"برای دانلود اول وارد شوید.":"دانلود با اشتراک فعال است."}</span><a href="#">${access==="guest"?"ورود":"خرید اشتراک"}</a></div>`
      :html`<h4>لینک‌ها برای IDM <small style=${{fontWeight:400,color:"var(--ink-3)"}}>· هر خط یک لینک</small></h4>
      <div class="links" tabIndex="0" aria-label="لیست لینک‌ها">${links}</div>
      <${motion.button} class="copyall" onClick=${copy} whileTap=${{scale:.98}}>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><${AnimatePresence} initial=${false} mode="wait"><${motion.g} key=${copied} initial=${{opacity:0,scale:.6}} animate=${{opacity:1,scale:1}} exit=${{opacity:0,scale:.6}} transition=${{duration:.18}} dangerouslySetInnerHTML=${{__html:copied?ICON.check:ICON.copy}}/></${AnimatePresence}></svg>
        <span class="lab"><${AnimatePresence} initial=${false}><${motion.span} key=${copied} initial=${{opacity:0,y:6}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-6}} transition=${{duration:.2}}>${copied?"کپی شد":"کپی همه‌ی لینک‌ها"}</${motion.span}></${AnimatePresence}></span>
      </${motion.button}>`}
    </div>
  </${Sheet}>`;
}

function Skel({desk}){
  return html`<div aria-busy="true"><section class="top" style=${{background:"var(--bg)"}}><div class="tc">
    <div class="sk" style=${{width:140,height:14,marginBottom:16}}></div><div class="sk" style=${{width:desk?380:240,height:desk?100:70}}></div>
    <div class="sk" style=${{width:180,height:18,marginTop:16}}></div><div class="sk" style=${{width:220,height:14,marginTop:12}}></div>
    <div class="sk" style=${{width:desk?220:"100%",height:52,marginTop:22,borderRadius:999}}></div>
    <div style=${{display:"flex",gap:40,justifyContent:desk?"flex-start":"center",marginTop:20}}>${[0,1,2].map(k=>html`<div class="sk" key=${k} style=${{width:48,height:48,borderRadius:"50%"}}></div>`)}</div></div></section>
    <div class="sec"><div class="sk" style=${{width:80,height:18}}></div><div class="sk" style=${{height:14,marginTop:16}}></div><div class="sk" style=${{height:14,marginTop:10,width:"80%"}}></div></div></div>`;
}

function Review2({st,set}){
  const G=[["kind","صفحه",[["film","فیلم"],["series","سریال"]]],["access","کاربر",[["guest","مهمان"],["nosub","بدون اشتراک"],["sub","با اشتراک"]]],["prog","پیشرفت",[[1,"دیده تا وسط"],[0,"شروع نکرده"]]],["spoil","بدون اسپویل",[[0,"خاموش"],[1,"روشن"]]]];
  return html`<section class="review" aria-label="حالت‌های طرح"><span>حالت‌های طرح (فقط برای بررسی)</span>
    ${G.map(([k,l,o])=>html`<div class="grp"><span>${l}</span><div>${o.map(([v,ll])=>html`<button aria-pressed=${st[k]===v} onClick=${()=>{set({...st,[k]:v});if(k==="kind")scrollTo({top:0})}}>${ll}</button>`)}</div></div>`)}
    <div><button onClick=${()=>{set({...st,load:1});scrollTo({top:0});setTimeout(()=>set(s=>({...s,load:0})),1600)}}>بارگذاری</button></div>
    <a class="syslink" href="../home/home-v3.html">← صفحه‌ی خانه</a>
  </section>`;
}

const TITLE_ASSETS=[FILM,SERIES_T].flatMap(t=>[M("b-"+t.s+".jpg"),M("l-"+t.s+".png")]).concat([1,2].flatMap(s=>SEV_EP[s].map((_,k)=>M("e-sev-"+s+"-"+(k+1)+".jpg")))).concat([0,1,2,3,4,5,6,7].flatMap(k=>[M("c-dune-"+k+".jpg"),M("c-sev-"+k+".jpg")]));
const T_READY=Promise.race([Promise.all(TITLE_ASSETS.map(src=>new Promise(r=>{const i=new Image();i.onload=()=>(i.decode?i.decode().catch(()=>{}):Promise.resolve()).then(r);i.onerror=r;i.src=src}))),new Promise(r=>setTimeout(r,10000))]);

function App(){
  const desk=useDesk();const reduced=useReducedMotion();
  const [st,setSt]=useState({kind:(Q.get("kind")||new URLSearchParams(location.hash.slice(1)).get("kind"))==="series"?"series":"film",access:Q.get("access")||"sub",prog:Q.get("prog")==="0"?0:1,spoil:Q.get("spoil")==="1"?1:0,load:Q.get("load")==="0"?0:1});
  useEffect(()=>{if(!st.load)return;Promise.all([T_READY,new Promise(r=>setTimeout(r,900))]).then(()=>setSt(s=>({...s,load:0})))},[]);
  const [ep,setEp]=useState(null);const [season,setSeason]=useState(null);
  const [tab,setTab]=useState(st.kind==="series"?"eps":"dl");useEffect(()=>setTab(st.kind==="series"?"eps":"dl"),[st.kind]);
  const [msg,setMsg]=useState(null);const tm=useRef();const say=m=>{setMsg(m);clearTimeout(tm.current);tm.current=setTimeout(()=>setMsg(null),2000)};
  const t=st.kind==="film"?FILM:SERIES_T;const prog=!!st.prog&&st.access==="sub";
  const sp={on:!!st.spoil,set:v=>setSt(s=>({...s,spoil:v?1:0}))};
  return html`<${Spoil.Provider} value=${sp}>
    <${Header} user=${st.access!=="guest"} desk=${desk}/>
    <${AnimatePresence} mode="wait" initial=${false}>
      <${motion.div} key=${st.load?"sk":st.kind} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.3}}>
      ${st.load?html`<${Skel} desk=${desk}/>`:html`
        <${Top} t=${t} access=${st.access} prog=${prog} desk=${desk} reduced=${reduced} toast=${say}/>
        <div class="body">
          <${Audience} key=${t.s+prog} t=${t} prog=${prog}/>
          <div class="sec tabsw"><${PageTabs} items=${t.kind==="series"?[["eps","قسمت‌ها"],["about","درباره"],["cmt","نظرها"],["more","مشابه"]]:[["dl","دانلود"],["about","درباره"],["cmt","نظرها"],["more","مشابه"]]} val=${tab} set=${setTab}/></div>
          <${AnimatePresence} mode="wait" initial=${false}>
            <${motion.div} key=${tab} class="pane" initial=${{opacity:0,y:6}} animate=${{opacity:1,y:0}} exit=${{opacity:0,transition:{duration:.12}}} transition=${{duration:.3,ease:EASE}}>
              ${tab==="eps"&&html`<${Episodes} t=${t} prog=${prog} access=${st.access} onOpen=${(s,e)=>setEp([s,e])} onSeason=${s=>setSeason(s)}/>`}
              ${tab==="dl"&&html`<${Downloads} t=${t} access=${st.access} title=""/>`}
              ${tab==="about"&&html`<${About} t=${t}/><${Cast} t=${t}/><${Music} t=${t}/>`}
              ${tab==="cmt"&&html`<${Comments} t=${t} access=${st.access}/>`}
              ${tab==="more"&&html`${t.kind==="film"&&html`<${Posters} title="مجموعه‌ی تلماسه" items=${t.franchise} cur=${t.s}/>`}<${Posters} title="عنوان‌های مشابه" items=${t.similar}/>`}
            </${motion.div}>
          </${AnimatePresence}>
          <${Review2} st=${st} set=${setSt}/>
        </div>`}
      </${motion.div}>
    </${AnimatePresence}>
    <${AnimatePresence}>
      ${ep&&html`<${EpisodeSheet} key="ep" t=${t} s=${ep[0]} e=${ep[1]} access=${st.access} onClose=${()=>setEp(null)}/>`}
      ${season&&html`<${SeasonSheet} key="ss" t=${t} s=${season} access=${st.access} onClose=${()=>setSeason(null)}/>`}
    </${AnimatePresence}>
    <${Toast} msg=${msg}/>
    ${!desk&&html`<${Tabs}/>`}
  </${Spoil.Provider}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);

</script>
</body></html>
