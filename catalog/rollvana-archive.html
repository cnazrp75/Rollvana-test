function tween(el,from,to){
if(!el)return;
if(RM.matches||from===to){el.textContent=grp(to);return}
const t0=performance.now(),d=320;
cancelAnimationFrame(el._r);
const st=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=grp(from+(to-from)*e);if(k<1)el._r=requestAnimationFrame(st)};
el._r=requestAnimationFrame(st);
}

function update(opts){
opts=opts||{};
const old=$('#cnt'),from=old?+old.dataset.v:0;
$('#am').innerHTML=metaHTML();
const nc=$('#cnt');if(nc&&old)tween(nc,from,+nc.dataset.v);
$('#tools').innerHTML=toolsHTML();
if(opts.chips!==false){$('#gr').innerHTML=chipsHTML()}
$('#ap').innerHTML=appliedHTML();$('#ap').hidden=!extra(S.f);
$('#nt').innerHTML=noticeHTML();
$('#pg').innerHTML=pagerHTML();
$('#rv').innerHTML=reviewHTML();
const res=$('#res');
res.classList.toggle('is-emp',!count(S.f)&&!S.loading);
res.setAttribute('aria-busy',S.loading);
if(opts.swap!==false)swap(resultsHTML());
$('#live').textContent=S.loading?'':(count(S.f)?grp(count(S.f))+' '+K().one:'بدون نتیجه');
}

function swap(html){
const res=$('#res');
res.querySelectorAll('.ghost').forEach(g=>g.remove());
const old=res.firstElementChild;
const nw=document.createElement('div');nw.innerHTML=html;
if(old&&!RM.matches){old.classList.remove('fresh');old.classList.add('ghost');setTimeout(()=>old.remove(),340);nw.className='fresh'}else if(old)old.remove();
res.appendChild(nw);
}

}

function preset(s){

if(s==='list')S.view='list';
const P=()=>pages(S.f);
if(s==='mid')S.page=Math.ceil(P()/2);
if(s==='last')S.page=P();
if(s==='oor'){S.req=999;S.page=P()}
if(s==='sort')S.sortOpen=true;
if(s==='genre')S.f.genres=['drama'];
if(s==='filter'){S.sheet=true;D=Object.assign(blank(),{yr:[2010,K().yr[1]],imdb:8,dub:'yes'})}
if(s==='applied')Object.assign(S.f,{yr:[2010,K().yr[1]],imdb:8,dub:'yes'});
if(s==='empty')Object.assign(S.f,{genres:['animation'],countries:['kr']});
if(s==='loading')S.loading=true;

}
