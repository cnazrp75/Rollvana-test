<style>

@property --acc{syntax:"<color>";inherits:true;initial-value:#b8864a}
:root{
--night-0:#07060C;
--night-1:#0D0B15;
--night-2:#15121F;
--night-3:#1E1A2B;
--ink-1:#F2EFF8;
--ink-2:rgba(242,239,248,.72);
--ink-3:rgba(242,239,248,.50);
--ink-4:rgba(242,239,248,.28);
--line-1:rgba(205,190,255,.10);
--line-2:rgba(205,190,255,.22);
--light:#A98BFF;
--light-top:#C3ADFF;
--light-hi:#CDBBFF;
--light-lo:rgba(169,139,255,.18);
--light-glow:rgba(150,110,255,.45);
--on-light:#120A24;
--ok:#5BD69A;--warn:#F2C14E;--err:#FF6B7A;

--acc:#b8864a;
--page:color-mix(in oklab,var(--acc) 6%,var(--night-0));
--page-up:color-mix(in oklab,var(--acc) 8%,var(--night-2));

--lit-0:none;
--lit-1:0 0 0 1px var(--light-lo),0 6px 18px -10px var(--light-glow);
--lit-2:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px -14px var(--light-glow);
--lit-3:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px -12px var(--light-glow);

--r-s:6px;--r-m:12px;--r-l:20px;--r-pill:999px;
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-12:48px;--s-16:64px;

--f-ui:Vazirmatn,system-ui,sans-serif;

--t-display:700 32px/1.25 var(--f-ui);
--t-h1:700 22px/1.4 var(--f-ui);
--t-h2:700 18px/1.5 var(--f-ui);
--t-body:400 14px/1.85 var(--f-ui);
--t-label:500 13px/1.4 var(--f-ui);
--t-small:500 12px/1.4 var(--f-ui);
--t-micro:500 11px/1.3 var(--f-ui);

--d-1:160ms;--d-2:320ms;--d-3:600ms;--d-4:1100ms;
--e-out:cubic-bezier(.22,1,.36,1);
--e-in:cubic-bezier(.4,0,1,1);
--e-io:cubic-bezier(.65,0,.35,1);
transition:--acc var(--d-4) cubic-bezier(.4,0,.2,1);
color-scheme:dark;
}
@media (min-width:1024px){:root{--t-display:700 48px/1.2 var(--f-ui);--t-h1:700 28px/1.35 var(--f-ui);--t-h2:700 22px/1.45 var(--f-ui);--t-body:400 15.5px/1.85 var(--f-ui)}}
@media (prefers-reduced-motion:reduce){:root{--d-1:0ms;--d-2:0ms;--d-3:150ms;--d-4:150ms}}

:root{
--void:var(--night-0);--bg:var(--page);--bg-up:var(--page-up);
--ink:var(--ink-1);--ink2:var(--ink-2);--mute:var(--ink-3);
--line:var(--line-1);--line2:var(--line-2);
--pri:var(--light);--pri-hi:var(--light-hi);--pri-ink:var(--on-light);--pri-soft:var(--light-lo);
--r-card:var(--r-m);--r-btn:var(--r-pill);

}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--void)}
body{background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
img{display:block}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:stroke-width .2s}

.an-root{--an-spring:linear(0,.028 2.5%,.0995 5%,.198 7.5%,.3106 10%,.4272 12.5%,.5405 15%,.6454 17.5%,.7387 20%,.819 22.5%,.8856 25%,.9391 27.5%,.9803 30%,1.0107 32.5%,1.0317 35%,1.045 37.5%,1.052 40%,1.0543 42.5%,1.053 45%,1.0493 47.5%,1.044 50%,1.0379 52.5%,1.0316 55%,1.0254 57.5%,1.0197 60%,1.0146 62.5%,1.0102 65%,1.0065 67.5%,1.0035 70%,1.0012 72.5%,.9995 75%,.9984 77.5%,.9976 80%,.9972 82.5%,.9971 85%,.9971 87.5%,.9973 90%,.9976 92.5%,.9979 95%,.9983 97.5%,1);--an-dist:.6em;display:inline-flex;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr}
.an-slot{position:relative;display:inline-block}
.an-layer{display:inline-block;will-change:transform,opacity,filter}
.an-out{position:absolute;inset:0}
.an-in{animation:an-in var(--an-dur,450ms) var(--an-spring) both,an-res var(--an-dur,450ms) cubic-bezier(.22,1,.36,1) both}
.an-out{animation:an-outk var(--an-dur,450ms) cubic-bezier(.4,0,1,1) both,an-dis var(--an-dur,450ms) cubic-bezier(.4,0,1,1) both}
@keyframes an-in{from{transform:translateY(calc(var(--an-dir,1)*var(--an-dist)))}to{transform:translateY(0)}}
@keyframes an-outk{from{transform:translateY(0)}to{transform:translateY(calc(var(--an-dir,1)*var(--an-dist)*-1))}}
@keyframes an-res{from{opacity:0;filter:blur(var(--an-blur,8px))}to{opacity:1;filter:blur(0)}}
@keyframes an-dis{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(var(--an-blur,8px))}}

.hdr{position:fixed;inset:0 0 auto 0;z-index:20;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad) 0 8px}
.hdr-bg{position:absolute;inset:0;z-index:-1;background:color-mix(in oklab,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.wm{display:inline-flex;align-items:center;height:44px;color:var(--ink-1)}
.wm svg{height:22px;width:auto;display:block}
.hl{display:flex;align-items:center;gap:2px;font-size:13.5px;font-weight:500}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;color:var(--ink);transition:background .2s}
.ib.is-hover,.ib:hover{background:rgba(242,239,248,.08)}
.bell{position:relative}
.bell .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--light)}
.sub{height:34px;display:flex;align-items:center;padding:0 14px;border-radius:var(--r-pill);color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line-2);margin-inline:4px;white-space:nowrap;transition:box-shadow .25s,background .25s}
.sub.is-hover,.sub:hover{box-shadow:inset 0 0 0 1px rgba(242,239,248,.45);background:rgba(242,239,248,.06)}
.login{height:44px;display:flex;align-items:center;padding:0 12px;background:rgba(243,239,232,.0);color:var(--ink2);transition:color .2s}
.login:hover{color:var(--ink)}
.av{background:var(--night-3)!important;color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line-2);width:32px;height:32px;display:grid;place-items:center;font-size:14px;font-weight:600;background:color-mix(in oklab,var(--acc) 45%,#222);margin-inline:6px 4px}
.nav,.search{display:none}
.acct{position:relative}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;padding:6px;border-radius:16px;background:color-mix(in oklab,var(--night-2) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1px var(--line-2),0 24px 60px -20px rgba(0,0,0,.8);transform-origin:top left;z-index:40}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line-1);margin-bottom:6px}
.menu .who b{display:block;font-size:14px;font-weight:700}
.menu .who small{font-size:12px;color:var(--ink-3)}
.menu a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--ink-2);transition:background .2s,color .2s}
.menu a:hover,.menu a:focus-visible{background:rgba(242,239,248,.07);color:var(--ink-1)}
.menu a svg{width:19px;height:19px}
.menu hr{border:0;border-top:1px solid var(--line-1);margin:6px 0}

.hero{position:relative;height:min(80svh,680px);min-height:580px;overflow:hidden;isolation:isolate;outline:none}
.bgl{position:absolute;inset:-2% -4%;z-index:-2}
.bgl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bgl .kb{animation:kb 9s linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bgl .kb{animation:none}}
.grade{position:absolute;inset:0;z-index:-1;pointer-events:none;
background:linear-gradient(to bottom,rgba(5,5,6,.6) 0,rgba(5,5,6,0) 120px),
linear-gradient(to bottom,transparent 32%,color-mix(in oklab,var(--bg) 70%,transparent) 60%,var(--bg) 92%)}
.copy{position:absolute;inset:auto 0 0 0;padding:0 var(--pad) 22px;touch-action:pan-y}
.swap{position:relative;display:block}
.kick{font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:14px;display:flex;gap:8px;align-items:center;height:18px}
.kick b{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.logo{height:76px;position:relative}
.logo{position:relative}
.logo img{max-height:76px;max-width:min(280px,78vw);width:auto;height:auto;object-fit:contain;object-position:right bottom}
.tEn{font-family:var(--f-serif);font-size:40px;line-height:1.02;direction:ltr;text-align:right;width:min(330px,88vw);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tFa{font-size:16px;font-weight:700;margin-top:12px;height:26px;position:relative}
.tFa span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cross{position:absolute;inset:0}
.logo .cross{display:flex;align-items:flex-end}
.dotsep{color:var(--mute)}
.flip{display:inline-grid;overflow:hidden;height:18px;vertical-align:top}
.flip>*{grid-area:1/1}
.gm{display:inline-flex;flex-wrap:nowrap;gap:0;white-space:nowrap}
.gm>span{display:inline-block;white-space:pre}
.rtw{display:inline-grid}
.rtw>*{grid-area:1/1}
.rt{display:inline-flex;gap:4px;white-space:nowrap;align-items:baseline}

.meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--ink2);height:26px}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--mute);flex:none}
.imdb{display:inline-flex;align-items:baseline;gap:5px;direction:ltr}
.imdb small{font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--mute)}
.imdb b{font-weight:700;color:var(--ink)}
.gn{white-space:nowrap;overflow:hidden;position:relative}
.bdg.dub,.cm .bdg.dub{background:rgba(242,239,248,.14);box-shadow:none;color:var(--ink-1)}
.bdg{font-size:11.5px;font-weight:500;height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink);overflow:hidden;white-space:nowrap;position:relative}
.syn{height:52px;position:relative;margin-top:12px;max-width:560px}
.syn p{font-size:14px;line-height:1.85;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;align-items:center;gap:10px;margin-top:20px}
.cta{height:48px;padding:0 22px 0 24px;border-radius:var(--r-pill);background:var(--light);color:var(--on-light);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background var(--d-2) var(--e-out)}
.cta:hover,.cta.is-hover{background:var(--light-hi)}
.cta svg{width:16px;height:16px;fill:currentColor;stroke:none}
.ghost{height:48px;padding:0 20px 0 22px;border-radius:var(--r-pill);background:rgba(242,239,248,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--ink-1);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background var(--d-2) var(--e-out)}
.ghost:hover{background:rgba(242,239,248,.2)}
.ghost svg{width:19px;height:19px}
.pp{width:36px;height:36px;margin-inline-end:-6px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);flex:none;transition:background .2s,color .2s}
.pp:hover{background:rgba(242,239,248,.08);color:var(--ink-1)}
.pp svg{width:14px;height:14px}
.dots{display:flex;align-items:center;gap:2px;margin-top:18px;margin-inline-start:-10px}
.dots .seg{height:32px;padding:0 4px;display:grid;place-items:center}
.dots .seg i{display:block;width:22px;height:3px;border-radius:3px;background:rgba(242,239,248,.22);position:relative;overflow:hidden;transition:width var(--d-2) var(--e-out)}
.dots .seg[aria-current=true] i{width:36px}
.dots .seg i b{position:absolute;inset:0;background:var(--ink-1);transform-origin:right center}
.dots .seg[aria-current=true] i b{background:var(--light)}
.strip{display:none}

main{position:relative;z-index:2;padding-bottom:96px}
.row{margin-top:30px;position:relative}
.row:first-child{margin-top:8px}
.rh{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--pad);margin-bottom:14px}
.rh h2{font-size:18px;font-weight:700}
.more{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:2px;height:32px;transition:color .2s}

.sc{display:flex;gap:12px;overflow-x:auto;padding:4px var(--pad) 18px;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad);scrollbar-width:none;scroll-behavior:smooth}

.card:focus-visible{box-shadow:none}

.card{flex:none;width:118px;scroll-snap-align:start;text-align:right;display:block}
.pw{position:relative;isolation:isolate}
.pw .glow{position:absolute;left:10%;right:10%;top:16%;width:80%;height:88%;object-fit:cover;filter:blur(20px) saturate(1.5);z-index:-1;pointer-events:none}
.po{width:100%;aspect-ratio:2/3;border-radius:var(--r-card);overflow:hidden;background:var(--bg-up);position:relative;box-shadow:0 0 0 1px var(--line) inset}

.po:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.fr{font-size:11px;color:var(--mute);margin-top:11px;height:16px}
.ct{font-size:13px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}

.arr{display:none}

.gen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.gen:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line-1);transition:box-shadow var(--d-2) var(--e-out);z-index:1;pointer-events:none}
.gen.is-hover:before,.gen:hover:before{box-shadow:inset 0 0 0 1px rgba(242,239,248,.35)}
.gen:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(5,5,6,.88),rgba(5,5,6,.15));transition:opacity .3s}
.gen b{font-size:16px;font-weight:700}
.gen small{font-size:11.5px;color:var(--ink2);margin-top:2px}

.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;height:52px;padding:0 6px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--night-1) 78%,transparent);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 0 0 1px var(--line-1),0 14px 34px -14px rgba(0,0,0,.85)}
.tab{width:52px;display:grid;place-items:center;color:var(--ink-3);position:relative;transition:color .25s}
.tab[aria-current=page]{color:var(--ink-1)}

.sk{background:linear-gradient(100deg,rgba(242,239,248,.05) 0,rgba(242,239,248,.10) 40%,rgba(242,239,248,.05) 80%);background-size:300% 100%;animation:sh 1.4s linear infinite;border-radius:8px}
@keyframes sh{from{background-position:100% 0}to{background-position:-200% 0}}

.grade{background:

const cl=v=>v<0?0:v>1?1:v, seg=(t,a,b)=>cl((t-a)/(b-a)), mix=(a,b,p)=>a+(b-a)*p;

    </div>
  </section>`;
  return html`<section class="hero" aria-roledescription="carousel" aria-label="عنوان‌های منتخب" tabIndex="0"
    style=${{"--stripH":full+"px","--cardW":cardW+"px"}}
    onPointerEnter=${()=>desk&&setHovering(true)} onPointerLeave=${()=>{setHovering(false);setHold(false)}}
    onPointerDown=${e=>{if(!desk&&!e.target.closest("a,button"))setHold(true)}} onPointerUp=${()=>setHold(false)} onPointerCancel=${()=>setHold(false)}
    onKeyDown=${e=>{if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1)}}>
    <${motion.div} style=${{position:"absolute",inset:0,x:imgX,zIndex:-2}}>
      <${AnimatePresence} initial=${false} custom=${dir}>
        <${motion.div} class="bgl" key=${"bg"+i} custom=${dir}
          initial=${{opacity:0}} animate=${{opacity:1,transition:{duration:reduced?.3:.9,ease:[0.4,0,0.2,1]}}} exit=${{opacity:0,transition:{duration:reduced?.3:.9,ease:[0.4,0,0.2,1]}}}>
          <img class="kb" src=${M("b-"+(it.s||"dune-part-two")+".jpg")} alt="" style=${{objectPosition:desk?"50% 30%":it.pos}}/>
        </${motion.div}>
      </${AnimatePresence}>
    </${motion.div}>
    <div class="grade"></div>
    <${motion.div} class="copy" style=${{x:dragX}} drag=${desk?false:"x"} dragConstraints=${{left:0,right:0}} dragElastic=${.18}
      onDragStart=${()=>setHold(true)}
      onDragEnd=${(e,info)=>{if(info.offset.x>50||info.velocity.x>400)go(1);else if(info.offset.x<-50||info.velocity.x<-400)go(-1)}}>
      <div class="kick"><b></b><${Flip} v=${it.kind} reduced=${reduced}/><span class="dotsep">·</span><${GenreMorph} text=${it.g} reduced=${reduced}/></div>
      <div class="logo"><${Cross} k=${"lg"+i} reduced=${reduced} dur=${.35}>
        ${it.s?html`<img src=${M("l-"+it.s+".png")} alt=${it.en}/>`:html`<h1 class="tEn">${it.en}</h1>`}
      </${Cross}></div>
      <div class="tFa"><${Cross} k=${"fa"+i} reduced=${reduced} blur=${6} dur=${.4} delay=${.04}><span>${it.fa}</span></${Cross}></div>
      <div class="meta">
        <span class="imdb"><small>IMDb</small><b><${Count} v=${Number(it.imdb)} dec=${1}/></b></span>
        <i class="sep"></i><${AnimChars} text=${String(it.y)} dir=${yrDir} dur=${560} blur=${6}/>
        <i class="sep"></i><${Runtime} rt=${it.rt} kind=${it.kind} reduced=${reduced}/>
        <${Badge} b=${it.b}/>
      </div>
      <div class="syn"><${Cross} k=${"s"+i} reduced=${reduced} blur=${8} dur=${.55} delay=${.08}><p>${it.syn}</p></${Cross}></div>
      <div class="act">
        <${motion.a} href="#" class="cta" whileTap=${{scale:.97}} transition=${SPR}><${I} n="play"/>جزئیات و تماشا</${motion.a}>
      </div>
      <${Dots} i=${i} n=${n} run=${!stop} dur=${DUR} reduced=${reduced} paused=${paused} toggle=${()=>setPaused(p=>!p)} to=${to}/>
    </${motion.div}>
  </section>`;
}

function Card({c,k,reduced}){
  return html`<${motion.a} href="#" class="card"
    initial="r" animate="r" whileHover="h" whileTap=${{scale:.97}}>
    <${motion.div} class="pw" variants=${{r:{y:0},h:{y:-6}}} transition=${SPR}>
      <${motion.img} class="glow" src=${M("p-"+c.s+".jpg")} alt="" aria-hidden="true" variants=${{r:{opacity:.32},h:{opacity:.7}}} transition=${{duration:.35}}/>
      <div class="po"><${motion.div} style=${{width:"100%",height:"100%"}} variants=${{r:{scale:1},h:{scale:1.04}}} transition=${{duration:.6,ease:EASE}}><${Img} src=${M("p-"+c.s+".jpg")}/></${motion.div}>
        ${c.g&&html`<${motion.div} class="peek" variants=${{r:{opacity:0},h:{opacity:1}}} transition=${{duration:.25}}><span>${c.g}</span><span class="num">${c.y}</span></${motion.div}>`}</div>
    </${motion.div}>
    ${c.f&&html`<div class="fr">${c.f}</div>`}
    <div class="ct" title=${c.en}>${c.en}</div>
    <div class="cm"><span class="imdb num"><small>IMDb</small><b>${c.imdb}</b></span><span class=${"bdg"+(c.b==="دوبله"?" dub":"")}>${c.b}</span></div>
  </${motion.a}>`;
}
function SkCard(){return html`<div class="card"><div class="po sk"></div><div class="sk" style=${{height:13,width:"80%",marginTop:12}}></div><div class="sk" style=${{height:12,width:"50%",marginTop:8}}></div></div>`}

function Row({title,items,loading,genre,desk}){
  const ref=useRef();const reduced=useReducedMotion();
  const [hov,setHov]=useState(false);
  const [edge,setEdge]=useState({s:true,e:false});
  const upd=()=>{const el=ref.current;if(!el)return;const x=Math.abs(el.scrollLeft);setEdge({s:x<4,e:x+el.clientWidth>=el.scrollWidth-4})};
  if(!loading&&!items.length)return null;
  const by=d=>{const el=ref.current;el.scrollBy({left:-d*el.clientWidth*.8,behavior:"smooth"})};
  return html`<section class="row" onMouseEnter=${()=>setHov(true)} onMouseLeave=${()=>setHov(false)}>
    <div class="rh"><h2>${title}</h2>${!loading&&html`<${motion.a} href="#" class="more" whileHover="h">همه<${motion.span} variants=${{h:{x:-3}}} transition=${SPR} style=${{display:"inline-flex"}}><${I} n="left"/></${motion.span}></${motion.a}>`}</div>
    ${desk&&!loading&&html`<${AnimatePresence}>
      ${hov&&!edge.e&&html`<${motion.button} key="l" class="arr l" aria-label="بعدی" onClick=${()=>by(1)} initial=${{opacity:0,scale:.85}} animate=${{opacity:1,scale:1}} exit=${{opacity:0,scale:.85}} whileTap=${{scale:.92}} transition=${SPR}><${I} n="left"/></${motion.button}>`}
      ${hov&&!edge.s&&html`<${motion.button} key="r" class="arr r" aria-label="قبلی" onClick=${()=>by(-1)} initial=${{opacity:0,scale:.85}} animate=${{opacity:1,scale:1}} exit=${{opacity:0,scale:.85}} whileTap=${{scale:.92}} transition=${SPR}><${I} n="right"/></${motion.button}>`}
    </${AnimatePresence}>`}
    <div class="sc" ref=${ref} onScroll=${upd}>${genre
      ?items.map((g,k)=>loading?html`<div class="gen sk"></div>`:html`<${motion.a} href="#" class="gen" whileHover="h" whileTap=${{scale:.97}}
>
          <${motion.img} src=${M("b-"+g[2]+".jpg")} style=${{objectPosition:g[3]}} alt="" variants=${{h:{scale:1.08}}} transition=${{duration:.8,ease:EASE}}/>
          <b>${g[0]}</b><small>${fa(g[5])} عنوان</small></${motion.a}>`)
      :items.map((c,k)=>loading?html`<${SkCard} key=${k}/>`:html`<${Card} key=${c.s} c=${c} k=${k} reduced=${reduced}/>`)}</div>
  </section>`;
}

function Tabs(){
  const [sel,setSel]=useState(0);const [hide,setHide]=useState(false);const reduced=useReducedMotion();
  useEffect(()=>{let last=scrollY;const f=()=>{const y=scrollY;if(y>200&&y>last+6)setHide(true);else if(y<last-6||y<200)setHide(false);last=y};addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  const T=[["home","خانه"],["film","فیلم‌ها"],["tv","سریال‌ها"],["search","جستجو"]];
  return html`<${motion.nav} class="tabs" aria-label="ناوبری اصلی" style=${{x:"-50%"}} initial=${false}
      animate=${hide?{y:90,opacity:reduced?0:1}:{y:0,opacity:1}} transition=${{duration:.35,ease:EASE}}>${T.map(([n,l],k)=>html`<${motion.a} href="#" class="tab" aria-label=${l} aria-current=${k===sel?"page":undefined}
      onClick=${e=>{e.preventDefault();if(k===sel)scrollTo({top:0,behavior:"smooth"});else setSel(k)}} whileTap=${{scale:.9}}>
    <${I} n=${n}/>${k===sel&&html`<${motion.i} class="mark" layoutId="tabmark" transition=${SPR}/>`}</${motion.a}>`)}</${motion.nav}>`;
}

const IDS=[["nirvana","نیروانا (بنفش)","#A97BFF"],["beam","پرتو (فیروزه‌ای)","#3DE0D2"],["copper","مس (مسی)","#E78A53"]];
function Review({st,set,reload,id,setId}){
  const O=[["guest","مهمان"],["user","واردشده"],["loading","در حال بارگذاری"],["long","عنوان‌های بلند"]];
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی)</span>
    <div>${O.map(([k,l])=>html`<${motion.button} whileTap=${{scale:.95}} aria-pressed=${st===k} onClick=${()=>{set(k);scrollTo({top:0,behavior:"smooth"})}}>${l}</${motion.button}>`)}
      <${motion.button} whileTap=${{scale:.95}} onClick=${reload}>بارگذاری دوباره</${motion.button}>
      <${motion.button} whileTap=${{scale:.95}} onClick=${()=>{const u=new URL(location.href);u.searchParams.delete("intro");u.searchParams.delete("load");location.href=u}}>اینترو از اول</${motion.button}></div>
    <a class="syslink" href="../system/rollvana-design-system.html">سیستم طراحی رول‌وانا ←</a>
  </section>`;
}

function App(){
  const desk=useDesk();
  const [st,setSt]=useState(Q.get("state")==="loading"?"loading":Q.get("long")==="1"?"long":Q.get("user")==="1"?"user":"guest");
  const first=Q.get("intro")!=="0";
  const [boot,setBoot]=useState(first);
  const [sim,setSim]=useState(Q.get("load")!=="0");
  useEffect(()=>{
    const go=()=>{setBoot(false);Promise.all([READY,wait(1600)]).then(()=>setSim(false))};
    if(!first){go();return}
    if(window.__introEnded){go();return}
    addEventListener("introdone",go,{once:true});return()=>removeEventListener("introdone",go);
  },[]);

  const user=st==="user"||st==="long";
  const loading=st==="loading"||sim;
  const long=st==="long";
  const reload=()=>{scrollTo({top:0});setSim(true);setTimeout(()=>setSim(false),1800)};
  const hero=long?[LONG,...HERO.slice(1)]:HERO;
  const films=long?[C("mission-impossible-the-final-reckoning","Mission: Impossible – The Final Reckoning of Ethan Hunt","7.2","دوبله","امروز"),...FILMS]:FILMS;
  return html`<${React.Fragment}>
    <${Header} user=${user} desk=${desk}/>
    <${AnimatePresence} mode="wait" initial=${false}>
      <${motion.div} key=${loading?"sk":"ok"+st} initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.35}}>
        <${Hero} items=${hero} loading=${loading} desk=${desk}/>
        <main>
          <${Row} title="جدیدترین فیلم‌ها" items=${films} loading=${loading} desk=${desk}/>
          <${Row} title="جدیدترین سریال‌ها" items=${SERIES} loading=${loading} desk=${desk}/>
          <${Row} title="پیشنهاد ما" items=${PICKS} loading=${loading} desk=${desk}/>
          <${Row} title="ژانرها" items=${GENRES} loading=${loading} genre=${true} desk=${desk}/>
          <${Row} title="مستندها" items=${[]} loading=${false}/>
          <${Review} st=${st} set=${setSt} reload=${reload}/>
        </main>
      </${motion.div}>
    </${AnimatePresence}>
    ${!desk&&html`<${Tabs}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
