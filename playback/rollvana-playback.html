   <div class="pv-mid">
    <button class="pv-ib" style=${{width:52,height:52}} aria-label="۱۰ ثانیه عقب" onClick=${()=>setAt(a=>Math.max(0,a-10))}><${Ten} d=${-1}/></button>
    <button class="pv-play" aria-label=${play?"توقف":"پخش"} onClick=${()=>setPlay(v=>!v)}>
     <${AnimatePresence} mode="popLayout" initial=${false}>
      <${motion.span} key=${play?"pa":"pl"} style=${{display:"grid"}} initial=${{opacity:0,scale:.6}} animate=${{opacity:1,scale:1}} exit=${{opacity:0,scale:.6}} transition=${{duration:.16,ease:[.22,1,.36,1]}}><${I} n=${play?"pause":"play"}/></${motion.span}>
     </${AnimatePresence}>
    </button>
    <button class="pv-ib" style=${{width:52,height:52}} aria-label="۱۰ ثانیه جلو" onClick=${()=>setAt(a=>Math.min(t.dur,a+10))}><${Ten} d=${1}/></button>
   </div>
   <div class="pv-bot">
    <div class="pv-bar">
     <span class="pv-time">${clock(at)}</span>
     <div class=${"pv-seek"+(drag?" on":"")} ref=${sk} role="slider" aria-label="جای پخش" aria-valuemin="0" aria-valuemax=${t.dur} aria-valuenow=${Math.round(dp*t.dur)} aria-valuetext=${clock(dp*t.dur)} tabindex="0" onKeyDown=${e=>{if(e.key==="ArrowRight")setAt(a=>Math.min(t.dur,a+10));if(e.key==="ArrowLeft")setAt(a=>Math.max(0,a-10))}} onPointerDown=${e=>{e.currentTarget.setPointerCapture(e.pointerId);setDrag(true);setSp(frac(e))}} onPointerMove=${e=>{if(drag||e.pointerType==="mouse")setSp(frac(e))}} onPointerUp=${e=>{if(!drag)return;setAt(Math.round(sp*t.dur));setDrag(false);if(e.pointerType!=="mouse")setSp(null)}} onPointerLeave=${()=>{if(!drag)setSp(null)}}>
      <div class="pv-trk"><div class="pv-buf" style=${{width:Math.min(100,p*100+(buf?.4:9))+"%"}}></div><div class="pv-fill" style=${{width:dp*100+"%"}}></div><div class="pv-knob" style=${{left:dp*100+"%"}}></div></div>
      <${AnimatePresence}>${sp!=null&&html`<${motion.div} key="tip" className="pv-tip" style=${{left:Math.min(Math.max(sp*sw,noPrev?36:90),sw-(noPrev?36:90))+"px",x:"-50%"}} initial=${{opacity:0,y:6}} animate=${{opacity:1,y:0,transition:{duration:.16,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.12,ease:[.4,0,1,1]}}}>${!noPrev&&html`<div class="fr"><${AnimatePresence} initial=${false}><${motion.img} key=${fi} src=${PM(t.fr+fi+".jpg")} alt="" initial=${{opacity:0}} animate=${{opacity:1}} exit=${{opacity:0}} transition=${{duration:.16}}/></${AnimatePresence}></div>`}<span class="tt">${clock(sp*t.dur)}</span></${motion.div}>`}</${AnimatePresence}>
     </div>
     <span class="pv-time end">-${clock(t.dur-at)}</span>
    </div>
    <div class="pv-row">
     <div class="pv-tr">
      <button class="pv-ib" aria-label=${play?"توقف":"پخش"} onClick=${()=>setPlay(v=>!v)}><${I} n=${play?"pause":"play"}/></button>
      <button class="pv-ib" aria-label="۱۰ ثانیه عقب" onClick=${()=>setAt(a=>Math.max(0,a-10))}><${Ten} d=${-1}/></button>
      <button class="pv-ib" aria-label="۱۰ ثانیه جلو" onClick=${()=>setAt(a=>Math.min(t.dur,a+10))}><${Ten} d=${1}/></button>
     </div>
     <div class="pv-vol"><button class="pv-ib" aria-label="صدا"><${I} n="vol"/></button><i></i></div>
     <span class="sp"></span>
     <button class="pv-ib" aria-label="زیرنویس" aria-haspopup="dialog" aria-expanded=${menu==="subs"} onClick=${()=>setMenu("subs")}><${I} n="cc"/></button>
     ${t.audio.length>1&&html`<button class="pv-ib" aria-label="صدا" aria-haspopup="dialog" aria-expanded=${menu==="audio"} onClick=${()=>setMenu("audio")}><${I} n="audio"/></button>`}
     <button class="pv-ib pv-dk" aria-label="میان‌برهای صفحه‌کلید" aria-haspopup="dialog" aria-expanded=${menu==="keys"} onClick=${()=>setMenu("keys")}><${I} n="keys"/></button>
     <button class="pv-ib" aria-label="تمام‌صفحه"><${I} n="max"/></button>
    </div>
   </div>
  </div>
  <${AnimatePresence}>${fl&&html`<${motion.div} key=${fl.k} className="pv-flash" role="status" initial=${{opacity:0,scale:.96}} animate=${{opacity:1,scale:1,transition:{duration:.16,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.24,ease:[.4,0,1,1]}}}>${fl.f}</${motion.div}>`}</${AnimatePresence}>
 <${AnimatePresence}>${buf&&!ask&&html`<${motion.div} key="rg" className="pv-ring" role="status" aria-label="در حال بارگذاری" initial=${{opacity:0}} animate=${{opacity:1,transition:{delay:.2,duration:.24,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.16,ease:[.4,0,1,1]}}}/>`}</${AnimatePresence}>
  <${AnimatePresence}>${inIntro&&!menu&&html`<${motion.button} key="sk" className="pv-gb pv-skip" onClick=${()=>setAt(t.intro[1])} initial=${{opacity:0,y:8}} animate=${{opacity:1,y:0,transition:{duration:.32,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.2,ease:[.4,0,1,1]}}}><i style=${{width:(at-t.intro[0])/(t.intro[1]-t.intro[0])*100+"%",transition:"width 1s linear"}}></i><span>رد کردن تیتراژ</span><${I} n="skip"/></${motion.button}>`}</${AnimatePresence}>
  <${AnimatePresence}>${inCred&&!stay&&!menu&&(t.next?html`<${Next} key="nx" t=${t} cancel=${()=>setStay(true)} play=${nextEp}/>`:html`<${motion.div} key="fe" className="pv-toast" role="status" initial=${{opacity:0,y:8}} animate=${{opacity:1,y:0,transition:{duration:.32,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.2,ease:[.4,0,1,1]}}}><${I} n="check"/><span>تمام شد؛ بار بعد از اول پخش می‌شود</span><a class="pv-gb" href="../title/rollvana-title.html">بازگشت</a></${motion.div}>`)}</${AnimatePresence}>
  <${AnimatePresence}>${fq===2&&!menu&&!ask&&html`<${motion.div} key="fq" className="pv-toast" role="status" onPointerEnter=${()=>setHold(true)} onPointerLeave=${()=>setHold(false)} onFocus=${()=>setHold(true)} onBlur=${()=>setHold(false)} initial=${{opacity:0,y:8}} animate=${{opacity:1,y:0,transition:{duration:.32,ease:[.22,1,.36,1]}}} exit=${{opacity:0,transition:{duration:.2,ease:[.4,0,1,1]}}}><${I} n="wifi"/><span>اتصال کند شد؛ پخش با <bdi class="lat">720p</bdi></span><button class="pv-gb" onClick=${()=>{setOn(true);setMenu("quality")}}>کیفیت</button></${motion.div}>`}</${AnimatePresence}>
  <${AnimatePresence}>${menu&&menu.startsWith("quality")&&html`<${Quality} key="q" low=${low} cur=${fq>=2?"720p":null} close=${()=>setMenu(null)} onH=${setSh}/>`}${menu==="subs"&&html`<${Subs} key="s" sub=${sub} set=${setSub} close=${()=>setMenu(null)} onH=${setSh}/>`}${menu==="audio"&&html`<${Audio} key="a" t=${t} close=${()=>setMenu(null)} onH=${setSh}/>`}${menu==="share"&&html`<${Share} key="sh" t=${t} at=${at} close=${()=>setMenu(null)} onH=${setSh}/>`}${menu==="keys"&&html`<${Keys} key="k" close=${()=>setMenu(null)} onH=${setSh}/>`}</${AnimatePresence}>
 </main>`;
}

function App(){
 const [kind,setKind]=useState(Q.get("kind")==="series"?"series":"film");
 const [rm,setRm]=useState(Q.get("rm")==="1");
 const [state,setState]=useState(STATES.some(s=>s[0]===Q.get("state"))?Q.get("state"):"playing");
 const ek=state==="still"?"series":kind;
 const t=ek==="series"?SERIES:FILM;
 useEffect(()=>{const u=new URLSearchParams({kind,state});if(rm)u.set("rm","1");history.replaceState(null,"","?"+u)},[kind,state,rm]);
 return html`<${MotionConfig} reducedMotion=${rm?"always":"user"}>
  <${Player} t=${t} state=${state} setState=${setState} rm=${rm}/>
  <section class="review" aria-label="حالت‌های طرح">
   <h2>حالت‌های طرح</h2>
   <div class="grp">عنوان<div class="row">${[["film","فیلم"],["series","قسمت سریال"]].map(([k,l])=>html`<button key=${k} aria-pressed=${ek===k} disabled=${state==="still"&&k==="film"} onClick=${()=>setKind(k)}>${l}</button>`)}</div></div>
   <div class="grp">حرکت<div class="row">${[[false,"عادی"],[true,"کاهش حرکت"]].map(([k,l])=>html`<button key=${l} aria-pressed=${rm===k} onClick=${()=>setRm(k)}>${l}</button>`)}</div></div>
   <div class="grp">حالت<div class="row">${STATES.map(([k,l])=>html`<button key=${k} aria-pressed=${state===k} onClick=${()=>{setState(k);scrollTo(0,0)}}>${l}</button>`)}</div></div>
  </section>
 </${MotionConfig}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body>
</html>
