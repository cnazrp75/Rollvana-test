function lay(parts,dur,W,gap,min){

function Seek({time,buf,onSeek,force,noimg,r,mode,onBusy,onScrub}){
  const ref=useRef(null);const {w:W}=useBox(ref);
  const gap=PARTS.length>1?(mode==="desk"?4:3):0;

          <button class="ib vp-keys" aria-haspopup="menu" aria-expanded=${menu==="keys"} onClick=${()=>openMenu("keys")} aria-label="میان‌برهای صفحه‌کلید" title="میان‌برهای صفحه‌کلید"><${I} n="keys"/></button>
          <${Volume} vol=${vol} muted=${muted} setVol=${v=>{setVol(v);setMuted(false)}} toggle=${()=>setMuted(m=>!m)} r=${r}/>
          <button class="ib" onClick=${fs} aria-label=${full?"خروج از تمام‌صفحه":"تمام‌صفحه"} title=${full?"خروج از تمام‌صفحه (F)":"تمام‌صفحه (F)"}><${I} n=${full?"unfull":"full"}/></button>
        </div>
      </${motion.footer}>`}
    </${AnimatePresence}>
    <${motion.div} class="vp-cue" ref=${cueRef} initial=${false} animate=${{y:-cueLift}} transition=${r?{duration:0}:SPR}>
      <${AnimatePresence} mode="popLayout">
        ${cue==="resume"&&html`<${motion.div} key="resume" class="vp-resume" ...${cueM}><span>ادامه از <b>${fmt(T.resume)}</b></span><button onClick=${()=>{seek(0);wake()}}><${I} n="restart"/>از اول</button></${motion.div}>`}
        ${cue==="recap"&&html`<${motion.button} key="recap" class="vp-skip" ...${cueM} whileTap=${r?undefined:PRESS} onClick=${()=>seek(part[2])}>رد کردن آنچه گذشت<${I} n="skip"/></${motion.button}>`}
        ${cue==="intro"&&html`<${motion.button} key="intro" class="vp-skip" ...${cueM} whileTap=${r?undefined:PRESS} onClick=${()=>seek(part[2])}>رد کردن تیتراژ<${I} n="skip"/></${motion.button}>`}
        ${cue==="next"&&html`<${motion.div} key="next" class="vp-card" role="region" aria-label="قسمت بعد" ...${cueM}>
          <div class="vp-card-pic"><img src=${T.next} alt=""/><${AnimatePresence}>${!cancelled&&html`<${motion.div} key="c" exit=${{opacity:0}} transition=${{duration:.2}}><${Countdown} left=${left} run=${counting} r=${r}/></${motion.div}>`}</${AnimatePresence}></div>
          <div class="vp-card-b"><span class="vp-eyebrow">قسمت بعد · فصل ${fa(T.season)}، قسمت ${fa(ep+1)}</span><span class="vp-card-t">${LONG?"تویی که هستی؛ کتابی که نباید به طبقه‌ی جداشده‌ها می‌رسید و حالا دست‌به‌دست می‌چرخد":T.nextName}</span>
            <div class="vp-card-a"><button class="cta vp-sm" onClick=${()=>setLeft(0)}><${I} n="play"/>پخش</button><button class="ghost vp-sm" onClick=${()=>cancelled?setTime(DUR):setCancelled(true)}><${Swap} k=${cancelled} r=${r}>${cancelled?"بستن":"لغو"}</${Swap}></button></div></div>
        </${motion.div}>`}
        ${cue==="end"&&html`<${motion.div} key="end" class="vp-card" role="region" aria-label="پایان فیلم" ...${cueM}>
          <div class="vp-card-b"><span class="vp-eyebrow">پایان فیلم</span><span class="vp-card-t">${NAME}</span>
            <div class="vp-card-a"><a class="cta vp-sm" href="../title/rollvana-title.html?kind=film">${home}</a><button class="ghost vp-sm" onClick=${()=>setEndClosed(true)}>دیدن تیتراژ</button></div></div>
        </${motion.div}>`}
      </${AnimatePresence}>
    </${motion.div}>
    <${AnimatePresence}>
      ${over==="recap"&&html`<${motion.section} key="recap" class="vp-recap" aria-label="آنچه دیدید" initial=${r?{opacity:0}:mode==="port"?{y:"100%"}:mode==="land"?{x:"100%"}:{opacity:0,y:16,scale:.98}} animate=${{opacity:1,x:0,y:0,scale:1}} exit=${r?{opacity:0}:mode==="port"?{y:"100%"}:mode==="land"?{x:"100%"}:{opacity:0,y:10}} transition=${r?{duration:.15}:SHEET}>
        <div class="vp-recap-h"><${I} n="spark"/><div><h2>آنچه دیدید</h2><span class="vp-eyebrow">${T.recapOf}</span></div>
          <button class="vp-recap-x" onClick=${()=>{setOver(null);setStarted(true);setPlaying(true);setHold(false)}}>رد کردن</button></div>
        <p class="vp-recap-t">${T.recap}${LONG?T.recapMore:""}</p>
        <div class="vp-recap-f"><small>خلاصه را هوش مصنوعی نوشته و چیزی از ادامه را لو نمی‌دهد.</small>
          <button class="cta" onClick=${()=>{setOver(null);setStarted(true);setPlaying(true);setHold(false)}}><${I} n="play"/>${KIND==="film"?"ادامه از "+fmt(T.resume):"پخش قسمت "+fa(T.ep)}</button></div>
      </${motion.section}>`}
      ${blocked&&over!=="recap"&&html`<${motion.div} key=${over} class="vp-veil" role="alertdialog" aria-modal="true" aria-labelledby="vp-dlg-t" ...${veil}>
        <${motion.div} class="vp-dlg" ...${dlg}>
          ${over==="error"&&html`<${I} n="warn" c="vp-warn"/><h2 id="vp-dlg-t">پخش ممکن نشد</h2><p>کیفیت‌های دیگر را هم امتحان کردیم و هیچ‌کدام بار نشد. اتصال اینترنت را نگاه کنید و دوباره تلاش کنید.</p>
            <div class="vp-dlg-a"><button class="cta" onClick=${()=>{setOver(null);setBuffering(true);setPlaying(true);setTimeout(()=>setBuffering(false),1800)}}><${I} n="cw"/>تلاش دوباره</button><a class="ghost" href="../title/rollvana-title.html?kind=${KIND}">${home}</a></div>`}
          ${over==="still"&&html`<h2 id="vp-dlg-t">هنوز تماشا می‌کنید؟</h2><p>سه قسمت پشت سر هم پخش شد و پخش را نگه داشتیم تا بی‌دلیل اینترنت مصرف نشود.</p>
            <div class="vp-dlg-a"><button class="cta" onClick=${()=>{setOver(null);setPlaying(true);setHold(false)}}><${I} n="play"/>ادامه‌ی تماشا</button><a class="ghost" href="../title/rollvana-title.html?kind=series">${home}</a></div>`}
          ${over==="guest"&&html`<h2 id="vp-dlg-t">برای تماشا وارد شوید</h2><p>تماشای آنلاین برای اعضای رول‌وانا است. وارد شوید؛ پخش از همین صفحه شروع می‌شود.</p>
            <div class="vp-dlg-a"><a class="cta" href="../account/rollvana-login.html">ورود</a><a class="ghost" href="../title/rollvana-title.html?kind=${KIND}">${home}</a></div>`}
          ${over==="nosub"&&html`<h2 id="vp-dlg-t">اشتراک فعال ندارید</h2><p>تماشای آنلاین این ${KIND==="film"?"فیلم":"قسمت"} با اشتراک فعال ممکن است. بعد از خرید، پخش از همین صفحه شروع می‌شود.</p>
            <div class="vp-dlg-a"><a class="cta" href="#plans">خرید اشتراک</a><a class="ghost" href="../title/rollvana-title.html?kind=${KIND}">${home}</a></div>`}
        </${motion.div}>
      </${motion.div}>`}
    </${AnimatePresence}>
    <${AnimatePresence}>${menu&&html`<${Menu} key="menu" id=${menu} go=${setMenu} close=${()=>setMenu(null)} st=${st} set=${set} mode=${mode} r=${r} maxH=${mode==="port"?box.h*.74:mode==="land"?box.h:Math.min(540,box.h-200)}/>`}</${AnimatePresence}>
    <${AnimatePresence}>${over==="share"&&html`<${Share} key="share" time=${time} close=${()=>setOver(null)} mode=${mode} r=${r}/>`}</${AnimatePresence}>
    <div class="vp-toasts"><${AnimatePresence}>${toast&&html`<${motion.div} key="t" class="toast" role="status" initial=${r?{opacity:0}:{opacity:0,y:-12,scale:.98}} animate=${{opacity:1,y:0,scale:1}} exit=${r?{opacity:0}:{opacity:0,y:-8}} transition=${{duration:.28,ease:EASE}}><${I} n="hd"/><span>کیفیت <bdi dir="ltr">1080p</bdi> بار نشد؛ ادامه با <bdi dir="ltr">720p</bdi></span></${motion.div}>`}</${AnimatePresence}></div>
  </main>`;
}

const GROUPS=[
["شروع",[["first","اولین پخش"],["resume","ادامه با «از اول»"],["recap","آنچه دیدید"]]],
["پخش",[["playing","در حال پخش با کنترل‌ها"],["hidden","کنترل‌ها پنهان"],["buffer","بارگذاری"],["switch","تغییر خودکار کیفیت"],["error","خطا و تلاش دوباره"]]],
["نوار زمان",[["parts","با همه‌ی بخش‌ها"],["noparts","بدون بخش"],["hover","نشانگر روی بخش، با تصویر"],["hover-noimg","نشانگر روی بخش، بی‌تصویر"],["drag","کشیدن"],["short","بخش خیلی کوتاه"]]],
["بخش‌ها",[["skip-recap","رد کردن آنچه گذشت"],["skip-intro","رد کردن تیتراژ"],["next","شمارش قسمت بعد"],["still","هنوز تماشا می‌کنید؟"],["end","کارت پایان فیلم"]]],
["منوها",[["quality","کیفیت"],["quality&low","کیفیت، حالت کم‌مصرف"],["subs","زیرنویس"],["subs-style","ظاهر زیرنویس"],["subs-sync","هماهنگی زیرنویس"],["audio","صدا"],["keys","میان‌برها"],["share","هم‌رسانی"]]],
["دسترسی",[["guest","مهمان"],["nosub","بدون اشتراک"]]]];
function Review(){
  const keep=(o)=>{const p=new URLSearchParams();Object.entries(o).forEach(([a,b])=>{if(b!==false&&b!=null)p.set(a,b===true?"1":b)});return "?"+p.toString().replace(/=1(&|$)/g,"$1").replace("%26low","&low")};
  const base={k:KIND==="film"?"film":null,long:LONG||null,rm:RM||null};
  const cur=S+(LOW?"&low":"");
  return html`<section class="rv" aria-label="بازبینی">
    <h2>حالت‌های بازبینی</h2>
    <p>هر دکمه همین صفحه را در یک حالت باز می‌کند. کنترل‌ها و پیام‌ها تا اولین حرکت شما می‌مانند؛ بعد پخش‌کننده مثل واقعیت رفتار می‌کند و شمارش قسمت بعد از همان لحظه‌ی باز شدن می‌دود. برای گوشیِ افقی، پنجره را ۸۴۴ در ۳۹۰ کنید.</p>
    <h3>نوع و محتوا</h3>
    <ul>
      <li><a aria-current=${KIND==="series"} href=${keep({s:S,...base,k:null})}>قسمت سریال</a></li>
      <li><a aria-current=${KIND==="film"} href=${keep({s:S,...base,k:"film"})}>فیلم</a></li>
      <li><a aria-current=${LONG} href=${keep({s:S,...base,long:!LONG||null})}>نام و متن بلند</a></li>
      <li><a aria-current=${RM} href=${keep({s:S,...base,rm:!RM||null})}>حرکت کم</a></li>
    </ul>
    ${GROUPS.map(([g,items])=>html`<${React.Fragment} key=${g}><h3>${g}</h3><ul>${items.map(([s,l])=>html`<li key=${s}><a aria-current=${cur===s} href=${keep({s,...base})}>${l}</a></li>`)}</ul></${React.Fragment}>`)}
  </section>`;
}
function App(){return html`<${MotionConfig} reducedMotion=${RM?"always":"user"}><${Player}/><${Review}/></${MotionConfig}>`}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
