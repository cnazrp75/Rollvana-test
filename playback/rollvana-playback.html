}
$("#pic").src=D.pic;$("#glowImg").src=D.pic;$("#subFa").textContent=D.fa;$("#subEn").textContent=D.en;
setup();render();
let idle=0;
const wake=()=>{if(S.ui==="off"&&!S.buffer){S.ui="on";render()}clearTimeout(idle);idle=setTimeout(()=>{if(S.playing&&!S.menu&&!S.panel&&!S.scrub&&!$("#dock").matches(":focus-within")){S.ui="off";render()}},3000)};
let started=false;
root.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){started=true;wake()}});
setInterval(()=>{if(S.playing&&!S.buffer&&!S.scrub){S.t=Math.min(S.dur,S.t+1);if(S.panel==="next"||S.toast||S.menu||state==="playing"||started)render()}},1000);
function flash(v){const f=v<0?$("#flashB"):$("#flashF");f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}
function jump(v){S.t=Math.max(0,Math.min(S.dur,S.t+v));flash(v);render()}
let cdT=0,cdHold=false;
function startCd(){clearInterval(cdT);cdT=setInterval(()=>{if(cdHold||S.panel!=="next")return;S.cd--;if(S.cd<=0){clearInterval(cdT);goNext();return}const n=$("#cdN");if(n){n.textContent=fa(S.cd);n.classList.remove("on");void n.offsetWidth;n.classList.add("on");$("#cdBtn").style.setProperty("--cd",(10-S.cd)*10+"%");lastLayer=layer.innerHTML}},1000)}
layer.addEventListener("pointerover",e=>{if(e.target.closest("#nextCard"))cdHold=true});
layer.addEventListener("pointerout",e=>{if(e.target.closest("#nextCard")&&!e.relatedTarget?.closest?.("#nextCard"))cdHold=false});
layer.addEventListener("focusin",e=>{if(e.target.closest("#nextCard"))cdHold=true});
layer.addEventListener("focusout",()=>{cdHold=false});
function goNext(){if(kind!=="series")return;D.ttl="جدایی";D.meta="فصل ۲ · قسمت ۷ · چیخای باردو";D.pic=D.next.img;$("#pic").src=D.pic;$("#glowImg").src=D.pic;S.panel=null;S.t=0;S.dur=2940;S.playing=true;S.sub=false;render()}
root.addEventListener("click",e=>{
const a=e.target.closest("[data-act]");
if(!a){if(e.target.closest(".pp-stage")&&!S.panel&&!S.menu){if(e.pointerType==="touch"||matchMedia("(pointer:coarse)").matches){S.ui=S.ui==="on"?"off":"on";render()}else{S.playing=!S.playing;render()}}return}
const v=a.dataset.v,k=a.dataset.k;started=true;
switch(a.dataset.act){
case "play":S.playing=!S.playing;wake();break;
case "jump":jump(+v);wake();return;
case "mute":S.muted=!S.muted;break;
case "fs":S.fs=!S.fs;if(S.fs)document.documentElement.requestFullscreen?.().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen();break;
case "menu":S.menu=S.menu===v?null:v;S.toast=null;break;
case "close":S.menu=null;if(S.panel==="keys"){S.panel=null;S.playing=true}break;
case "keys":S.panel="keys";S.playing=false;break;
case "set":if(k==="ql"){S.ql=v;if(v!=="auto")S.now=v}else if(k==="lang")S.subs.lang=v;else if(k==="size")S.subs.size=+v;else if(k==="color")S.subs.color=+v;else if(k==="audio")S.audio=+v;break;
case "glow":if(!S.low)S.glow=!S.glow;break;
case "box":S.subs.box=!S.subs.box;break;
case "sync":S.subs.sync=Math.max(-10,Math.min(10,S.subs.sync+ +v));break;
case "shareat":S.shareAt=!S.shareAt;break;
case "copy":S.copied=true;navigator.clipboard?.writeText("https://"+layer.querySelector(".pp-field span").textContent).catch(()=>{});setTimeout(()=>{S.copied=false;render()},2400);break;
case "resume":S.panel=null;S.playing=true;S.sub=true;break;
case "startover":S.panel=null;S.t=0;S.playing=true;break;
case "playnext":goNext();return;
case "credits":S.panel=null;S.playing=true;break;
case "skipintro":S.t=D.intro[1];break;
case "retry":S.panel=null;S.buffer=true;S.playing=true;render();setTimeout(()=>{S.buffer=false;S.ui="on";render()},1400);return;
default:break}
render()});
const seek=$("#seek");
function spAt(e){const r=seek.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
seek.addEventListener("pointerdown",e=>{seek.setPointerCapture(e.pointerId);S.scrub=state==="scrub-none"?"noimg":"img";S.sp=spAt(e);render()});
seek.addEventListener("pointermove",e=>{if(S.scrub&&seek.hasPointerCapture(e.pointerId)){S.sp=spAt(e);render()}else if(e.pointerType==="mouse"&&!S.scrub){S.sp=spAt(e);S.scrub=state==="scrub-none"?"noimg":"img";S.hover=true;render()}});
seek.addEventListener("pointerleave",()=>{if(S.hover){S.hover=false;S.scrub=null;render()}});
seek.addEventListener("pointerup",e=>{if(S.scrub){S.t=S.sp*S.dur;S.scrub=null;S.hover=false;render()}});
document.addEventListener("keydown",e=>{
if(e.metaKey||e.ctrlKey||e.altKey)return;
const k=e.key.toLowerCase(),onBtn=e.target.closest&&e.target.closest("button");
if(k==="escape"){if(S.menu||S.panel==="keys"){S.menu=null;if(S.panel==="keys"){S.panel=null;S.playing=true}render()}return}
if(S.panel&&S.panel!=="keys")return;
const act={" ":()=>{S.playing=!S.playing},k:()=>{S.playing=!S.playing},arrowleft:()=>jump(-10),arrowright:()=>jump(10),arrowup:()=>{S.vol=Math.min(100,S.vol+10);S.muted=false},arrowdown:()=>{S.vol=Math.max(0,S.vol-10)},m:()=>{S.muted=!S.muted},f:()=>{S.fs=!S.fs},c:()=>{S.subs.lang=S.subs.lang==="off"?"fa":"off"},"?":()=>{S.panel="keys";S.playing=false}}[k];
if(!act||(onBtn&&(k===" "||k==="enter")))return;
e.preventDefault();act();started=true;wake();render()});
if(S.panel==="next"&&kind==="series")startCd();
const link=(p)=>{const u=new URLSearchParams({state,kind,...p});if(rm&&!("rm" in p))u.set("rm","1");if(u.get("rm")==="0")u.delete("rm");return "?"+u};
$("#rvKind").innerHTML=[["film","فیلم"],["series","قسمت سریال"]].map(([v,l])=>`<a href="${link({kind:v})}" aria-current="${kind===v}">${l}</a>`).join("");
$("#rvState").innerHTML=STATES.map(([v,l])=>`<a href="${link({state:v})}" aria-current="${state===v}">${l}</a>`).join("");
$("#rvRm").innerHTML=`<a href="${link({rm:"0"})}" aria-current="${!rm}">حرکت عادی</a><a href="${link({rm:"1"})}" aria-current="${rm}">کاهش حرکت</a>`;
</script>
</body></html>
