      ${S.toast==="switch"?html`<${I} n="check-circle"/><span>پخش با <bdi dir="ltr">1080p</bdi> ممکن نشد؛ با <bdi dir="ltr">720p</bdi> ادامه می‌دهیم.</span>`:html`<${I} n="arrow-counter-clockwise"/><span>این ${T.kind==="ep"?"قسمت":"فیلم"} را تا آخر دیده بودید؛ از اول پخش می‌شود.</span>`}
    </${motion.div}>`:null}</${AnimatePresence}>

    <${AnimatePresence}>${S.ui==="on"?html`<${motion.footer} key="bot" ref=${bar} class="pl-bot" ...${fadeUp(12)}>
      <div class="pl-seekrow">
        <${Clock} cls="pl-time" text=${cur} rm=${rm} label=${"گذشته "+cur}/>
        <div class=${"pl-seek"+(S.scrub?" is-scrub":"")} ref=${seek} role="slider" tabindex="0" aria-label=${"زمان "+(T.kind==="ep"?"قسمت":"فیلم")} aria-valuemin="0" aria-valuemax=${T.dur} aria-valuenow=${Math.round(S.t)} aria-valuetext=${clock(S.t,long_)+" از "+clock(T.dur,long_)} ...${sk}>
          <div class="pl-track"><${motion.i} class="pl-buf" style=${{scaleX:bufX}}/><${motion.i} class="pl-fill" style=${{scaleX:prog}}/></div>
          <${motion.i} class="pl-knob" style=${{left:knobX}} animate=${{scale:S.scrub?1.45:1}} transition=${SNAP}/>
          <${AnimatePresence}>${pv!=null?html`<${motion.div} key="pv" class="pl-prev" style=${{left:pvLeft,x:"-50%"}} initial=${{opacity:0,scale:.9,y:6}} animate=${{opacity:1,scale:1,y:0}} exit=${{opacity:0,scale:.94,y:4,transition:{duration:.14,ease:EASE_LEAVE}}} transition=${SNAP}>
            ${pvImg?html`<img src=${T.thumb+Math.min(T.tn-1,Math.floor(pv*T.tn))+".jpg"} alt=""/>`:null}<b>${clock(pv*T.dur,long_)}</b></${motion.div}>`:null}</${AnimatePresence}>
        </div>
        <span class="pl-time rem" aria-label=${"مانده "+rem}>${rem}</span>
      </div>
      <div class="pl-row">
        <div class="pl-grp">
          <${motion.button} type="button" class="tb pl-tb" aria-label=${"زیرنویس: "+subLabel} title="زیرنویس (C)" aria-expanded=${S.panel==="subs"} onClick=${()=>openPanel("subs")} whileTap=${PRESS}><${I} n="subtitles"/><span>زیرنویس</span><span class="tbl"><${Swap} k=${subLabel} rm=${rm}>${subLabel}</${Swap}></span></${motion.button}>
          ${T.dub?html`<${motion.button} type="button" class="tb pl-tb" aria-label=${"زبان صدا: "+(audio==="orig"?"اصلی":"دوبله")} title="زبان صدا" aria-expanded=${S.panel==="audio"} onClick=${()=>openPanel("audio")} whileTap=${PRESS}><${I} n="waveform"/><span>صدا</span><span class="tbl"><${Swap} k=${audio} rm=${rm}>${audio==="orig"?"اصلی":"دوبله"}</${Swap}></span></${motion.button}>`:null}
          <${motion.button} type="button" class="tb pl-tb" aria-label=${"کیفیت: "+qLabel+qName} title="کیفیت" aria-expanded=${S.panel==="quality"} onClick=${()=>openPanel("quality")} whileTap=${PRESS}><${I} n="high-definition"/><span>کیفیت</span><span class="tbl">${qLabel}<bdi dir="ltr">${rm?qName:html`<${AnimChars} text=${qName} dur=${420} blur=${4}/>`}</bdi></span></${motion.button}>
        </div>
        <div class="pl-grp">
          <div class="pl-vol">
            <${motion.button} type="button" class="ib" aria-label=${muted?"صدا را وصل کن":"بی‌صدا"} title="بی‌صدا (M)" onClick=${()=>setMuted(m=>!m)} whileTap=${PRESS}><${Glyph} k=${muted||!vol?"x":vol<.5?"l":"h"} n=${muted||!vol?"speaker-x":vol<.5?"speaker-low":"speaker-high"} rm=${rm}/></${motion.button}>
            <div class="pl-vbar" role="slider" tabindex="0" aria-label="بلندی صدا" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${Math.round(vv*100)} aria-valuetext=${fa(Math.round(vv*100))+" درصد"}
              onPointerDown=${e=>{e.currentTarget.setPointerCapture(e.pointerId);vbAt(e)}} onPointerMove=${e=>{if(e.buttons)vbAt(e)}}
              onKeyDown=${e=>{const m={ArrowLeft:-.1,ArrowDown:-.1,ArrowRight:.1,ArrowUp:.1}[e.key];if(m){e.preventDefault();e.stopPropagation();setVol(v=>Math.max(0,Math.min(1,v+m)));setMuted(false)}}}>
              <i><${motion.b} style=${{scaleX:vmv}}/><${motion.u} style=${{left:vKnob}}/></i></div>
          </div>
          <${motion.button} type="button" class="ib" aria-label=${fs?"خروج از تمام‌صفحه":"تمام‌صفحه"} title="تمام‌صفحه (F)" onClick=${toggleFs} whileTap=${PRESS}><${Glyph} k=${fs?"in":"out"} n=${fs?"corners-in":"corners-out"} rm=${rm}/></${motion.button}>
        </div>
      </div>
    </${motion.footer}>`:null}</${AnimatePresence}>

    <${AnimatePresence}>${S.card==="recap"?html`<${motion.section} key="recap" class="pl-card pl-recap" aria-label="آنچه دیدید" ...${cardIn}>
      <div class="pl-rh"><h3><${I} n="clock-counter-clockwise"/>${T.recapH}</h3><${motion.button} type="button" class="pl-txt" onClick=${()=>act("skiprecap")} whileTap=${PRESS}>رد کردن</${motion.button}></div>
      <div class="pl-src">${T.recapSrc}</div>
      <p class="pl-rt" tabindex="0">${T.recap}</p>
      <${AnimatePresence}>${recapEdges.on&&!recapEdges.end?html`<${motion.div} key="m" class="pl-more" aria-hidden="true" initial=${{opacity:0,y:-4}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:4}} transition=${{duration:.2,ease:EASE}}>ادامه‌ی متن پایین‌تر است</${motion.div}>`:null}</${AnimatePresence}>
      <${motion.button} type="button" class="cta" onClick=${()=>act("play")} whileTap=${PRESS}><${I} n="play-fill"/>ادامه‌ی تماشا از <bdi dir="ltr">${clock(T.resume,long_)}</bdi></${motion.button}>
    </${motion.section}>`:null}
    ${S.card==="next"?html`<${motion.section} key=${"next"+S.cardKey} class="pl-card pl-next" aria-label="قسمت بعد" ...${cardIn} style=${{bottom:above}}>
      <div class="hd"><img src=${T.next.img} alt=""/><div><small>قسمت بعد</small><b>${T.next.t}</b></div></div>
      <div class="row"><${motion.button} type="button" class="cta" onClick=${()=>act("playnext")} whileTap=${PRESS}><${I} n="play-fill"/>${S.count>0?html`<span>پخش در ${rm?fa(S.count):html`<${AnimChars} text=${fa(S.count)} dir=${-1} dur=${420} blur=${4}/>`} ثانیه</span>`:"پخش"}</${motion.button}>
        <${motion.button} type="button" class="ghost" onClick=${()=>act("cancelnext")} whileTap=${PRESS}>لغو</${motion.button}></div>
      <div class="go-t" aria-hidden="true"><${Fill} cls="go-f" run=${true} dur=${10000} reduced=${rm} k=${S.cardKey}/></div>
    </${motion.section}>`:null}</${AnimatePresence}>

    <${AnimatePresence}>${S.panel?html`<${Call} f=${Panel} key="panel"/>`:null}</${AnimatePresence}>
    <${AnimatePresence}>${S.dlg?html`<${Call} f=${Dlg} key=${"dlg"+S.dlg}/>`:null}</${AnimatePresence}>
  </main>
  <section class="review pl-rv" aria-label="حالت‌های پخش‌کننده">
    <h2>حالت‌های پخش‌کننده</h2>
    <p>برای بازبینی: هر حالت را انتخاب کنید؛ صفحه به بالا برمی‌گردد. پخش‌کننده کل صفحه را می‌گیرد و این بخش فقط زیر آن، برای بازبینی است.</p>
    <h3>عنوان</h3>
    <div>${[["film","فیلم: تلماسه، بخش دوم"],["ep","قسمت سریال: جدایی"]].map(x=>html`<button key=${x[0]} type="button" aria-pressed=${k===x[0]} onClick=${()=>{const id=EP_ONLY.includes(sid)&&x[0]==="film"||FILM_ONLY.includes(sid)&&x[0]==="ep"?"playing":sid;go(id,x[0]);scrollTo({top:0})}}>${x[1]}</button>`)}</div>
    <h3>حالت</h3>
    <div>${STATES.map(x=>html`<button key=${x[0]} type="button" aria-pressed=${sid===x[0]} onClick=${()=>{go(x[0]);scrollTo({top:0})}}>${x[1]}${EP_ONLY.includes(x[0])?" · سریال":FILM_ONLY.includes(x[0])?" · فیلم دوبله‌دار":""}</button>`)}</div>
    <h3>آزمون محتوا و حرکت</h3>
    <div><button type="button" aria-pressed=${long} onClick=${()=>{setLong(!long);const q=new URLSearchParams(location.search);!long?q.set("long","1"):q.delete("long");history.replaceState(null,"","?"+q)}}>عنوان خیلی بلند</button>
      <button type="button" aria-pressed=${rm} onClick=${()=>{setRm(!rm);const q=new URLSearchParams(location.search);!rm?q.set("rm","1"):q.delete("rm");history.replaceState(null,"","?"+q)}}>کاهش حرکت</button></div>
    <small>تصویرها و ویدیو جایگزین‌اند: فریم‌ها و تیزر رسمی «تلماسه: بخش دوم» (Warner Bros.) و «جدایی» (Apple TV+)، فقط برای این ماکت. زیرنویس‌ها و خلاصه‌ها متن نمونه‌اند.</small>
  </section>
  </${MotionConfig}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
