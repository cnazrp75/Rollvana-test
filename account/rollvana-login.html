}

function preset(s){
cur=s;
Object.assign(S,{step:'num',raw:'',err:false,sending:false,fail:false,failNext:false,code:'',cst:'idle',msg:null,tries:5,v:120,r:60,lock:600,expired:false,next:'film',fresh:true,frozen:false,resending:false});
const R=RIGHT[S.len];
if(s==='fa')S.raw='۰۹۱۲۳۴۵۶۷۸۹';
if(s==='plus')S.raw='+98 912 345 6789';
if(s==='bad'){S.raw='۰۹۱۲ ۳۴۵ ۶۷';S.err=true}
if(s==='sending'){S.raw='09123456789';S.sending=true;S.frozen=true}
if(s==='smsfail'){S.raw='09123456789';S.fail=true}
if(['code','resend','wrong','expired','verify'].includes(s)){S.step='code';S.raw='09123456789';S.v=107;S.r=47}
if(s==='resend'){S.v=58;S.r=0}
if(s==='wrong'){S.v=81;S.r=21;S.code=R.split('').reverse().join('');S.cst='err';S.tries=3;S.msg=['err',triesMsg()]}
if(s==='expired'){S.v=0;S.r=0;S.expired=true;S.msg=['info','اعتبار این کد تمام شد. کد تازه بگیرید؛ کد قبلی دیگر کار نمی‌کند.']}
if(s==='verify'){S.v=72;S.r=12;S.code=R;S.cst='busy';S.frozen=true}
if(s==='lock'){S.step='lock';S.raw='09123456789';S.lock=598;S.tries=0}
if(s==='ok'){S.step='ok';S.raw='09123456789'}
if(s==='okhome'){S.step='ok';S.raw='09123456789';S.fresh=false;S.next='home'}
}
function triesMsg(){
if(S.tries===1)return 'کد درست نیست. این آخرین فرصت است؛ پس از آن باید '+fa(10)+' دقیقه صبر کنید.';
return 'کد درست نیست. <b class="num">'+fa(S.tries)+'</b> بار دیگر می‌توانید امتحان کنید.';
}

function renderAll(){
$('#app').innerHTML=headerHTML()+'<main class="page lg-page" id="page"><div class="lg"><div class="lg-card" id="card">'+stepHTML()+'</div></div></main><div class="page" style="min-height:0;padding-top:0" id="rv">'+reviewHTML()+'</div>';
after();
}
function after(){
if(S.step==='num'){const i=$('#ph');i.focus({preventScroll:true});const n=i.value.length;i.setSelectionRange(n,n)}
if(S.step==='code'){const i=$('#otp');if(!S.expired){i.focus({preventScroll:true});if(S.cst==='err')i.select()}ring()}
if(S.step==='lock'||S.step==='ok'){const h=$('#lgt');h&&h.focus({preventScroll:true})}
}
function go(step,back){
S.step=step;
const card=$('#card'),old=card.querySelector('.lg-st:not(.ghost)');
card.querySelectorAll('.ghost').forEach(g=>g.remove());
const t=document.createElement('div');t.innerHTML=stepHTML();const nw=t.firstElementChild;
if(old&&!RM.matches){old.classList.add('ghost');if(back)old.classList.add('back');setTimeout(()=>old.remove(),200);nw.classList.add('fresh');if(back)nw.classList.add('back')}else if(old)old.remove();
card.appendChild(nw);
$('#rv').innerHTML=reviewHTML();
after();
}
function refresh(sel,html){const e=$(sel);if(e)e.innerHTML=html}

function ring(){
const r=$('#or'),oc=$('#oc');if(!r||!oc)return;
const i=Math.min(S.code.length,S.len-1),c=oc.children[i];if(!c)return;
r.style.width=c.offsetWidth+'px';r.style.transform='translateX('+c.offsetLeft+'px)';
oc.querySelectorAll('i').forEach(x=>x.remove());
if(S.code.length<S.len&&document.activeElement&&document.activeElement.id==='otp'&&S.cst!=='busy')c.appendChild(document.createElement('i'));
}
function paintCells(prev){
const oc=$('#oc');if(!oc)return;
for(let i=0;i<S.len;i++){const c=oc.children[i],d=S.code[i]||'',p=prev[i]||'';if(d===p&&c.querySelector('b'))continue;c.classList.toggle('on',!!d);c.innerHTML=d?'<b>'+fa(d)+'</b>':''}
ring();
}
function setCst(st){S.cst=st;const o=$('#ot');if(o)o.dataset.st=S.expired?'off':st;const i=$('#otp');if(i){i.setAttribute('aria-invalid',st==='err');i.readOnly=st==='busy'||S.expired}}
function setMsg(m){S.msg=m;const e=$('#om');if(!e)return;e.dataset.st=m?m[0]:'';e.innerHTML=msgHTML()}
function codeCta(){const b=$('#ccta');if(!b)return;b.innerHTML=ctaCode();b.setAttribute('aria-busy',S.cst==='busy'||S.resending);b.disabled=!S.expired&&(S.code.length<S.len||S.cst==='err')&&S.cst!=='busy'}

function onPhone(v){
S.raw=v;cur='';
const n=norm(v);
if(S.err&&n)S.err=false;
const pf=$('#pf');pf.dataset.st=S.err?'err':'';
$('#ph').setAttribute('aria-invalid',S.err);
$('#pfok').hidden=!n;
const h=helpNum(),hp=$('#phh');
if(hp.dataset.st!==h[0]||hp.innerHTML!==h[1]){hp.dataset.st=h[0];hp.innerHTML=h[1]}
}
function submitNum(){
if(S.sending)return;
const n=norm(S.raw);
if(!n){S.err=true;onPhone(S.raw);$('#ph').focus();return}
S.sending=true;S.fail=false;cur='';
const f=$('.lg-nt');f&&f.remove();
$('#ph').readOnly=true;const b=$('#ncta');b.setAttribute('aria-busy','true');b.innerHTML=ctaNum();
setTimeout(()=>{
S.sending=false;
if(S.failNext){S.failNext=false;S.fail=true;go('num');return}
Object.assign(S,{code:'',cst:'idle',msg:null,v:120,r:60,expired:false});
go('code');
},1100);
}
function onCode(inp){
const prev=S.code;
const v=en(inp.value).replace(/\D/g,'').slice(0,S.len);
if(inp.value!==v)inp.value=v;
S.code=v;cur='';
if(S.cst==='err'){setCst('idle');setMsg(null)}
if(S.msg&&S.msg[0]==='info')setMsg(null);
paintCells(prev);codeCta();
if(v.length===S.len)verify();
}
function verify(){
if(S.cst==='busy'||S.expired)return;
setCst('busy');codeCta();ring();
setTimeout(()=>{
if(S.code===RIGHT[S.len]){setCst('done');go('ok');return}
S.tries--;
if(S.tries<=0){S.lock=600;go('lock');return}
setCst('err');setMsg(['err',triesMsg()]);codeCta();
const i=$('#otp');i.focus();i.select();ring();
},900);
}
function resend(){
if(S.resending)return;
S.resending=true;cur='';
refresh('#rsw',rsHTML());codeCta();
setTimeout(()=>{
S.resending=false;
Object.assign(S,{v:120,r:60,expired:false,code:''});
const wasExp=$('#ot')&&$('#ot').dataset.st==='off';
if(wasExp){go('code');setMsg(['info','کد تازه فرستاده شد.']);return}
setCst('idle');paintCells('xxxxxx');refresh('#vv',vHTML());refresh('#rsw',rsHTML());
const i=$('#otp');i.value='';i.focus();setMsg(['info','کد تازه فرستاده شد. کد قبلی دیگر کار نمی‌کند.']);codeCta();ring();
},900);
}

setInterval(()=>{
if(S.step==='code'&&!S.frozen&&!S.expired){
if(S.v>0){S.v--;tmSet($('#vv .tm'),clock(S.v))}
if(S.r>0){S.r--;if(S.r===0)refresh('#rsw',rsHTML());else tmSet($('#rsw .tm'),clock(S.r))}
if(S.v===0&&S.cst!=='busy'){S.expired=true;S.code='';setMsg(['info','اعتبار این کد تمام شد. کد تازه بگیرید؛ کد قبلی دیگر کار نمی‌کند.']);go('code')}
}
if(S.step==='lock'){if(S.lock>0){S.lock--;tmSet($('#lkt .tm'),clock(S.lock))}if(S.lock===0){S.tries=5;go('num',true)}}
},1000);

document.addEventListener('click',e=>{
const a0=e.target.closest('a[href]');if(a0)e.preventDefault();
const t=e.target.closest('[data-act]');if(!t)return;
const a=t.dataset.act,v=t.dataset.v;
if(a==='state'){preset(v);renderAll();window.scrollTo({top:0});return}
if(a==='len'){S.len=+v;const c=cur;preset(c||'empty');renderAll();return}
if(a==='edit'){cur='';Object.assign(S,{err:false,sending:false,fail:false,code:'',cst:'idle',msg:null,expired:false});go('num',true);return}
if(a==='resend'){if(t.getAttribute('aria-disabled')==='true')return;resend();return}
});
document.addEventListener('submit',e=>{
e.preventDefault();
if(e.target.id==='nf')submitNum();
if(e.target.id==='cf'){if(S.expired)resend();else if(S.code.length===S.len)verify()}
});
document.addEventListener('input',e=>{if(e.target.id==='ph')onPhone(e.target.value);if(e.target.id==='otp')onCode(e.target)});
document.addEventListener('focusout',e=>{if(e.target.id==='ph'&&S.raw.trim()&&!norm(S.raw)&&!S.sending&&S.step==='num'){S.err=true;onPhone(S.raw)}if(e.target.id==='otp')setTimeout(ring,0)});
document.addEventListener('focusin',e=>{if(e.target.id==='otp'){const i=e.target,n=i.value.length;if(S.cst!=='err')i.setSelectionRange(n,n);ring()}});
document.addEventListener('keyup',e=>{if(e.target.id==='otp')ring()});
addEventListener('resize',ring);

preset(cur);
renderAll();
document.fonts&&document.fonts.ready.then(ring);
</script>
</body>
</html>
