      <input id="ph" ref=${inRef} name="mobile" type="tel" inputMode="tel" autoComplete="tel" enterKeyHint="send" maxLength=${20} spellCheck=${false}
        placeholder=${fmt("09123456789")} value=${s.raw} readOnly=${s.sending} aria-invalid=${s.err} aria-describedby="phh"
        onInput=${e=>act.phone(e.target.value)} onBlur=${act.blur}/>
      <${AnimatePresence} initial=${false}>${n&&!s.err&&html`<${motion.span} key="ok" class="sf-ok" aria-hidden="true"
        initial=${reduced?{opacity:0}:{opacity:0,scale:.5}} animate=${{opacity:1,scale:1}} exit=${reduced?{opacity:0}:{opacity:0,scale:.5,transition:{duration:.14,ease:EASE_LEAVE}}} transition=${reduced?{duration:.12}:SNAP}><${I} n="check-circle"/></${motion.span}>`}</${AnimatePresence}>
    </div>
    <p id="phh" class=${"sf-h lg-hint"+(s.err?" is-err":"")} aria-live="polite">
      <${AnimatePresence} initial=${false} mode="popLayout">${s.err&&html`<${motion.span} key="w" style=${{display:"inline-flex"}} initial=${reduced?{opacity:0}:{opacity:0,scale:.5}} animate=${{opacity:1,scale:1}} exit=${{opacity:0,scale:.5,transition:{duration:.12}}} transition=${reduced?{duration:.12}:SNAP}><${I} n="warning-circle"/></${motion.span}>`}</${AnimatePresence}>
      <span><${Words} text=${hint} k=${hint} reduced=${reduced}/></span>
    </p>
    <${AnimatePresence} initial=${false}>${s.fail&&html`<${motion.div} key="nt" class="lg-nt" role="alert" ...${settle(reduced)}>
      <${I} n="warning-circle"/><div><b>پیامک فرستاده نشد</b>مشکل از سمت ماست، نه از شماره‌ی شما. چند لحظه‌ی دیگر دوباره امتحان کنید.</div>
    </${motion.div}>`}</${AnimatePresence}>
  </${React.Fragment}>`;
}
function Cells({s,focus,reduced}){
  const at=Math.min(s.code.length,LEN-1);
  return html`<div class="otp-c" aria-hidden="true">${Array.from({length:LEN},(_,i)=>{
    const d=s.code[i];const on=focus&&!s.sel&&!s.expired&&s.cst!=="busy"&&i===at;
    return html`<span key=${i} class=${d?"on":""}>
      ${on&&html`<${motion.span} class="otp-r" layoutId="otpring" transition=${reduced?{duration:0}:MARK}/>`}
      <${AnimatePresence} initial=${false} mode="popLayout">${d&&html`<${motion.b} key=${d}
        initial=${reduced?{opacity:0}:{opacity:0,scale:.5,y:6}} animate=${{opacity:1,scale:1,y:0}} exit=${reduced?{opacity:0}:{opacity:0,scale:.5}} transition=${{duration:reduced?.1:.18,ease:EASE}}>${fa(d)}</${motion.b}>`}</${AnimatePresence}>
      ${on&&!d&&html`<${motion.i} key=${"k"+i} class="otp-k" initial=${{opacity:1}} animate=${reduced?{opacity:1}:{opacity:[1,1,0,0,1]}} transition=${{duration:1.1,repeat:3,times:[0,.45,.5,.95,1]}}/>`}
    </span>`})}</div>`;
}
function CodeStep({s,act,codeRef,reduced}){
  const [focus,setFocus]=useState(false);
  const rk=s.resending?"busy":s.r>0?"wait":"go";
  return html`<${React.Fragment}>
    <${motion.button} type="button" class="lg-ed" onClick=${act.edit} whileTap=${PRESS}><${I} n="pencil-simple"/>ویرایش شماره</${motion.button}>
    <div class=${"otp"+(s.cst==="err"?" is-err":"")+(s.expired?" is-off":"")+(s.cst==="busy"?" is-busy":"")+(s.sel?" is-sel":"")}>
      <${Cells} s=${s} focus=${focus} reduced=${reduced}/>
      <input id="otp" ref=${codeRef} name="code" type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9۰-۹]*" maxLength=${LEN*3} spellCheck=${false} autoCorrect="off"
        value=${s.code} readOnly=${s.expired||s.cst==="busy"} aria-disabled=${s.expired||undefined} aria-invalid=${s.cst==="err"} aria-label=${"کد ورود "+fa(LEN)+" رقمی"} aria-describedby="om vv"
        onInput=${e=>act.code(e.target.value)} onFocus=${()=>setFocus(true)} onBlur=${()=>setFocus(false)}
        onPaste=${e=>{const t=en(e.clipboardData.getData("text")).replace(/\D/g,"");if(t.length>=LEN){e.preventDefault();act.code(t)}}}/>
    </div>
    <p id="om" class=${"otp-msg"+(s.msg&&s.msg[0]==="err"?" is-err":"")} aria-live="polite">
      ${s.msg&&html`<${I} n=${s.msg[0]==="err"?"warning-circle":"info"}/>`}
      <span><${Words} text=${s.msg?s.msg[1]:""} k=${s.msg?s.msg[1]:"none"} reduced=${reduced}/></span>
    </p>
    <${AnimatePresence} initial=${false}>${!s.expired&&html`<${motion.div} key="m" class="otp-m" exit=${{opacity:0,transition:{duration:.14}}}>
      <span class="otp-v" id="vv"><${I} n="clock-countdown"/>اعتبار کد <${AnimChars} text=${clock(s.v)} label=${spoken(s.v)}/></span>
      <span class="rsw"><${Cross} k=${rk} reduced=${reduced} blur=${6} dur=${.3}>
        ${rk==="busy"?html`<span class="rs" aria-disabled="true">در حال فرستادن…</span>`
        :rk==="wait"?html`<span class="rs" aria-disabled="true" role="timer" aria-label=${"ارسال دوباره، "+spoken(s.r)+" دیگر"}><${AnimChars} text=${clock(s.r)}/> تا ارسال دوباره</span>`
        :html`<${motion.button} type="button" class="rs" onClick=${act.resend} whileTap=${PRESS}><${I} n="arrow-clockwise"/>ارسال دوباره‌ی کد</${motion.button}>`}
      </${Cross}></span>
    </${motion.div}>`}</${AnimatePresence}>
  </${React.Fragment}>`;
}
function Form({s,act,inRef,codeRef,reduced}){
  const code=s.step==="code";
  const n=norm(s.raw)||"09123456789";
  const title=code?"کد ورود را بنویسید":"ورود یا ثبت‌نام";
  const lead=code?"کد "+fa(LEN)+" رقمی به *"+fmt(n,NB)+" پیامک شد.":"شماره‌ی موبایلتان را بنویسید تا کد ورود پیامک شود. حساب ندارید؟ با همین کد ساخته می‌شود.";
  const busy=code?(s.cst==="busy"||s.resending):s.sending;
  const label=code?(s.cst==="busy"?"در حال بررسی کد…":s.expired?(s.resending?"در حال فرستادن کد…":"دریافت کد تازه"):"ورود"):(s.sending?"در حال فرستادن کد…":s.fail?"تلاش دوباره":"دریافت کد ورود");
  const off=code&&!s.expired&&s.cst!=="busy"&&(s.code.length<LEN||s.cst==="err");
  return html`<form class="lg-f" noValidate action="/login" onSubmit=${e=>{e.preventDefault();act.submit()}} aria-labelledby="lgt">
    <div class="lg-hd">
      <h1 class="lg-h1" id="lgt"><${Words} text=${title} k=${title} reduced=${reduced}/></h1>
      <p class="lg-lead"><${Words} text=${lead} k=${lead} reduced=${reduced} stagger=${.02}/></p>
    </div>
    <div class="lg-bd"><${AnimatePresence} initial=${false} mode="popLayout" custom=${[s.dir,reduced]}>
      <${motion.div} key=${s.step} class="lg-st" custom=${[s.dir,reduced]} variants=${SLIDE} initial="enter" animate="center" exit="exit" transition=${reduced?{duration:.15}:SOFT}>
        ${code?html`<${CodeStep} s=${s} act=${act} codeRef=${codeRef} reduced=${reduced}/>`:html`<${NumStep} s=${s} act=${act} inRef=${inRef} reduced=${reduced}/>`}
      </${motion.div}>
    </${AnimatePresence}></div>
    <${motion.button} layout="position" type="submit" class="cta lg-cta" disabled=${off} aria-busy=${busy} transition=${{layout:reduced?{duration:0}:SPR}} whileTap=${off||busy?undefined:{scale:.97}}>
      <span class="lg-cl"><${Cross} k=${label} reduced=${reduced} blur=${6} dur=${.3}><span style=${{display:"inline-flex",alignItems:"center",gap:10}}>${busy&&html`<${Spin} reduced=${reduced}/>`}${label}</span></${Cross}></span>
    </${motion.button}>
  </form>`;
}
function Lock({s,act,reduced}){
  const n=norm(s.raw)||"09123456789";
  return html`<${motion.div} class="emp lk" role="group" aria-labelledby="lkh" ...${settle(reduced)}>
    <span class="eg"><${I} n="clock-countdown"/></span>
    <h1 class="lk-h" id="lkh" tabIndex="-1">چند دقیقه صبر کنید</h1>
    <span class="lk-t" role="timer"><${AnimChars} text=${clock(s.lock)} label=${spoken(s.lock)+" مانده"}/></span>
    <span class="lk-n">تا ورود دوباره با <bdi class="lg-num" dir="ltr">${fmt(n)}</bdi></span>
    <p>کد ${fa(K.tries)} بار نادرست وارد شد. برای امنیت حساب، تا پایان این زمان کدی برای این شماره پذیرفته نمی‌شود.</p>
    <${motion.button} type="button" class="cta" onClick=${act.edit} whileTap=${{scale:.97}}>ورود با شماره‌ی دیگر</${motion.button}>
  </${motion.div}>`;
}
function Blocked({s,act,reduced}){
  const n=norm(s.raw)||BLOCKED;
  return html`<${motion.div} class="emp lk bk" role="group" aria-labelledby="bkh" ...${settle(reduced)}>
    <${motion.span} class="eg is-err" initial=${reduced?{opacity:0}:{opacity:0,scale:.6}} animate=${{opacity:1,scale:1}} transition=${reduced?{duration:.12}:{...SNAP,delay:.08}}><${I} n="prohibit"/></${motion.span}>
    <h1 class="bk-h" id="bkh" tabIndex="-1">این حساب مسدود شده است</h1>
    <span class="lk-n">شماره‌ی <bdi class="lg-num" dir="ltr">${fmt(n)}</bdi></span>
    <${motion.button} type="button" class="cta" onClick=${act.another} whileTap=${{scale:.97}}>ورود با شماره‌ی دیگر</${motion.button}>
  </${motion.div}>`;
}
function Ok({s,reduced}){
  const nx=s.next?NX:null;const to=nx?nx.href:HOME;
  useEffect(()=>{if(!s.live)return;const t=setTimeout(()=>{location.href=to},reduced?200:K.go);return()=>clearTimeout(t)},[]);
  return html`<${motion.div} class="go lg-go" role="status" aria-live="polite" ...${settle(reduced)}>
    <span class="lg-okh" id="okh" tabIndex="-1"><${motion.span} style=${{display:"inline-flex"}} initial=${reduced?{opacity:0}:{opacity:0,scale:.4,rotate:-30}} animate=${{opacity:1,scale:1,rotate:0}} transition=${reduced?{duration:.12}:{...SNAP,delay:.12}}><${I} n="check-circle"/></${motion.span}>${s.fresh?"حساب شما ساخته شد":"خوش برگشتید"}</span>
    ${nx?html`<span class="go-p"><img src=${nx.img} alt=""/></span>`:html`<span class="go-p lg-hm"><${I} n="house"/></span>`}
    <span class="go-k">${nx?"برمی‌گردید به همان صفحه‌ای که در آن بودید":"به صفحه‌ی اصلی می‌روید"}</span>
    <h2>${nx?nx.fa:"صفحه‌ی اصلی رول‌وانا"}</h2>
    ${nx&&html`<span class="le">${nx.en}</span>`}
    ${nx&&html`<span class="lm num"><span class="kd"><${I} n="film"/>فیلم</span><span>${fa(nx.y)}</span></span>`}
    <span class="go-t" aria-hidden="true"><${Fill} run=${true} dur=${K.go} reduced=${reduced} k=${"ok"} cls="go-f"/></span>
    <a class="go-l" href=${to}>اگر صفحه باز نشد، اینجا را بزنید</a>
  </${motion.div}>`;
}
function LoginReview({s}){
  const nav=p=>{const u=new URL(location.href);Object.entries(p).forEach(([k,v])=>v==null?u.searchParams.delete(k):u.searchParams.set(k,v));location.href=u};
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی، در سایت نیست). صفحه زنده است: هر شماره‌ای بنویسید؛ کد درست در این نمونه <bdi dir="ltr">${fa(RIGHT[LEN])}</bdi> است و هر کد دیگری نادرست حساب می‌شود. شماره‌ی <bdi dir="ltr">${fmt(FAIL)}</bdi> خطای سامانه‌ی پیامک را نشان می‌دهد و شماره‌ی <bdi dir="ltr">${fmt(BLOCKED)}</bdi> پس از کد درست، حساب مسدود را.</span>
    <div class="grp"><span>حالت</span><div>${STATES.map(([k,l])=>html`<${motion.button} key=${k} whileTap=${{scale:.95}} aria-pressed=${S0===k} onClick=${()=>nav({s:k})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>طول کد (بسته به سامانه‌ی پیامک)</span><div>${[6,5].map(n=>html`<${motion.button} key=${n} whileTap=${{scale:.95}} aria-pressed=${LEN===n} onClick=${()=>nav({len:n===5?"5":null})}>کد ${fa(n)} رقمی</${motion.button}>`)}</div></div>
    <div class="grp"><span>نشانی این صفحه</span><code dir="ltr">${s.next?"/login?next="+NX.route:"/login"}</code></div>
    <a class="syslink" href="../system/rollvana-design-system.html#login">سیستم طراحی، بخش ورود ←</a>
  </section>`;
}
function App(){
  const desk=useDesk();const reduced=useReducedMotion();
  const [s,set]=useState(()=>preset(S0));
  const up=p=>set(o=>{const x=typeof p==="function"?p(o):p;return x===o?o:{...o,...x}});
  const inRef=useRef();const codeRef=useRef();const tm=useRef([]);
  const later=(f,ms)=>tm.current.push(setTimeout(f,ms));
  useEffect(()=>()=>tm.current.forEach(clearTimeout),[]);
  useEffect(()=>{const t=setInterval(()=>up(o=>{
    if(o.frozen)return o;
    if(o.step==="code"&&!o.expired){
      const v=Math.max(o.v-1,0),r=Math.max(o.r-1,0);
      if(v===0&&o.cst!=="busy")return {v:0,r:0,expired:true,code:"",cst:"idle",sel:false,msg:["info",EXP]};
      return {v,r};
    }
    if(o.step==="lock"){if(o.lock>1)return {lock:o.lock-1};return {lock:0,step:"num",dir:-1,tries:K.tries,err:false,code:"",cst:"idle",msg:null}}
    return o;
  }),1000);return()=>clearInterval(t)},[]);
  useEffect(()=>{requestAnimationFrame(()=>{
    if(s.step==="num"&&inRef.current){const i=inRef.current;i.focus({preventScroll:true});const n=i.value.length;try{i.setSelectionRange(n,n)}catch(e){}}
    if(s.step==="code"&&codeRef.current&&!s.expired){const i=codeRef.current;i.focus({preventScroll:true});if(s.sel)i.select()}
    if(s.step==="lock"){const h=document.getElementById("lkh");h&&h.focus({preventScroll:true})}
    if(s.step==="blocked"){const h=document.getElementById("bkh");h&&h.focus({preventScroll:true})}
    if(s.step==="ok"){const h=document.getElementById("okh");h&&h.focus({preventScroll:true})}
  })},[s.step,s.expired]);
  const verify=code=>{
    up({cst:"busy",sel:false,live:true});
    later(()=>up(o=>{
      if(code===RIGHT[LEN])return norm(o.raw)===BLOCKED?{cst:"idle",code:"",msg:null,step:"blocked",dir:1,tries:K.tries}:{cst:"done",step:"ok",dir:1};
      const t=o.tries-1;
      if(t<=0)return {tries:0,step:"lock",dir:1,lock:K.lock,cst:"idle",code:"",msg:null};
      requestAnimationFrame(()=>{const i=codeRef.current;if(i){i.focus({preventScroll:true});i.select()}});
      return {tries:t,cst:"err",msg:triesMsg(t),sel:true};
    }),K.check);
  };
  const resend=()=>{
    up({resending:true,live:true});
    later(()=>{up({resending:false,v:K.v,r:K.r,expired:false,code:"",cst:"idle",sel:false,msg:["info",NEWC]});requestAnimationFrame(()=>{const i=codeRef.current;i&&i.focus({preventScroll:true})})},K.check);
  };
  const act={
    phone:v=>up(o=>({raw:v,live:true,err:o.err&&!norm(v)})),
    blur:()=>up(o=>o.step==="num"&&!o.sending&&o.raw.trim()&&!norm(o.raw)?{err:true}:o),
    edit:()=>up({step:"num",dir:-1,err:false,sending:false,fail:false,code:"",cst:"idle",msg:null,expired:false,sel:false,resending:false,v:K.v,r:K.r,tries:K.tries,live:true,frozen:false}),
    another:()=>up({raw:"",step:"num",dir:-1,err:false,sending:false,fail:false,code:"",cst:"idle",msg:null,expired:false,sel:false,resending:false,v:K.v,r:K.r,tries:K.tries,live:true,frozen:false}),
    code:v=>{
      const d=en(v).replace(/\D/g,"").slice(0,LEN);
      if(codeRef.current&&codeRef.current.value!==d)codeRef.current.value=d;
      up(o=>({code:d,live:true,frozen:false,sel:false,cst:o.cst==="err"?"idle":o.cst,msg:o.msg&&o.msg[1]!==EXP&&d.length?null:o.msg}));
      if(d.length===LEN)verify(d);
    },
    resend:()=>{if(!s.resending)resend()},
    submit:()=>{
      if(s.step==="num"){
        if(s.sending)return;
        const n=norm(s.raw);
        if(!n){up({err:true,live:true});inRef.current&&inRef.current.focus();return}
        up({sending:true,fail:false,live:true,frozen:false});
        later(()=>up(n===FAIL?{sending:false,fail:true}:{sending:false,step:"code",dir:1,code:"",cst:"idle",msg:null,v:K.v,r:K.r,expired:false,tries:K.tries,sel:false}),K.send);
        return;
      }
      if(s.expired){if(!s.resending)resend();return}
      if(s.code.length===LEN&&s.cst!=="busy"&&s.cst!=="err")verify(s.code);
    }
  };
  const form=s.step==="num"||s.step==="code";
  return html`<${React.Fragment}>
    <${Header} user=${false} desk=${desk}/>
    <main class="lgn" id="page">
      <div class="lg-in">
        <${AnimatePresence} initial=${false} mode="popLayout">
          ${form?html`<${motion.div} key="form" ...${settle(reduced)}><${Form} s=${s} act=${act} inRef=${inRef} codeRef=${codeRef} reduced=${reduced}/></${motion.div}>`
          :s.step==="lock"?html`<${Lock} key="lock" s=${s} act=${act} reduced=${reduced}/>`
          :s.step==="blocked"?html`<${Blocked} key="blocked" s=${s} act=${act} reduced=${reduced}/>`
          :html`<${Ok} key="ok" s=${s} reduced=${reduced}/>`}
        </${AnimatePresence}>
      </div>
    </main>
    <div class="lgv"><${LoginReview} s=${s}/></div>
    ${!desk&&html`<${Tabs}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
