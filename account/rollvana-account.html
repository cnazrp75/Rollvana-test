        initial=${reduced?{opacity:0}:{y:"100%"}} animate=${{opacity:1,y:"0%"}} exit=${reduced?{opacity:0}:{y:"100%",transition:{duration:.24,ease:EASE_LEAVE}}} transition=${reduced?{duration:.15}:SHEET}
        drag="y" dragControls=${dc} dragListener=${false} dragConstraints=${{top:0,bottom:0}} dragElastic=${{top:0,bottom:.6}} onDragEnd=${(e,i)=>{if(i.offset.y>120||i.velocity.y>600)act.close()}}>
        <div class="grab" onPointerDown=${e=>dc.start(e)} style=${{touchAction:"none"}}><i></i></div>${head}${body}
      </${motion.div}>
    </${React.Fragment}>`)}</${AnimatePresence}>`;
}
function SideNav({cur,go,out}){
  return html`<nav class="acn" aria-label="بخش‌های حساب">
    ${SPOT.map(([id,l,g])=>html`<a key=${id} href=${"#"+id} aria-current=${cur===id?"true":undefined} onClick=${e=>{e.preventDefault();go(id)}}>
      ${cur===id&&html`<${motion.span} class="on" layoutId="acnon" transition=${SPR}/>`}<${I} n=${g}/>${l}</a>`)}
    <hr/>
    <button type="button" class="acn-o" onClick=${out}><${I} n="out"/>خروج از حساب</button>
  </nav>`;
}
function Guest({reduced}){
  return html`<div class="go lg-go acgo" role="status">
    <span class="go-p lg-hm"><${I} n="lock"/></span>
    <span class="go-k">این صفحه فقط برای اعضاست</span>
    <h2>اول وارد شوید</h2>
    <span class="go-k">پس از ورود، به همین صفحه برمی‌گردید.</span>
    <span class="go-t" aria-hidden="true"><${Fill} run=${true} dur=${900} reduced=${reduced} k="g" cls="go-f"/></span>
    <a class="go-l" href="rollvana-login.html?s=empty">اگر صفحه‌ی ورود باز نشد، اینجا را بزنید</a>
  </div>`;
}
function AccReview({s,fail}){
  const nav=p=>{const u=new URL(location.href);Object.entries(p).forEach(([k,v])=>v==null?u.searchParams.delete(k):u.searchParams.set(k,v));location.href=u};
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی، در سایت نیست). صفحه زنده است: تنظیم‌ها ذخیره می‌شوند، دستگاه دیگر را می‌شود خارج کرد، زنگ بالای صفحه اعلان‌ها را باز می‌کند و هر اعلان با زدن خوانده می‌شود. تاریخ‌ها، مبلغ‌ها و دستگاه‌ها نمونه‌اند.</span>
    <div class="grp"><span>حالت</span><div>${STATES.map(([k,l])=>html`<${motion.button} key=${k} whileTap=${{scale:.95}} aria-pressed=${S0===k} onClick=${()=>nav({s:k})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>شمار اعلان‌های خوانده‌نشده روی زنگ</span><div>${[[1,"۱"],[3,"۳"],[12,"۱۲"],[120,"بیش از ۹۹ (۱۲۰ از ۱۵۰)"],[0,"هیچ"]].map(([n,l])=>html`<${motion.button} key=${n} whileTap=${{scale:.95}} aria-pressed=${B0===n} onClick=${()=>nav({b:n===3?null:n})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>ذخیره‌ی تنظیم‌ها</span><div>${[[false,"موفق"],[true,"ناموفق (تلاش دوباره موفق است)"]].map(([v,l])=>html`<${motion.button} key=${l} whileTap=${{scale:.95}} aria-pressed=${fail===v} onClick=${()=>nav({fail:v?"1":null})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>نشانی این صفحه</span><code dir="ltr">/account</code><code dir="ltr">${"guest → /login?next=/account"}</code></div>
    <a class="syslink" href="../system/rollvana-design-system.html#account-page">سیستم طراحی، بخش حساب و اعلان‌ها ←</a>
  </section>`;
}
function App(){
  const desk=useDesk();const reduced=useReducedMotion();
  const [st,set]=useState(()=>preset(S0));
  const up=p=>set(o=>{const x=typeof p==="function"?p(o):p;return x===o?o:{...o,...x}});
  const tm=useRef([]);const later=(f,ms)=>tm.current.push(setTimeout(f,ms));
  useEffect(()=>()=>tm.current.forEach(clearTimeout),[]);
  const [cur,setCur]=useState("sub");const [say,setSay]=useState("");
  useEffect(()=>{if(st.scroll){const el=document.getElementById(st.scroll);el&&el.scrollIntoView({block:"start"})}},[]);
  useEffect(()=>{if(!desk||st.guest)return;const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setCur(e.target.id)})},{rootMargin:"-30% 0px -60% 0px"});
    SPOT.forEach(([id])=>{const el=document.getElementById(id);el&&io.observe(el)});return()=>io.disconnect()},[desk]);
  useEffect(()=>{if(!st.toast)return;const t=setTimeout(()=>up({toast:null}),4000);return()=>clearTimeout(t)},[st.toast]);
  const save=(k,v,force)=>{
    up(o=>{const prev=o.set[k];const fl={...o.fl};delete fl[k];return {set:{...o.set,[k]:v},sv:{...o.sv,[k]:"wait"},fl,prev:{...(o.prev||{}),[k]:prev}}});
    later(()=>up(o=>{
      if(o.fail&&!force){setSay("تغییر ذخیره نشد");return {set:{...o.set,[k]:o.prev[k]},sv:{...o.sv,[k]:"err"},fl:{...o.fl,[k]:{v}}}}
      setSay("ذخیره شد");later(()=>up(x=>x.sv[k]==="ok"?{sv:{...x.sv,[k]:undefined}}:x),2400);
      return {sv:{...o.sv,[k]:"ok"}};
    }),650);
  };
  const act={
    set:(k,v)=>save(k,v,false),
    retry:k=>{if(st.fl[k])save(k,st.fl[k].v,true)},
    ask:q=>up({q,busy:false}),
    cancel:()=>up(o=>o.busy?o:{q:null}),
    confirm:()=>{if(st.busy)return;const q=st.q;up({busy:true});
      later(()=>{if(q.k==="dev"){const d=st.devs.find(x=>x.id===q.id);up({q:null,busy:false});later(()=>{up(o=>({devs:o.devs.filter(x=>x.id!==q.id),toast:{k:"dev",t:"«"+d.n+"» از حساب خارج شد"}}));setSay(d.n+" از حساب خارج شد")},280)}
        else{location.href="../home/home-v3.html"}},q.k==="dev"?700:900)},
    open:()=>up(o=>({open:!o.open,wave:false})),
    close:()=>{up({open:false});requestAnimationFrame(()=>{const b=document.getElementById("bell");b&&b.focus({preventScroll:true})})},
    read:id=>up(o=>({wave:false,nf:o.nf.map(n=>n.id===id?{...n,un:false}:n)})),
    readAll:()=>{up(o=>({wave:true,nf:o.nf.map(n=>({...n,un:false}))}));setSay("همه‌ی اعلان‌ها خوانده شد")},
    exp:id=>up(o=>({exp:{...o.exp,[id]:!o.exp[id]}})),
    more:()=>up(o=>({shown:o.shown+20})),
    go:to=>later(()=>{location.href=to},260)
  };
  const un=st.nf.filter(n=>n.un).length;
  const goSec=id=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"});setCur(id)};
  const bell=html`<${Bell} n=${un} open=${st.open} onOpen=${act.open} reduced=${reduced}/>`;
  return html`<${React.Fragment}>
    <${Header} user=${!st.guest} desk=${desk} bell=${bell} sub=${st.sub}/>
    <main class="acp" id="page">
      ${st.guest?html`<div class="lg-in"><${Guest} reduced=${reduced}/></div>`:html`<div class="acp-in">
        <${SideNav} cur=${cur} go=${goSec} out=${()=>act.ask({k:"out"})}/>
        <div class="acm">
          <header class="ach"><h1>حساب من</h1><span class="ach-n"><${I} n="device-mobile"/><bdi dir="ltr">${phf(PHONE)}</bdi><small>شماره‌ی ورود</small></span></header>
          <${SubCard} sub=${st.sub} reduced=${reduced}/>
          <${Pays} pays=${st.pays}/>
          <${Devs} st=${st} act=${act} reduced=${reduced}/>
          <${Settings} st=${st} act=${act} reduced=${reduced}/>
          <section class="asx" aria-label="خروج"><div class="acl"><${motion.button} type="button" class="acq-o" onClick=${()=>act.ask({k:"out"})} whileTap=${{scale:.99}}><${I} n="out"/><span>خروج از حساب<small>فقط از همین دستگاه</small></span></${motion.button}></div></section>
        </div>
      </div>`}
    </main>
    <div class="acv"><${AccReview} s=${S0} fail=${st.fail}/></div>
    <p class="acsr" role="status" aria-live="polite">${say}</p>
    <${Confirm} q=${st.q} st=${st} act=${act} desk=${desk} reduced=${reduced}/>
    <${NPanel} st=${st} act=${act} desk=${desk} reduced=${reduced}/>
    <${AnimatePresence}>${st.toast&&html`<${motion.div} key="t" class="toast" role="status" style=${{x:"-50%"}}
      initial=${reduced?{opacity:0}:{opacity:0,y:12,scale:.98}} animate=${{opacity:1,y:0,scale:1}} exit=${reduced?{opacity:0}:{opacity:0,y:8,transition:{duration:.18,ease:EASE_LEAVE}}} transition=${{duration:.28,ease:EASE}}>${st.toast.t}</${motion.div}>`}</${AnimatePresence}>
    ${!desk&&html`<${Tabs}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
