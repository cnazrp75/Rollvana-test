  ["فهرست‌های کاربران","فهرست‌هایی که بینندگان رول‌وانا ساخته‌اند","#",[H+"p-past-lives.jpg",H+"p-her.jpg",H+"p-whiplash.jpg"]]

}
function Go({t,live}){
  const reduced=useReducedMotion();
  useEffect(()=>{if(!live)return;const x=setTimeout(()=>{location.href=t.s?TS:TF},reduced?200:760);return()=>clearTimeout(x)},[live]);
  return html`<${motion.div} class="go" role="status" aria-live="polite" initial=${reduced?{opacity:0}:{opacity:0,y:8,filter:"blur(6px)"}} animate=${{opacity:1,y:0,filter:"blur(0px)",transitionEnd:{filter:"none"}}} transition=${{duration:reduced?.15:.4,ease:EASE}}>

    <span class="go-k">در حال باز کردن صفحه‌ی ${t.s?"سریال":"فیلم"}</span>

}
const reqHref=q=>"/requests/new?title="+encodeURIComponent(q.trim());
function NoResult({q,id}){
  const reduced=useReducedMotion();

      :html`<h2>برای «<bdi class="q">${q.trim()}</bdi>» چیزی پیدا نکردیم</h2>
        <p>املای دیگری را امتحان کنید یا نام انگلیسی‌اش را بنویسید. اگر هنوز روی رول‌وانا نیست، درخواستش را بفرستید.</p>`}
    <${motion.a} class="cta" href=${reqHref(q)} onClick=${e=>{e.preventDefault();const a=document.getElementById("addr");if(a)a.textContent=reqHref(q)}} whileTap=${PRESS}><${I} n="plus"/>درخواست این عنوان</${motion.a}>
    <span class="rqn">با همین نام: <bdi dir="auto">${q.trim()}</bdi></span>

function Filtered({clear}){
  const reduced=useReducedMotion();
  return html`<${motion.div} class="emp" initial=${reduced?{opacity:0}:{opacity:0,y:8,filter:"blur(6px)"}} animate=${{opacity:1,y:0,filter:"blur(0px)",transitionEnd:{filter:"none"}}} transition=${{duration:.5,ease:EASE}}>

function urlOf(q,f){
  const p=[];if(q.trim())p.push("q="+encodeURIComponent(q.trim()));
  if(f.genres.length)p.push("genre="+f.genres.join(","));
  if(yrOn(f))p.push("year="+f.yr[0]+"-"+f.yr[1]);
  if(f.countries.length)p.push("country="+f.countries.join(","));
  if(f.imdb)p.push("imdb="+f.imdb);
  if(f.dub!=="any")p.push("dub="+f.dub);
  if(f.sub!=="any")p.push("sub="+f.sub);
  return "/search"+(p.length?"?"+p.join("&"):"");
}
function SearchReview(){
  const nav=p=>{const u=new URL(location.href);Object.entries(p).forEach(([k,v])=>v==null?u.searchParams.delete(k):u.searchParams.set(k,v));location.href=u};
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی). کادر جستجو زنده است: intersteller، shahrzad، tt0816692، جدایی یا dune را بنویسید.</span>

    <a class="syslink" href="../system/rollvana-design-system.html#search">سیستم طراحی، بخش جستجو ←</a>
  </section>`;
}
const vanish=r=>r?{opacity:0,transition:{duration:.1}}:{opacity:0,filter:"blur(4px)",transition:{duration:.16,ease:EASE_LEAVE}};
function App(){

  const [f,setF]=useState(P0.f);const [sheet,setSheet]=useState(P0.sheet);const [draft,setDraft]=useState(P0.draft);
  const [live,setLive]=useState(false);
  const inRef=useRef();const fbRef=useRef();const tm=useRef([]);
  useEffect(()=>{if(!P0.sheet&&inRef.current){inRef.current.focus({preventScroll:true});const n=inRef.current.value.length;try{inRef.current.setSelectionRange(n,n)}catch(e){}}},[]);
  const stop=()=>{tm.current.forEach(clearTimeout);tm.current=[]};
  const onInput=v=>{
    setQ(v);stop();setLive(true);
    if(chars(v)<2&&!isId(v)){setBusy(false);setShown(v);return}
    setBusy(true);
    tm.current.push(setTimeout(()=>{tm.current.push(setTimeout(()=>{setShown(v);setBusy(false)},320))},250));
  };
  const clear=()=>{stop();setQ("");setShown("");setBusy(false);setF(blank());inRef.current&&inRef.current.focus()};
  const res=useMemo(()=>run(shown),[shown]);
  const pool=res.kind==="list"?res.items:[];
  const list=pool.filter(t=>match(t,f));
  const hasList=res.kind==="list";
  const skel=busy&&!hasList;
  useEffect(()=>{const a=document.getElementById("addr");if(a)a.textContent=urlOf(q,f)},[q,f]);
  const nf=nOn(f);
  const openSheet=()=>{setDraft({...f,yr:f.yr.slice()});setSheet(true)};
  const view=skel?"skel":res.kind==="list"?(list.length?"list":"filtered"):res.kind;
  const hint=chars(q)===1&&!isId(q)?"از حرف دوم، نتیجه‌ها می‌آیند":"نام فارسی، انگلیسی یا فینگلیش، یا شناسه‌ی IMDb";
  const live1=busy?"در حال جستجو":view==="list"?grp(list.length)+" نتیجه":view==="none"||view==="idnone"?"بدون نتیجه":view==="id"?"یک عنوان پیدا شد؛ در حال باز کردن":view==="filtered"?"هیچ نتیجه‌ای با این فیلترها":"";
  const fill=["cuts","none","idnone","id"].includes(view);
  return html`<${React.Fragment}>
    <${Header} user=${false} desk=${desk}/>
    <main class="srch" id="srch">
      <h1 class="sr-only">جستجو</h1>
      <${Field} q=${q} onInput=${onInput} busy=${busy} inRef=${inRef} clear=${clear}/>
      <${AnimatePresence} initial=${false} mode="popLayout">
        ${view==="cuts"&&html`<${motion.p} key="h" id="sf-h" class="sf-h" exit=${vanish(reduced)}><${Words} text=${hint} k=${hint} reduced=${reduced}/></${motion.p}>`}
        ${(view==="list"||view==="filtered"||(busy&&hasList))&&html`<${motion.div} key="bar" exit=${vanish(reduced)} initial=${reduced?{opacity:0}:{opacity:0,y:6,filter:"blur(3px)"}} animate=${{opacity:1,y:0,filter:"blur(0px)",transitionEnd:{filter:"none"}}} transition=${{duration:reduced?.15:.36,ease:EASE}}>
          <div class="srb">
            <p class="am" id="sf-h"><span><b><${Count} v=${list.length} fmt=${grp}/></b> نتیجه برای <span class="qq">«<${AnimatePresence} mode="popLayout" initial=${false}><${motion.bdi} key=${shown.trim()} class="q" title=${shown.trim()} initial=${reduced?{opacity:0}:{opacity:0,filter:"blur(4px)"}} animate=${{opacity:1,filter:"blur(0px)",transitionEnd:{filter:"none"}}} exit=${reduced?{opacity:0,transition:{duration:.1}}:{opacity:0,filter:"blur(4px)",transition:{duration:.16,ease:EASE_LEAVE}}} transition=${{duration:reduced?.15:.3,ease:EASE}}>${shown.trim()}</${motion.bdi}></${AnimatePresence}>»</span></span>${nf>0&&html`<span class="of">از <${Count} v=${pool.length} fmt=${grp}/></span>`}</p>
            <${motion.button} type="button" class="tb" ref=${fbRef} aria-haspopup="dialog" aria-expanded=${sheet} onClick=${openSheet} whileTap=${PRESS}>
              <${I} n="sliders"/>جستجوی پیشرفته${nf>0&&html`<span class="n num" aria-label=${fa(nf)+" فیلتر فعال"}><${AnimChars} text=${fa(nf)}/></span>`}
            </${motion.button}>
          </div>
          ${res.why&&html`<p class="sr-why"><${I} n="info"/><span>${res.why[0]==="typo"?"نتیجه‌ها برای نزدیک‌ترین املا: ":"فینگلیش، به فارسی: "}<bdi dir="auto">${res.why[1]}</bdi></span></p>`}
          <${Applied} f=${f} setF=${setF} clear=${()=>setF(blank())}/>
        </${motion.div}>`}
        ${skel&&html`<${motion.p} key="hs" id="sf-h" class="sf-h" exit=${{opacity:0,transition:{duration:.08}}}><span class="sk" style=${{display:"inline-block",width:170,height:14,verticalAlign:"middle"}}></span></${motion.p}>`}
      </${AnimatePresence}>
      <p class="sr-only" role="status" aria-live="polite">${live1}</p>

            <${AnimatePresence} mode="popLayout" initial=${false}>${list.map((t,i)=>html`<${SItem} key=${t.en} t=${t} i=${i}/>`)}</${AnimatePresence}>

          ${view==="id"&&html`<${motion.div} key="id" style=${{display:"flex",flex:1,margin:"0 calc(-1 * var(--pad))"}} exit=${vanish(reduced)}><${Go} t=${res.t} live=${live}/></${motion.div}>`}
        </${AnimatePresence}>

    </main>

    <${FilterSheet} open=${sheet} close=${()=>setSheet(false)} draft=${draft} setDraft=${setDraft} desk=${desk} pool=${pool}
      apply=${()=>{setF(draft);setSheet(false)}} back=${()=>fbRef.current&&fbRef.current.focus({preventScroll:true})}/>
    ${!desk&&html`<${Tabs}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
