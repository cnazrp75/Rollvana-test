if(s==='empty'||s==='one')return cutsHTML();
if(s==='loading')return skel();
if(s==='idok'){const t=S.r.list[0].t;return '<a class="go" href="'+href(t)+'"><div class="po">'+(t.img?'<img src="'+t.img+'" alt="">':'')+'</div><small>در حال باز کردن صفحهٔ '+(t.k==='series'?'سریال':'فیلم')+'</small><h2>'+esc(t.fa)+'</h2><p class="en" dir="ltr">'+esc(t.en)+'</p><p class="my">'+kd(t)+'<span class="num">'+years(t)+'</span></p><div class="bar" role="progressbar" aria-label="در حال باز کردن"><i></i></div><span class="lk">اگر باز نشد، این‌جا را بزنید</span></a>'}
if(s==='idnone')return '<div class="emp"><div class="ei">'+ic('search')+'</div><h2>عنوانی با شناسهٔ <bdi dir="ltr">'+esc(qtext())+'</bdi> نداریم</h2><p>شناسه را دوباره ببینید: بعد از tt هفت یا هشت رقم می‌آید. اگر درست است، درخواستش را ثبت کنید.</p>'+reqBtn()+'</div>';
if(s==='none')return '<div class="emp"><div class="ei">'+ic('search')+'</div><h2><q><bdi>'+esc(qtext())+'</bdi></q> را پیدا نکردیم</h2><p>املای دیگری را امتحان کنید یا نام انگلیسی‌اش را بنویسید. اگر این عنوان را می‌خواهید، درخواستش را ثبت کنید.</p>'+reqBtn()+'</div>';
if(s==='fnone')return '<div class="emp"><div class="ei">'+ic('sliders-horizontal')+'</div><h2>با این فیلترها نتیجه‌ای نماند</h2><p>یکی از فیلترهای بالا را بردارید یا همه را با هم پاک کنید.</p><button class="cta" type="button" data-act="clear">پاک کردن فیلترها</button></div>';
return '<div class="list">'+shown().map(row).join('')+'</div>';
}

const nf=()=>S.f.genres.length+S.f.countries.length+(S.f.imdb?1:0)+(S.f.dub!=='any')+(S.f.sub!=='any')+((S.f.yr[0]!==YR[0]||S.f.yr[1]!==YR[1])?1:0);
const advHTML=()=>'<button class="tbtn" type="button" data-act="sheet" aria-haspopup="dialog" id="fbtn">'+ic('sliders-horizontal')+'جستجوی پیشرفته'+(nf()?'<span class="cnt num" aria-label="'+fa(nf())+' فیلتر فعال">'+fa(nf())+'</span>':'')+'</button>';

function yrLabel(f){const[a,b]=f.yr,[m,Mx]=YR;if(a!==m&&b!==Mx)return fa(a)+' تا '+fa(b);if(a!==m)return 'از '+fa(a);return 'تا '+fa(b)}
function appliedHTML(){
const f=S.f;if(!filtered(f))return '';
const c=[];
f.genres.forEach(k=>c.push(['genre',k,GEN[k]]));
if(f.yr[0]!==YR[0]||f.yr[1]!==YR[1])c.push(['yr','',yrLabel(f)]);
f.countries.forEach(k=>c.push(['country',k,COU[k]]));
if(f.imdb)c.push(['imdb','','<span class="sx">IMDb '+f.imdb+'+</span>']);
if(f.dub!=='any')c.push(['dub','',f.dub==='yes'?'دوبله فارسی':'بدون دوبله فارسی']);
if(f.sub!=='any')c.push(['sub','',f.sub==='yes'?'زیرنویس فارسی':'بدون زیرنویس فارسی']);
return c.map(x=>'<button class="ac" type="button" data-act="rm" data-k="'+x[0]+'" data-v="'+x[1]+'" aria-label="برداشتن فیلتر: '+x[2].replace(/<[^>]+>/g,'')+'">'+x[2]+'<span class="x">'+ic('x')+'</span></button>').join('')+'<button class="clr" type="button" data-act="clear">پاک کردن همه</button>';
}

const STATES=[['empty','خالی، میان‌بُرها'],['one','یک حرف'],['loading','در حال جستجو'],['fa','جستجوی فارسی'],['typo','غلط املایی'],['fg','فینگلیش'],['orig','نام اصلی'],['mixed','فیلم و سریال'],['adv','جستجوی پیشرفته باز'],['applied','فیلترهای اعمال‌شده'],['none','بدون نتیجه'],['idok','شناسهٔ IMDb پیدا شد'],['idnone','شناسهٔ IMDb پیدا نشد'],['long','نام و جستجوی بلند']];
const PRE={empty:'',one:'ت',loading:'میان‌ستاره',fa:'تلماسه',typo:'intersteller',fg:'shahrzad',orig:'La casa de papel',mixed:'جدایی',adv:'تلماسه',applied:'تلماسه',none:'بروتالیست',idok:'tt0816692',idnone:'tt9999999',long:'بورات: آموزش‌های فرهنگی آمریکا برای سود رساندن به ملت باشکوه قزاقستان'};
let cur=q0.get('s')||'empty';
const reviewHTML=()=>'<section class="rvp" aria-labelledby="rvh"><h2 id="rvh">حالت‌های بازبینی</h2><p>این بخش فقط برای بازبینی طرح است و در سایت نیست. در کادر جستجو هم می‌توانید بنویسید: intersteller، shahrzad، tt0816692، جدایی، dune.</p><div class="rw" role="group" aria-label="حالت">'+STATES.map(s=>'<button class="chip" type="button" data-act="state" data-v="'+s[0]+'" aria-pressed="'+(cur===s[0])+'">'+s[1]+'</button>').join('')+'</div></section>';

function headerHTML(){
return '<header class="hdr"><div class="hdr-bg"></div><a class="wm" href="/" aria-label="Rollvana"><svg viewBox="-40 -820 3689 870" aria-hidden="true"><path fill="currentColor" d="'+WM+'"/><circle cx="867" cy="-230" r="190" fill="none" stroke="currentColor" stroke-width="100"/><circle cx="912" cy="-275" r="50" fill="var(--light)"/></svg></a>'+
'<nav class="nav" aria-label="ناوبری اصلی"><a href="/">خانه</a><a href="/films">فیلم‌ها</a><a href="/series">سریال‌ها</a><a href="#">منو</a></nav>'+
'<div class="acts"><a class="sub" href="/subscribe">خرید اشتراک</a><a class="login" href="/login">ورود</a></div></header>'+
'<nav class="tabs" aria-label="ناوبری اصلی"><a class="tab" href="/">'+ic('home')+'<span class="tl">خانه</span></a><a class="tab" href="/films">'+ic('film')+'<span class="tl">فیلم‌ها</span></a><a class="tab" href="/series">'+ic('tv')+'<span class="tl">سریال‌ها</span></a><a class="tab" href="/search" aria-current="page">'+ic('search')+'<span class="tl">جستجو</span></a><a class="tab" href="#">'+ic('menu')+'<span class="tl">منو</span></a></nav>';
}

const $=s=>document.querySelector(s);
function renderAll(){
$('#app').innerHTML=headerHTML()+'<main class="page" id="page"><h1 class="vh">جستجو</h1><div class="sr"><div class="sr-top"><form class="sf" role="search" id="sf" data-busy="false" action="/search"><label class="vh" for="qi">جستجوی فیلم و سریال</label><span class="sf-ic" aria-hidden="true">'+ic('search')+'<span class="sf-sp"></span></span><input id="qi" name="q" type="search" dir="auto" maxlength="100" autocomplete="off" enterkeyhint="search" placeholder="نام فیلم، سریال یا شناسهٔ IMDb" value="'+esc(S.q)+'" aria-describedby="sm"><button class="sf-x" type="button" data-act="x" aria-label="پاک کردن جستجو"'+(S.q?'':' hidden')+'>'+ic('x')+'</button></form></div><div class="sr-bar"><p class="sr-m" id="sm">'+metaHTML()+'</p>'+advHTML()+'</div><div class="ap" id="ap">'+appliedHTML()+'</div><div class="res sr-hold" id="res" aria-busy="'+S.loading+'"><div class="sr-hold">'+bodyHTML()+'</div></div><div id="rv">'+reviewHTML()+'</div></div></main><div id="ov"></div><div class="vh" aria-live="polite" id="live"></div>';
$('#ap').hidden=!filtered(S.f);
const i=$('#qi');i.focus({preventScroll:true});const n=i.value.length;i.setSelectionRange(n,n);
if(S.sheet)openSheet(false);
}

function tween(el,from,to){
if(!el)return;
if(RM.matches||from===to){el.textContent=grp(to);return}
const t0=performance.now(),d=320;
cancelAnimationFrame(el._r);
const st=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=grp(from+(to-from)*e);if(k<1)el._r=requestAnimationFrame(st)};
el._r=requestAnimationFrame(st);
}

let lastStage=null;
function update(){
const old=$('#cnt'),from=old?+old.dataset.v:0;
$('#sm').innerHTML=metaHTML();
const nc=$('#cnt');if(nc&&old)tween(nc,from,+nc.dataset.v);
$('#fbtn').outerHTML=advHTML();
$('#ap').innerHTML=appliedHTML();$('#ap').hidden=!filtered(S.f);
$('#sf').dataset.busy=S.busy;
const res=$('#res');res.setAttribute('aria-busy',S.loading);
const st=stage(),html=bodyHTML();
if(st==='empty'||st==='one'){if(lastStage!=='empty'&&lastStage!=='one')swap(html)}else swap(html);
lastStage=st;
const s=stage();
$('#live').textContent=s==='list'?grp(shown().length)+' نتیجه':s==='none'||s==='idnone'||s==='fnone'?'بدون نتیجه':s==='idok'?'یک عنوان پیدا شد':'';
$('#rv').innerHTML=reviewHTML();
}

function swap(html){
const res=$('#res');
res.querySelectorAll('.ghost').forEach(g=>g.remove());
const old=res.firstElementChild;
const nw=document.createElement('div');nw.className='sr-hold';nw.innerHTML=html;
if(old&&!RM.matches){old.classList.remove('fresh');old.classList.add('ghost');setTimeout(()=>old.remove(),340);nw.classList.add('fresh')}else if(old)old.remove();
res.appendChild(nw);
}

let deb=null,net=null;
function onType(v){
S.q=v;cur='';
const x=$('.sf-x');x.hidden=!v;
clearTimeout(deb);clearTimeout(net);
if(N(v).length<2){S.loading=false;S.busy=false;S.r={list:[]};update();return}
const had=S.r.list.length>0&&!S.r.id&&!S.loading;
if(had){S.busy=true;$('#sf').dataset.busy=true}else if(!S.loading){S.loading=true;S.busy=true;update()}
deb=setTimeout(()=>{net=setTimeout(()=>{S.r=find(S.q);S.loading=false;S.busy=false;update()},360)},250);
}

function sheetBody(){
const f=D;
const tg=(act,keys,lab,sel)=>'<div class="tg">'+keys.map(x=>'<button class="chip" type="button" data-act="'+act+'" data-v="'+x+'" aria-pressed="'+sel.includes(x)+'">'+ic('check')+lab[x]+'</button>').join('')+'</div>';
const s3=(act,opts,val,lab)=>'<div class="s3" role="radiogroup" aria-label="'+lab+'">'+opts.map(o=>'<button type="button" role="radio" data-act="'+act+'" data-v="'+o[0]+'" aria-checked="'+(String(val)===String(o[0]))+'">'+o[1]+'</button>').join('')+'</div>';
return '<fieldset class="fs"><legend>ژانر<small id="gsel">'+(f.genres.length?fa(f.genres.length)+' انتخاب':'')+'</small></legend><div class="cl"></div>'+tg('dg',Object.keys(GEN),GEN,f.genres)+'</fieldset>'+
'<div class="fs" role="group" aria-labelledby="yl"><div class="lg"><span id="yl">سال ساخت یا شروع پخش</span><small id="yv">'+(f.yr[0]===YR[0]&&f.yr[1]===YR[1]?'همهٔ سال‌ها':yrLabel(f))+'</small></div><div class="cl"></div><div class="rng"><span class="tr"></span><span class="fl" id="yfl"></span><input type="range" dir="rtl" id="y0" min="'+YR[0]+'" max="'+YR[1]+'" step="1" value="'+f.yr[0]+'" aria-label="از سال" aria-valuetext="'+fa(f.yr[0])+'"><input type="range" dir="rtl" id="y1" min="'+YR[0]+'" max="'+YR[1]+'" step="1" value="'+f.yr[1]+'" aria-label="تا سال" aria-valuetext="'+fa(f.yr[1])+'"></div><div class="rv2 num"><span>'+fa(YR[0])+'</span><span>'+fa(YR[1])+'</span></div></div>'+
'<fieldset class="fs"><legend>کشور سازنده<small id="csel">'+(f.countries.length?fa(f.countries.length)+' انتخاب':'')+'</small></legend><div class="cl"></div>'+tg('dc',Object.keys(COU),COU,f.countries)+'</fieldset>'+
'<div class="fs" role="group" aria-labelledby="il"><div class="lg"><span id="il">حداقل امتیاز IMDb</span></div><div class="cl"></div>'+s3('di',IMDB.map(v=>[v,v?'<span class="sx">'+v+'+</span>':'همه']),f.imdb,'حداقل امتیاز IMDb')+'</div>'+
'<div class="fs" role="group" aria-labelledby="ll"><div class="lg"><span id="ll">زبان فارسی</span></div><div class="cl"></div><p class="fq">دوبله فارسی</p>'+s3('dd',TRI,f.dub,'دوبله فارسی')+'<p class="fq">زیرنویس فارسی</p>'+s3('ds',TRI,f.sub,'زیرنویس فارسی')+'</div>';
}
const sheetHTML=()=>'<div class="scrim" data-act="close"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="shh"><div class="grab" aria-hidden="true"><i></i></div><div class="shh"><h2 id="shh">جستجوی پیشرفته</h2><button class="clr" type="button" data-act="dclear" id="dclr">پاک کردن همه</button><button class="icb" type="button" data-act="close" aria-label="بستن">'+ic('x')+'</button></div><div class="shb" id="shb">'+sheetBody()+'</div><div class="shf"><button class="cta" type="button" data-act="apply" id="apply"></button></div></aside>';
let lastCta=null;
function ctaUpdate(){
const b=$('#apply');if(!b)return;
const n=shown(D).length;
$('#dclr').hidden=!filtered(D);
if(!n){b.disabled=true;b.innerHTML='هیچ نتیجه‌ای با این فیلترها نیست';lastCta=0;$('#live').textContent='بدون نتیجه';return}
b.disabled=false;
if(!b.querySelector('.num')){b.innerHTML='نمایش <span class="num" data-v="'+n+'">'+grp(n)+'</span> نتیجه';tween(b.querySelector('.num'),lastCta??n,n)}
else{const s=b.querySelector('.num');tween(s,+s.dataset.v,n);s.dataset.v=n}
lastCta=n;
$('#live').textContent=grp(n)+' نتیجه';
}
function yrUpdate(){
const a=$('#y0'),b=$('#y1');if(!a)return;
let lo=+a.value,hi=+b.value;
if(lo>hi){if(document.activeElement===a){lo=hi;a.value=lo}else{hi=lo;b.value=hi}}
D.yr=[lo,hi];
const[m,Mx]=YR,sp=Mx-m;
const fl=$('#yfl');fl.style.right=((lo-m)/sp*100)+'%';fl.style.left=((Mx-hi)/sp*100)+'%';
a.setAttribute('aria-valuetext',fa(lo));b.setAttribute('aria-valuetext',fa(hi));
$('#yv').textContent=lo===m&&hi===Mx?'همهٔ سال‌ها':yrLabel(D);
}
function openSheet(fresh){
if(fresh!==false)D=JSON.parse(JSON.stringify(S.f));
S.sheet=true;lastCta=null;
$('#ov').innerHTML=sheetHTML();
document.documentElement.style.overflow='hidden';
yrUpdate();ctaUpdate();
setTimeout(()=>{const c=document.querySelector('.sheet .icb');c&&c.focus({preventScroll:true})},30);
}
function closeSheet(){
const sh=$('.sheet'),sc=$('.scrim');if(!sh)return;
S.sheet=false;
const done=()=>{$('#ov').innerHTML='';document.documentElement.style.overflow='';const fb=$('#fbtn');fb&&fb.focus({preventScroll:true})};
if(RM.matches)return done();
sh.classList.add('closing');sc.classList.add('closing');setTimeout(done,250);
}

function preset(s){
cur=s;S.sheet=false;S.loading=false;S.busy=false;S.f=blank();
S.q=PRE[s]??'';
S.r=N(S.q).length>=2?find(S.q):{list:[]};
if(s==='loading'){S.loading=true;S.busy=true}
if(s==='adv'){S.sheet=true;D=Object.assign(blank(),{imdb:8,dub:'yes'})}
if(s==='applied')Object.assign(S.f,{imdb:8,dub:'yes'});
lastStage=stage();
}

document.addEventListener('click',e=>{
const a0=e.target.closest('a[href]');if(a0&&!a0.closest('[data-act]'))e.preventDefault();
const t=e.target.closest('[data-act]');
if(!t)return;
const a=t.dataset.act,v=t.dataset.v;
if(t.tagName==='A')e.preventDefault();
if(a==='state'){preset(v);renderAll();window.scrollTo({top:0});return}
if(a==='x'){const i=$('#qi');i.value='';onType('');i.focus();return}
if(a==='rm'){t.classList.add('out');setTimeout(()=>{const f=S.f;if(t.dataset.k==='genre')f.genres=f.genres.filter(c=>c!==t.dataset.v);if(t.dataset.k==='yr')f.yr=YR.slice();if(t.dataset.k==='country')f.countries=f.countries.filter(c=>c!==t.dataset.v);if(t.dataset.k==='imdb')f.imdb=0;if(t.dataset.k==='dub')f.dub='any';if(t.dataset.k==='sub')f.sub='any';update()},RM.matches?0:160);return}
if(a==='clear'){S.f=blank();update();return}
if(a==='sheet'){openSheet();return}
if(a==='close'){closeSheet();return}
if(a==='apply'){S.f=JSON.parse(JSON.stringify(D));cur='';closeSheet();update();return}
if(a==='dclear'){D=blank();const b=$('#shb'),st=b.scrollTop;b.innerHTML=sheetBody();b.scrollTop=st;yrUpdate();ctaUpdate();return}
if(a==='dg'||a==='dc'){const key=a==='dg'?'genres':'countries';D[key]=D[key].includes(v)?D[key].filter(x=>x!==v):[...D[key],v];t.setAttribute('aria-pressed',D[key].includes(v));$(a==='dg'?'#gsel':'#csel').textContent=D[key].length?fa(D[key].length)+' انتخاب':'';ctaUpdate();return}
if(a==='di'||a==='dd'||a==='ds'){if(a==='di')D.imdb=+v;if(a==='dd')D.dub=v;if(a==='ds')D.sub=v;t.parentNode.querySelectorAll('[role=radio]').forEach(b=>b.setAttribute('aria-checked',b===t));ctaUpdate();return}
});
document.addEventListener('submit',e=>{e.preventDefault()});
document.addEventListener('input',e=>{if(e.target.id==='qi')onType(e.target.value);if(e.target.id==='y0'||e.target.id==='y1'){yrUpdate();ctaUpdate()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});

preset(cur);
renderAll();
</script>
</body>
</html>
