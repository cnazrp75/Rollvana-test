      initial=${reduced?{opacity:0}:{opacity:0,y:16,scale:.95}} animate=${{opacity:1,y:0,scale:1}}
      exit=${reduced?{opacity:0,transition:{duration:.1}}:{opacity:0,y:8,scale:.92,transition:{duration:.18,ease:EASE_IN}}}
      transition=${reduced?{duration:.15}:{type:"spring",stiffness:500,damping:30}}>
    ${t.err&&html`<span class="tu-g"><${I} n="warn"/></span>`}
    ${t.undo&&html`<${Ring} run=${!hov&&!t.hold} dur=${5} onDone=${close}/>`}
    <span class="tu-t">${t.t}</span>
    ${t.a&&html`<${motion.button} type="button" class="tu-a" onClick=${t.a[1]} whileTap=${PRESS}>${t.a[0]}</${motion.button}>`}
  </${motion.div}>`}</${AnimatePresence}>`;
}
function Guest({reduced}){
  return html`<div class="go lg-go acgo" role="status">
    <span class="go-p lg-hm"><${I} n="lock"/></span>
    <span class="go-k">لیست تماشا و تاریخچه مال حساب شماست</span>
    <h2>اول وارد شوید</h2>
    <span class="go-k">پس از ورود، به همین صفحه برمی‌گردید.</span>
    <span class="go-t" aria-hidden="true"><${Fill} run=${true} dur=${900} reduced=${reduced} k="g" cls="go-f"/></span>
    <a class="go-l" href=${LOGIN}>اگر صفحه‌ی ورود باز نشد، اینجا را بزنید</a>
  </div>`;
}
function HomeCard({t,on,pop,onToggle,reduced}){
  return html`<${motion.div} class="wlc" initial="r" animate="r" whileHover="h">
    <${motion.a} href=${TH[t.k]} class="card" title=${t.en} whileTap=${{scale:.97}}>
      <${motion.div} class="pw" variants=${{r:{y:0},h:{y:reduced?0:-6}}} transition=${SPR}>
        <div class="po"><${motion.div} style=${{width:"100%",height:"100%"}} variants=${{r:{scale:1},h:{scale:reduced?1:1.04}}} transition=${{duration:.6,ease:EASE}}><${Img} src=${t.img}/></${motion.div}>
          <span class="ctr"><span class="bdg cbdg">${t.b}</span></span><span class="ctl"><span class="cscore">${Score({v:t.imdb})}</span></span>
          <div class="ov"><div class="ct" dir="ltr">${t.en}</div><div class="cg"><span class="cy num">${fa(t.k==="film"?t.n:t.y)}</span><span class="cgg">${t.g}</span></div></div>
        </div>
      </${motion.div}>
    </${motion.a}>
    <${WlBtn} on=${on} t=${t} pop=${pop} onToggle=${onToggle} reduced=${reduced}/>
  </${motion.div}>`;
}
function CardRow({title,items,st,toggle,reduced}){
  return html`<section class="row"><div class="rh"><h2><span>${title}</span></h2><a href="../catalog/rollvana-archive.html" class="more">مشاهده‌ی بیشتر<${I} n="left"/></a></div>
    <div class="sc">${items.map(t=>html`<${HomeCard} key=${t.id} t=${t} on=${st.cl.includes(t.id)} pop=${st.pop[t.id]||0} onToggle=${()=>toggle(t)} reduced=${reduced}/>`)}</div>
  </section>`;
}
function LibReview({s,fail}){
  const nav=p=>{const u=new URL(location.href);Object.entries(p).forEach(([k,v])=>v==null?u.searchParams.delete(k):u.searchParams.set(k,v));location.href=u};
  const B=(on,l,f,k)=>html`<${motion.button} key=${k} whileTap=${{scale:.95}} aria-pressed=${on} onClick=${f}>${l}</${motion.button}>`;
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی، در سایت نیست). صفحه زنده است: فیلتر، برداشتن از لیست، حذف از تاریخچه با بازگرداندن، «نمایش بیشتر» و دکمه‌ی + روی کارت‌ها کار می‌کنند. اعلانِ حالت‌های آماده تا اولین لمس صفحه می‌ماند. تصویرها نمونه‌اند.</span>
    <div class="grp"><span>کتابخانه</span><div>${STATES.map(([k,l])=>B(s===k,l,()=>nav({s:k,tab:null}),k))}</div></div>
    <div class="grp"><span>دکمه‌ی + روی کارت (نمونه‌ی ردیف صفحه‌ی اصلی؛ روی کارت‌های آرشیو و جستجو همین است)</span><div>${CSTATES.map(([k,l])=>B(s===k,l,()=>nav({s:k,tab:null}),k))}</div></div>
    <div class="grp"><span>ذخیره روی سرور</span><div>${[[false,"موفق"],[true,"ناموفق (تلاش دوباره موفق است)"]].map(([v,l])=>B(fail===v,l,()=>nav({fail:v?"1":null}),String(v)))}</div></div>
    <div class="grp"><span>نشانی‌ها</span><code dir="ltr">/library</code><code dir="ltr">/library?tab=history</code><code dir="ltr">guest → /login?next=/library</code><code dir="ltr">guest + → /login?next=/&add=inception</code></div>
    <a class="syslink" href="../system/rollvana-design-system.html#library">سیستم طراحی، بخش کتابخانه ←</a>
  </section>`;
}
function App(){
  const desk=useDesk();const reduced=useReducedMotion();
  const [tab,setTab0]=useState(P0.tab);
  const [wl,setWl]=useState(P0.wl);const [hi,setHi]=useState(P0.hi);const [f,setF0]=useState(P0.f);
  const [shW,setShW]=useState(24);const [shH,setShH]=useState(30);
  const [toast,setToast]=useState(null);const [say,setSay]=useState("");
  const [cs,setCs]=useState(()=>({cl:P0.user?WL0.map(t=>t.id).filter(id=>CALL.some(c=>c.id===id)):[],pop:{}}));
  const fail=useRef(FAIL0);const tm=useRef([]);const later=(fn,ms)=>tm.current.push(setTimeout(fn,ms));
  useEffect(()=>()=>tm.current.forEach(clearTimeout),[]);
  useEffect(()=>{const u=()=>setToast(t=>t&&t.hold?{...t,hold:false}:t);addEventListener("pointerdown",u,{once:true});addEventListener("keydown",u,{once:true});return()=>{removeEventListener("pointerdown",u);removeEventListener("keydown",u)}},[]);
  const setTab=k=>{setTab0(k);const u=new URL(location.href);if(k==="hi")u.searchParams.set("tab","hi");else u.searchParams.delete("tab");history.replaceState(null,"",u)};
  const setF=k=>{setF0(k);setShW(24)};
  const close=()=>setToast(null);
  const rmW=(t,hold)=>{
    let idx=-1;setWl(o=>{idx=o.findIndex(x=>x.id===t.id);return o.filter(x=>x.id!==t.id)});
    setSay("«"+t.fa+"» از لیست تماشا برداشته شد");
    setToast({k:"w"+t.id+Date.now(),t:"«"+t.fa+"» از لیست برداشته شد",undo:true,hold,a:["بازگرداندن",()=>{setWl(o=>{const n=o.slice();n.splice(Math.max(0,idx),0,t);return n});setToast(null);setSay("«"+t.fa+"» به لیست برگشت")}]});
  };
  const rmH=(h,hold)=>{
    let idx=-1,next=null;setHi(o=>{idx=o.findIndex(x=>x.id===h.id);next=o[idx+1]||o[idx-1]||null;return o.filter(x=>x.id!==h.id)});
    setSay("«"+nameOf(h)+"» از تاریخچه حذف شد");
    if(!hold)requestAnimationFrame(()=>requestAnimationFrame(()=>{const el=next&&document.getElementById("hx-"+next.id);el&&el.focus({preventScroll:true})}));
    setToast({k:"h"+h.id+Date.now(),t:"«"+nameOf(h)+"» از تاریخچه حذف شد",undo:true,hold,a:["بازگرداندن",()=>{setHi(o=>{const n=o.slice();n.splice(Math.max(0,idx),0,h);return n});setToast(null);setSay("«"+nameOf(h)+"» به تاریخچه برگشت")}]});
  };
  const goLib=()=>{location.href=LIBH};
  const toggle=(t,hold,force)=>{
    if(!P0.user){setSay("برای افزودن به لیست، اول وارد شوید");setToast({k:"g"+t.id,t:"برای نگه داشتن «"+t.fa+"» اول وارد شوید",hold,a:["ورود",()=>{location.href=LOGIN}]});if(!hold)later(()=>{location.href=LOGIN},1600);return}
    const was=cs.cl.includes(t.id);const on=!was;
    setCs(o=>({cl:on?[...o.cl,t.id]:o.cl.filter(x=>x!==t.id),pop:on?{...o.pop,[t.id]:(o.pop[t.id]||0)+1}:o.pop}));
    if(on){setToast({k:"a"+t.id+Date.now(),t:"«"+t.fa+"» به لیست اضافه شد",hold,a:["دیدن لیست",goLib]});setSay("«"+t.fa+"» به لیست تماشا اضافه شد")}
    else{setToast({k:"r"+t.id+Date.now(),t:"«"+t.fa+"» از لیست برداشته شد",undo:true,hold,a:["بازگرداندن",()=>{setToast(null);toggle(t,false,true)}]});setSay("«"+t.fa+"» از لیست تماشا برداشته شد")}
    if(fail.current&&!force)later(()=>{
      fail.current=false;
      setCs(o=>({...o,cl:was?[...o.cl.filter(x=>x!==t.id),t.id]:o.cl.filter(x=>x!==t.id)}));
      setSay("ذخیره نشد؛ «"+t.fa+"» "+(on?"به لیست اضافه نشد":"در لیست ماند"));
      setToast({k:"f"+t.id+Date.now(),err:true,hold,t:on?"«"+t.fa+"» به لیست اضافه نشد":"«"+t.fa+"» از لیست برداشته نشد",a:["دوباره",()=>{setToast(null);toggle(t,false,true)}]});
    },700);
  };
  useEffect(()=>{const a=P0.auto;if(!a)return;
    const x=setTimeout(()=>{
      if(a==="wlrm")rmW(WL0[2],true);
      if(a==="hirm")rmH(HI0[1],true);
      if(a==="add")toggle(CF[0],true);
      if(a==="rm")toggle(CF[2],true);
      if(a==="fail")toggle(CF[3],true);
      if(a==="gadd")toggle(CF[1],true);
      if(a==="back"){setCs(o=>({cl:[...o.cl,CF[0].id],pop:{...o.pop,[CF[0].id]:1}}));setToast({k:"back",t:"وارد شدید و «"+CF[0].fa+"» به لیست اضافه شد",hold:true,a:["دیدن لیست",goLib]});setSay("وارد شدید. «"+CF[0].fa+"» به لیست تماشا اضافه شد")}
    },500);return()=>clearTimeout(x)},[]);
  const bell=html`<${Bell} n=${3} reduced=${reduced}/>`;
  return html`<${React.Fragment}>
    <${Header} user=${P0.user} desk=${desk} bell=${bell}/>
    <main class=${"lib"+(P0.view==="cards"?" lbc":"")} id="page">
      <div class="lib-in">
      ${P0.view==="guest"?html`<div class="lg-in"><${Guest} reduced=${reduced}/></div>`
      :P0.view==="cards"?html`<${React.Fragment}>
        <${CardRow} title="تازه‌ترین فیلم‌ها" items=${CF} st=${cs} toggle=${t=>toggle(t,false)} reduced=${reduced}/>
        <${CardRow} title="سریال‌های این روزها" items=${CS} st=${cs} toggle=${t=>toggle(t,false)} reduced=${reduced}/>
      </${React.Fragment}>`
      :html`<${React.Fragment}>
        <header class="lbh"><h1>کتابخانه‌ی من</h1></header>
        <${LibTabs} tab=${tab} setTab=${setTab} nw=${wl.length} nh=${hi.length}/>
        <div class="lbp" id="lbp" role="tabpanel" aria-labelledby=${"tab-"+tab}>
          <${AnimatePresence} mode="popLayout" initial=${false}>
            <${motion.div} key=${tab} class="lbp" initial=${reduced?{opacity:0}:{opacity:0,y:8,filter:"blur(8px)"}} animate=${{opacity:1,y:0,filter:"blur(0px)",transitionEnd:{filter:"none"},transition:{duration:reduced?.15:.42,ease:EASE}}}
              exit=${reduced?{opacity:0,transition:{duration:.1}}:{opacity:0,y:-6,filter:"blur(8px)",transition:{duration:.18,ease:EASE_IN}}}>
              ${tab==="wl"?html`<${Watchlist} wl=${wl} f=${f} setF=${setF} shown=${shW} setShown=${setShW} onRm=${t=>rmW(t,false)} desk=${desk} reduced=${reduced}/>`
                :html`<${History} hi=${hi} shown=${shH} setShown=${setShH} onRm=${h=>rmH(h,false)} reduced=${reduced}/>`}
            </${motion.div}>
          </${AnimatePresence}>
        </div>
      </${React.Fragment}>`}
      </div>
    </main>
    <div class="lbv"><${LibReview} s=${S0} fail=${FAIL0}/></div>
    <p class="acsr" role="status" aria-live="polite">${say}</p>
    <${Toast} t=${toast} close=${close} reduced=${reduced}/>
    ${!desk&&html`<${Tabs}/>`}
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
