  return html`<div class="sbe"><${I} n="cal"/><span>
    <span class="sbe-u">اشتراک شما تا <b><${DateRoll} doy=${end} reduced=${reduced}/></b></span>
    <small>${active?html`<${Count} v=${plan.d} fmt=${fa}/> روز بعد از پایان اشتراک فعلی، <b>${jds(CUREND,false)}</b>، اضافه می‌شود.`:html`از امروز، <b>${jds(TODAY,false)}</b>، به مدت <${Count} v=${plan.d} fmt=${fa}/> روز.`}</small>
  </span></div>`;
}
function PayBtn({plan,total,act,reduced}){
  return html`<${motion.button} type="button" class="cta lg-cta" onClick=${act.pay} disabled=${!plan} whileTap=${plan&&!reduced?{scale:.97}:undefined}>
    <span class="lg-cl"><${Cross} k=${plan?"pay":"pick"} reduced=${reduced} dur=${.3}>${plan?html`<span>پرداخت <${Count} v=${total} fmt=${toman}/> تومان</span>`:html`<span>یک طرح را انتخاب کنید</span>`}</${Cross}></span>
  </${motion.button}>`;
}
function Card({st,act,plan,dv,total,end,ap,reduced}){
  if(st.guest)return html`<div class="sbs-c">
    <div class="sbs-k">خرید اشتراک</div>
    <div class="sbs-n">اول وارد شوید</div>
    <p class="sbs-g">هر طرحی را بزنید به صفحه‌ی ورود می‌روید و پس از ورود، با همان طرح به همین‌جا برمی‌گردید.</p>
    <${motion.a} class="cta lg-cta" href=${LOGIN} whileTap=${{scale:.97}}>ورود به حساب</${motion.a}>
  </div>`;
  if(!plan)return html`<div class="sbs-c">
    <div class="sbs-k">طرح انتخاب‌شده</div>
    <div class="sbs-n is-none">هنوز طرحی انتخاب نکرده‌اید</div>
    <p class="sbs-g">از فهرست طرح‌ها یکی را بزنید؛ قیمت، کد تخفیف و تاریخ پایان اشتراک همین‌جا می‌آید.</p>
    <${PayBtn} plan=${null} total=${0} act=${act} reduced=${reduced}/>
  </div>`;
  return html`<div class="sbs-c">
    <div class="sbs-k">طرح انتخاب‌شده</div>
    <div class="sbs-n"><${Words} text=${plan.n} k=${plan.id} reduced=${reduced} stagger=${.02}/></div>
    <${Code} c=${st.code} act=${act} reduced=${reduced}/>
    <${Lines} plan=${plan} dv=${dv} total=${total} ap=${ap} reduced=${reduced}/>
    <${EndDate} plan=${plan} end=${end} active=${st.sub==="active"} reduced=${reduced}/>
    <p class="sbs-g">پرداخت در درگاه بانکی انجام می‌شود و پس از آن به همین‌جا برمی‌گردید.</p>
    <${PayBtn} plan=${plan} total=${total} act=${act} reduced=${reduced}/>
  </div>`;
}
function GuestGo({plan,reduced}){
  return html`<div class="go lg-go acgo sbo" role="status">
    <span class="go-p lg-hm"><${I} n="lock"/></span>
    <span class="go-k">برای خرید، اول وارد شوید</span>
    <h2 id="h1" tabindex="-1">رفتن به صفحه‌ی ورود</h2>
    <span class="go-k">پس از ورود، با طرح <b>«${plan.n}»</b> به همین صفحه برمی‌گردید.</span>
    <span class="go-t" aria-hidden="true"><${Fill} run=${true} dur=${900} reduced=${reduced} k="g" cls="go-f"/></span>
    <a class="go-l" href=${LOGIN}>اگر صفحه‌ی ورود باز نشد، اینجا را بزنید</a>
  </div>`;
}
function Gateway({plan,total,reduced}){
  return html`<div class="go sbo" role="status">
    <span class="go-p lg-hm"><${I} n="lock"/></span>
    <span class="go-k">در حال رفتن به درگاه پرداخت</span>
    <h2 id="h1" tabindex="-1">${faN(total)} تومان</h2>
    <span class="go-k">اشتراک <b>${plan.n}</b>، ${fa(plan.d)} روز</span>
    <span class="go-t" aria-hidden="true"><${Fill} run=${true} dur=${1600} reduced=${reduced} k="p" cls="go-f"/></span>
    <a class="go-l" href="#">اگر درگاه باز نشد، اینجا را بزنید</a>
  </div>`;
}
const RK={ok:["پرداخت شد","اشتراک شما فعال است"],err:["ناموفق","پرداخت انجام نشد"],no:["لغو شد","پرداخت را لغو کردید"],wait:["در انتظار تأیید","پرداخت در حال تأیید است"]};
function Glyph({r,reduced}){
  const draw=(d,i=0)=>html`<${motion.path} class="ck" d=${d} initial=${reduced?false:{pathLength:0}} animate=${{pathLength:1}} transition=${{duration:.45,delay:.12+i*.12,ease:EASE}}/>`;
  if(r==="wait")return html`<${Spin} reduced=${reduced}/>`;
  return html`<svg viewBox="0 0 24 24" aria-hidden="true">${r==="ok"?draw("M5 12.5l4.6 4.6L19 7.6"):r==="err"?[draw("M7 7l10 10"),draw("M17 7L7 17",1)]:draw("M6.5 12h11")}</svg>`;
}
function Result({st,act,plan,total,end,reduced}){
  const r=st.res;
  return html`<div class="lg-in sbr" role="status" aria-live="polite">
    <${motion.div} class=${"sbr-g "+r} initial=${reduced?false:{scale:.84}} animate=${{scale:1}} transition=${{type:"spring",stiffness:300,damping:15}}>
      <${Cross} k=${r} reduced=${reduced} dur=${.32}><${Glyph} r=${r} reduced=${reduced}/></${Cross}>
    </${motion.div}>
    <span class=${"sbr-k "+r}><${Words} text=${RK[r][0]} k=${"k"+r} reduced=${reduced}/></span>
    <h1 id="h1" tabindex="-1"><${Words} text=${RK[r][1]} k=${"h"+r} reduced=${reduced}/></h1>
    <${Fade} k=${r} reduced=${reduced} delay=${.2} cls="sbr-b">
      ${r==="ok"&&html`<${React.Fragment}>
        <div class="sbr-u"><small>اشتراک فعال تا</small><b>${jds(end)}</b></div>
        <p class="sbr-x">از همین حالا همه‌ی فیلم‌ها و سریال‌ها را آنلاین ببینید یا دانلود کنید.</p>
        <div class="acl sbr-l">
          <div class="acy"><span class="acy-a"><b>طرح</b></span><span class="acy-b"><b>${plan.n}</b></span></div>
          <div class="acy"><span class="acy-a"><b>مبلغ پرداخت‌شده</b></span><span class="acy-b"><b>${faN(total)} <small>تومان</small></b></span></div>
          <div class="acy"><span class="acy-a"><b>کد پیگیری</b></span><span class="acy-b"><b><bdi>${fa("274910385")}</bdi></b></span></div>
        </div>
        <div class="sbr-a">
          <${motion.a} class="cta lg-cta" href=${FROM} whileTap=${{scale:.97}}>ادامه‌ی تماشای «تلماسه: بخش دوم»</${motion.a}>
          <${motion.a} class="acg" href="../home/home-v3.html" whileTap=${PRESS}>رفتن به صفحه‌ی اصلی</${motion.a}>
        </div>
      </${React.Fragment}>`}
      ${(r==="err"||r==="no")&&html`<${React.Fragment}>
        <p class="sbr-x">${r==="err"?"اشتراک شما تغییری نکرد.":"اشتراک شما تغییری نکرد. هر وقت خواستید، دوباره امتحان کنید."}</p>
        ${r==="err"&&html`<div class="sbr-m"><small>پیام درگاه پرداخت</small><q>موجودی حساب کافی نیست</q></div>`}
        <div class="acl sbr-l">
          <div class="acy"><span class="acy-a"><b>طرح</b></span><span class="acy-b"><b>${plan.n}</b></span></div>
          <div class="acy"><span class="acy-a"><b>مبلغ</b></span><span class="acy-b"><b>${faN(total)} <small>تومان</small></b></span></div>
        </div>
        <div class="sbr-a">
          <${motion.button} type="button" class="cta lg-cta" onClick=${act.retry} whileTap=${{scale:.97}}>تلاش دوباره</${motion.button}>
          <${motion.button} type="button" class="acg" onClick=${act.plans} whileTap=${PRESS}>برگشت به طرح‌ها</${motion.button}>
        </div>
      </${React.Fragment}>`}
      ${r==="wait"&&html`<p class="sbr-x">چند ثانیه صبر کنید؛ نتیجه همین‌جا می‌آید. لطفاً این صفحه را نبندید.</p>`}
    </${Fade}>
  </div>`;
}
function Review(){
  const nav=p=>{const u=new URL(location.href);Object.entries(p).forEach(([k,v])=>v==null?u.searchParams.delete(k):u.searchParams.set(k,v));location.href=u};
  return html`<section class="review" aria-label="حالت‌های طرح">
    <span>حالت‌های طرح (فقط برای بررسی، در سایت نیست). صفحه زنده است: طرح را بزنید، کد تخفیف بنویسید (PAYIZ30 درصدی، RV50K مبلغی، YALDA25 منقضی، NOROOZ20 غیرفعال، TELEGRAM40 ظرفیت تمام، هر کد دیگر ناشناخته) و پرداخت را بزنید. امروز ۲۲ آبان ۱۴۰۵ فرض شده؛ طرح‌ها، مبلغ‌ها و کدها نمونه‌اند.</span>
    <div class="grp"><span>حالت</span><div>${STATES.map(([k,l])=>html`<${motion.button} key=${k} whileTap=${{scale:.95}} aria-pressed=${S0===k} onClick=${()=>nav({s:k})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>نتیجه‌ی درگاه وقتی در صفحه‌ی زنده «پرداخت» را می‌زنید</span><div>${[["ok","موفق (پس از تأیید)"],["err","ناموفق (پس از تأیید)"],["no","لغو"]].map(([k,l])=>html`<${motion.button} key=${k} whileTap=${{scale:.95}} aria-pressed=${RQ===k} onClick=${()=>nav({r:k==="ok"?null:k})}>${l}</${motion.button}>`)}</div></div>
    <div class="grp"><span>نشانی‌ها</span><code dir="ltr">/subscribe</code><code dir="ltr">/subscribe?plan=m3</code><code dir="ltr">/subscribe/result?payment=…</code><code dir="ltr">${"guest → /login?next=/subscribe?plan=m3"}</code></div>
    <a class="syslink" href="../system/rollvana-design-system.html#subscription">سیستم طراحی، بخش خرید اشتراک ←</a>
  </section>`;
}
function App(){
  const desk=useDesk();const reduced=useReducedMotion();
  const [st,set]=useState(()=>preset(S0));
  const up=p=>set(o=>{const x=typeof p==="function"?p(o):p;return x===o?o:{...o,...x}});
  const tm=useRef([]);const later=(f,ms)=>tm.current.push(setTimeout(f,ms));
  useEffect(()=>()=>tm.current.forEach(clearTimeout),[]);
  const [say,setSay]=useState("");
  const first=useRef(true);
  useEffect(()=>{if(innerWidth<1024&&["activesum","codeempty","checking","pct","amt","unknown","expired","inactive","used"].includes(S0)){const c=document.querySelector(".sbs-c");c&&c.scrollIntoView({block:"center"})}},[]);
  useEffect(()=>{if(first.current){first.current=false;return}requestAnimationFrame(()=>{const h=document.getElementById("h1");h&&h.focus({preventScroll:true})})},[st.view]);
  useEffect(()=>{if(st.view==="result"&&st.res==="wait"){const t=setTimeout(()=>{up({res:RQ==="err"?"err":"ok"});setSay(RQ==="err"?"پرداخت انجام نشد":"پرداخت شد، اشتراک فعال است")},3200);return()=>clearTimeout(t)}},[st.view,st.res]);
  const list=SETS[st.set];const plan=list.find(p=>p.id===st.sel)||null;
  const ap=st.code.st==="ok"?st.code.ap:null;
  const dv=plan?disc(plan.p,ap):0;const total=plan?plan.p-dv:0;
  const end=plan?(st.sub==="active"?Math.max(TODAY,CUREND):TODAY)+plan.d:null;
  const top=()=>scrollTo({top:0,behavior:"auto"});
  const act={
    pick:(id,kb)=>{if(st.guest){if(kb)return;up({sel:id,view:"guestgo"});top();return}up({sel:id,back:false});setSay("طرح "+P[id][0]+" انتخاب شد")},
    openCode:()=>up(o=>({code:{...o.code,open:true,focus:true}})),
    type:v=>up(o=>({code:{...o.code,val:v.toUpperCase().replace(/\s/g,""),st:o.code.st==="busy"?"busy":"idle",err:null,focus:false}})),
    apply:()=>{const v=st.code.val;if(!v||st.code.st==="busy")return;up(o=>({code:{...o.code,st:"busy"}}));
      later(()=>{const c=CODES[v];if(c&&!c.e){up(o=>({code:{...o.code,st:"ok",ap:c}}));setSay("کد تخفیف اعمال شد")}else{const e=c?c.e:"unknown";up(o=>({code:{...o.code,st:"err",err:e}}));setSay(WHY[e])}},900)},
    remove:()=>{up({code:{open:true,val:"",st:"idle",focus:true}});setSay("کد تخفیف برداشته شد")},
    pay:()=>{if(!plan)return;up({view:"gateway"});top();later(()=>up({view:"result",res:RQ==="no"?"no":"wait"}),1900)},
    retry:()=>{up({view:"plans",res:"ok"});top()},
    plans:()=>{up({view:"plans",res:"ok",code:{open:false,val:"",st:"idle"}});top()}
  };
  const card=html`<${Card} st=${st} act=${act} plan=${plan} dv=${dv} total=${total} end=${end} ap=${ap} reduced=${reduced}/>`;
  let body;
  if(st.view==="plans")body=html`<${Fade} k="plans" cls="sbp-in" reduced=${reduced}>
      <${Head}/>
      ${st.back&&html`<div class="sbk ok" role="status"><${I} n="check-circle"/><span>وارد شدید. طرح <b>«${plan.n}»</b> را برایتان نگه داشتیم.</span></div>`}
      ${st.guest&&html`<div class="sbk gu"><${I} n="lock"/><span>برای خرید، اول وارد شوید. هر طرحی را بزنید، پس از ورود با همان طرح به اینجا برمی‌گردید.</span></div>`}
      ${!st.guest&&st.sub==="active"&&html`<${Now}/>`}
      ${list.length?html`<${Plans} list=${list} sel=${st.guest?null:st.sel} onPick=${act.pick} reduced=${reduced}/>`:html`<${NoPlans}/>`}
      ${list.length>0&&(desk?html`<aside class="sbs" aria-label="خلاصه‌ی خرید">${card}</aside>`
        :html`<${AnimatePresence} initial=${false}>${plan&&!st.guest&&html`<${motion.section} key="s" class="sbs" aria-label="خلاصه‌ی خرید" style=${{overflow:"hidden"}}
            initial=${reduced?{opacity:0}:{height:0,opacity:0}} animate=${{height:"auto",opacity:1,transitionEnd:{overflow:"visible"}}} exit=${{height:0,opacity:0}}
            transition=${reduced?{duration:.15}:{height:SOFT,opacity:{duration:.3,ease:EASE}}}>${card}</${motion.section}>`}</${AnimatePresence}>`)}
    </${Fade}>`;
  else if(st.view==="guestgo")body=html`<${Fade} k="gg" cls="lg-in" reduced=${reduced}><${GuestGo} plan=${plan} reduced=${reduced}/></${Fade}>`;
  else if(st.view==="gateway")body=html`<${Fade} k="gw" cls="lg-in" reduced=${reduced}><${Gateway} plan=${plan} total=${total} reduced=${reduced}/></${Fade}>`;
  else body=html`<${Fade} k="rs" reduced=${reduced}><${Result} st=${st} act=${act} plan=${plan} total=${total} end=${end} reduced=${reduced}/></${Fade}>`;
  const bar=!desk&&st.view==="plans"&&plan&&!st.guest&&list.length>0;
  return html`<${React.Fragment}>
    <${Header} user=${!st.guest} desk=${desk}/>
    <main class="sbp" id="page">${body}</main>
    <div class="sbv"><${Review}/></div>
    <p class="acsr" role="status" aria-live="polite">${say}</p>
    <${AnimatePresence} initial=${false}>${bar&&html`<${motion.div} key="bar" class="sbbar"
        initial=${reduced?{opacity:0}:{y:"110%"}} animate=${{y:"0%",opacity:1}} exit=${reduced?{opacity:0}:{y:"110%",transition:{duration:.22,ease:EASE_IN}}} transition=${reduced?{duration:.15}:PANEL}>
      <${PayBtn} plan=${plan} total=${total} act=${act} reduced=${reduced}/>
    </${motion.div}>`}</${AnimatePresence}>
  </${React.Fragment}>`;
}
ReactDOM.createRoot(document.getElementById("app")).render(html`<${App}/>`);
</script>
</body></html>
