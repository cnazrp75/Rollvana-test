<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rollvana Home</title><meta name="theme-color" content="#0A0A0C">
<link rel="preload" href="../home/media/vendor/iranyekanx.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:IRANYekanX;src:url(../home/media/vendor/iranyekanx.woff2) format("woff2");font-weight:100 1000;font-display:swap}
/* Rollvana v4 · one system for every page
   Rules: one neutral canvas, one brand colour used only for state (active, progress, focus),
   8pt spacing, large section gaps, one card per job. */
:root{
  --bg:#0A0A0C; --s1:#131317; --s2:#1A1A1F; --s3:#232329;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#F3F3F6; --tx2:rgba(243,243,246,.66); --tx3:rgba(243,243,246,.42);
  --brand:#9A86FF; --gold:#F2C46B; --pos:#5FD394; --neg:#EE7E7E;
  --f:IRANYekanX,system-ui,sans-serif;
  --wrap:1240px; --pad:40px; --gap:88px;
  --r:12px; --r2:18px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (max-width:900px){:root{--pad:24px;--gap:64px}}
@media (max-width:560px){:root{--pad:18px;--gap:52px}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color-scheme:dark;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 15px/1.8 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01";overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
svg.i{width:20px;height:20px;flex:none;fill:currentColor}
.en{font-family:var(--f);direction:ltr;unicode-bidi:isolate}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:8px}

/* ---------- header (same on every page) ---------- */
.hd{position:fixed;inset:0 0 auto;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hd.solid{background:rgba(10,10,12,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:var(--line)}
.hd .wrap{height:72px;display:flex;align-items:center;gap:40px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{height:20px;width:auto;fill:#fff}
.logo .sym{height:24px}
.nav{display:flex;gap:28px;font-size:14px;color:var(--tx2)}
.nav a{position:relative;padding:6px 0;transition:color .2s}
.nav a:hover{color:var(--tx)}
.nav a.on{color:var(--tx)}
.nav a.on::after{content:"";position:absolute;inset:auto 0 -2px;height:2px;border-radius:2px;background:var(--brand)}
.hd .end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);transition:background .2s,color .2s}
.ib:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.av{width:32px;height:32px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--tx2)}
@media (max-width:900px){.nav{display:none}.hd .wrap{height:60px}}

/* bottom bar on phones (same on every page) */
.tb{display:none}
@media (max-width:900px){
  .tb{display:flex;position:fixed;inset:auto 0 0;z-index:50;background:rgba(10,10,12,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .tb a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx3)}
  .tb a.on{color:var(--tx)}
  .tb a.on svg{color:var(--brand)}
  body{padding-bottom:72px}
}

/* ---------- buttons (same on every page) ---------- */
.btn{height:48px;padding:0 24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;white-space:nowrap;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:#fff;color:#0A0A0C}
.btn.pri:hover{background:#E6E6EC}
.btn.sec{background:rgba(255,255,255,.1);color:var(--tx)}
.btn.sec:hover{background:rgba(255,255,255,.16)}
.btn.ic{width:48px;padding:0}
.btn small{font-weight:500;opacity:.6;font-size:13px}
.lnk{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--tx2);transition:color .2s}
.lnk:hover{color:var(--tx)}
.lnk svg{width:16px;height:16px}

/* ---------- hero (same component on home and title) ---------- */
.hero{position:relative;min-height:min(86vh,820px);display:flex;align-items:flex-end;isolation:isolate}
.hero.sm{min-height:min(76vh,720px)}
.hero .bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.hero .bg img{width:100%;height:100%;object-fit:cover;transition:opacity .9s var(--ease)}
.hero .bg::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to top,var(--bg) 2%,rgba(10,10,12,.72) 34%,rgba(10,10,12,.12) 70%,rgba(10,10,12,.5)),
  linear-gradient(to left,rgba(10,10,12,.78),rgba(10,10,12,0) 62%)}
.hero .wrap{width:100%;padding-bottom:56px}
.hc{max-width:560px}
.eyebrow{font-size:13px;color:var(--tx2);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.hero h1{font-size:48px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:12px 0 4px}
.hero .en-t{font-size:14px;color:var(--tx3);display:block;text-align:right}
.hero p.syn{margin-top:20px;color:var(--tx2);font-size:15px;line-height:1.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.score{display:inline-flex;align-items:center;gap:6px;color:var(--tx);font-weight:700}
.score svg{width:16px;height:16px;color:var(--gold)}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--tx)}
@media (max-width:560px){
  .hero{min-height:78vh}.hero.sm{min-height:70vh}
  .hero h1{font-size:32px}
  .hero .wrap{padding-bottom:32px}
  .acts .btn.pri{flex:1}
}

/* ---------- sections ---------- */
.section{margin-top:var(--gap)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
.sh h2{font-size:22px;font-weight:800;letter-spacing:-.005em}
.sh p{font-size:13px;color:var(--tx3);margin-top:2px}
.row{display:grid;gap:24px 20px;grid-template-columns:repeat(6,minmax(0,1fr))}
.row.w{grid-template-columns:repeat(4,minmax(0,1fr))}
.row.w3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){
  .row,.row.w,.row.w3{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .row>*{flex:0 0 38%;scroll-snap-align:start}
  .row.w>*,.row.w3>*{flex:0 0 72%}
}
@media (max-width:560px){.row>*{flex-basis:42%}.row.w>*,.row.w3>*{flex-basis:80%}}

/* poster card · one style everywhere */
.pc{display:block}
.pc .im{aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;background:var(--s1);position:relative}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.pc:hover .im img{transform:scale(1.04)}
.pc h3{font-size:14px;font-weight:700;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:8px;margin-top:2px;white-space:nowrap}
.meta .score{font-weight:600;color:var(--tx2);gap:4px}
.meta .score svg{width:13px;height:13px}
.meta .new{color:var(--brand);font-weight:600}

/* wide card · continue watching, episodes, articles */
.wc{display:block}
.wc .im{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--s1);position:relative}
.wc .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.wc:hover .im img{transform:scale(1.03)}
.wc .pb{position:absolute;inset:auto 12px 12px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.wc .pb i{display:block;height:100%;background:var(--brand);border-radius:3px}
.wc .pl{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .25s;background:rgba(0,0,0,.25)}
.wc .pl span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);color:#0A0A0C;display:grid;place-items:center}
.wc:hover .pl{opacity:1}
.wc h3{font-size:15px;font-weight:700;margin-top:12px;line-height:1.6}
.wc .k{font-size:12px;color:var(--tx3)}

/* ---------- tabs (title page; same underline as the nav) ---------- */
.tabs{position:sticky;top:72px;z-index:40;background:rgba(10,10,12,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:32px;overflow-x:auto;scrollbar-width:none}
.tabs button{position:relative;padding:18px 0;font-size:15px;font-weight:600;color:var(--tx3);white-space:nowrap;transition:color .2s}
.tabs button:hover{color:var(--tx2)}
.tabs button.on{color:var(--tx)}
.tabs button.on::after{content:"";position:absolute;inset:auto 0 -1px;height:2px;border-radius:2px;background:var(--brand)}
.tabs button sup{font-size:11px;color:var(--tx3);margin-inline-start:4px;top:-.3em}
@media (max-width:900px){.tabs{top:60px}.tabs .wrap{gap:24px}}

/* segmented control */
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--s1);gap:2px}
.seg button{height:36px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--tx3);transition:background .2s,color .2s}
.seg button.on{background:var(--s3);color:var(--tx)}

/* plain lists */
.dl{display:grid;grid-template-columns:auto 1fr;gap:14px 32px;font-size:14px}
.dl dt{color:var(--tx3)}
.dl dd{color:var(--tx)}

/* ---------- footer (same on every page) ---------- */
.ft{margin-top:calc(var(--gap) * 1.4);border-top:1px solid var(--line);padding:48px 0 56px;color:var(--tx3);font-size:13px}
.ft .wrap{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center}
.ft .logo svg{height:16px;fill:var(--tx2)}
.ft nav{display:flex;gap:24px;flex-wrap:wrap}
.ft nav a:hover{color:var(--tx)}
.ft .cp{margin-inline-start:auto}
@media (max-width:560px){.ft .cp{margin:0;width:100%}}

.fade{animation:fade .5s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* home only */
.hdots{display:flex;gap:8px;margin-top:48px}
.hdots button{width:32px;height:16px;display:flex;align-items:center}
.hdots i{display:block;width:100%;height:2px;border-radius:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.hdots button.on i::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:right;animation:fill 8s linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:560px){.hdots{margin-top:28px}}

.gen{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.gen a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 4px;border-bottom:1px solid var(--line);transition:color .2s,padding .25s var(--ease)}
.gen a:nth-child(4n+1),.gen a:nth-child(4n+2),.gen a:nth-child(4n+3){border-inline-end:1px solid var(--line);padding-inline-end:24px}
.gen a:not(:nth-child(4n+1)){padding-inline-start:24px}
.gen span{font-size:16px;font-weight:700}
.gen small{font-size:12.5px;color:var(--tx3)}
.gen a:hover span{color:var(--brand)}
@media (max-width:900px){
  .gen{grid-template-columns:repeat(2,1fr)}
  .gen a{padding:16px 0!important;border-inline-end:0!important}
  .gen a:nth-child(odd){padding-inline-end:20px!important;border-inline-end:1px solid var(--line)!important}
  .gen a:nth-child(even){padding-inline-start:20px!important}
}

let cur = 0, timer;
const imgs = [...document.querySelectorAll("#hero .bg img")], dots = [...document.querySelectorAll("#hdots button")];
function show(n){
  cur = n; imgs.forEach((im, k) => im.style.opacity = k === n ? 1 : 0);
  dots.forEach((d, k) => { d.classList.toggle("on", k === n); d.querySelector("i").style.animation = "none"; void d.offsetWidth; d.querySelector("i").style.animation = ""; });
  $("#hc").innerHTML = heroCopy(FEAT[n]);
  clearTimeout(timer); timer = setTimeout(() => show((cur + 1) % FEAT.length), 8000);
}

show(0);
